","cols":2,"itens":[{"t":"Estimulante","d":"**Aumenta a atividade** de um órgão ou tecido. Exemplo: a cafeína estimula o sistema nervoso central (SNC)."},{"t":"Depressor","d":"**Diminui as funções** de um tecido ou órgão. Exemplo: a morfina deprime o SNC."},{"t":"Cumulativo","d":"A eliminação é **mais lenta que a absorção**, e a concentração vai aumentando. Exemplo: digitalina."},{"t":"Anti-infeccioso","d":"Capaz de **destruir os micro-organismos** responsáveis por uma infecção."},{"t":"Antagônico","d":"Duas ou mais substâncias administradas têm **efeito contrário**."}]},{"t":"callout","kind":"nota","titulo":"SNC","texto":"**SNC** é a sigla de Sistema Nervoso Central: o cérebro e a medula espinhal. Você vai ver essa sigla muitas vezes ao longo do curso."}]},{"titulo":"Para que serve o tratamento? Três finalidades","blocos":[{"t":"texto","p":["Ao receber um medicamento, o paciente está passando por um tipo de tratamento. As ações terapêuticas mais comuns são:"]},{"t":"cards","cols":3,"itens":[{"t":"Curativa","tag":"ou específica","d":"**Remove o agente causador** da doença. Exemplo: o antibiótico elimina a bactéria."},{"t":"Paliativa","tag":"ou sintomática","d":"**Alivia sintomas** de uma doença, sem necessariamente tratar a causa. Exemplo: analgésico."},{"t":"Substitutiva","tag":"reposição","d":"**Repõe substâncias** que estão ausentes no organismo. Exemplo: insulina."}]},{"t":"callout","kind":"memo","titulo":"Paliativo não é “pior”","texto":"Tratar o sintoma é importante: um analgésico alivia a dor e traz conforto, mesmo sem resolver a causa. As três finalidades são diferentes, não hierárquicas."},{"t":"pense","q":"Um paciente com febre recebe um antitérmico. A febre baixa, mas a infecção que a causou continua. Qual é a ação terapêutica?","a":"Paliativa (sintomática): ela alivia o sintoma, mas não remove a causa."}]},{"titulo":"Receptores: a fechadura e as chaves","blocos":[{"t":"texto","p":["Na superfície ou dentro das células existem estruturas chamadas **receptores**. Cada um funciona como uma **fechadura**. Quando a “chave” certa encaixa e gira, a fechadura abre e a célula reage. Os fármacos fazem o papel de chaves, de vários tipos:"]},{"t":"cards","cols":1,"itens":[{"t":"Agonista","tag":"a chave que abre","d":"Fármaco que **intensifica ou estimula** um receptor. Ele se encaixa e produz a resposta. Exemplo do módulo: a **dobutamina** estimula receptores beta do coração e aumenta a força de contração."},{"t":"Antagonista","tag":"a chave que trava","d":"Fármaco que **interage com o receptor, mas não o estimula**. Ele ocupa a fechadura e **impede as ações de um agonista**. Exemplo clássico (complemento ao módulo): os betabloqueadores, como o propranolol, bloqueiam receptores beta."}]},{"t":"cards","cols":2,"itens":[{"t":"Antagonista competitivo","d":"**Compete com o agonista** pelos sítios receptores: os dois disputam a mesma fechadura."},{"t":"Antagonista não competitivo","d":"**Liga-se aos sítios receptores e bloqueia** os efeitos do agonista."}]},{"t":"pense","q":"Por que um antagonista, que “não faz nada” no receptor, pode ter um efeito importante?","a":"Porque ocupa o receptor e impede que o agonista (inclusive o natural do corpo) produza a resposta. O efeito dele é bloquear."}]},{"titulo":"Farmacoterapia: o paciente também conta","blocos":[{"t":"texto","p":["**Farmacoterapia** é o uso de medicamentos para **combater doenças, prevenir e diagnosticar**. Escolher o fármaco adequado é só metade da tarefa: é preciso olhar para o paciente que vai receber."]},{"t":"lista","titulo":"Fatores individuais que mudam a resposta","itens":["Idade","Função cardiovascular, gastrointestinal, hepática (fígado) e renal (rins)","Dieta","Doenças que o paciente já tem","Interação com outros medicamentos que ele usa"]},{"t":"callout","kind":"atencao","titulo":"O que isso significa no seu plantão","texto":"Ao administrar, observe o paciente, pergunte sobre queixas novas e **registre e comunique** o que for diferente. Seu olhar é parte da farmacoterapia."}]}],"resumo":["Farmacodinâmica estuda o que o fármaco faz no corpo: a ação (interação com proteínas, enzimas ou receptores) gera o efeito.","Ação local: age no ponto de aplicação, sem passar pelo sangue. Sistêmica: é absorvida e age pelo sangue. Remota: um órgão estimulado estimula outro. Local-geral: começa local e depois vira geral.","Ações locais: antisséptico, adstringente, irritante, paliativo, emoliente e anestésico.","Ações sistêmicas: estimulante, depressor, cumulativo, anti-infeccioso e antagônico.","Ações terapêuticas: curativa (remove a causa), paliativa (alivia sintomas) e substitutiva (repõe o que falta).","Agonista estimula o receptor. Antagonista ocupa o receptor sem estimulá-lo e impede o agonista; pode ser competitivo ou não competitivo.","Farmacoterapia exige olhar para o paciente: idade, rins, fígado, coração, intestino, dieta, doenças e interações."],"glossario":[{"t":"Receptor","d":"Estrutura da célula com a qual o fármaco interage, como uma fechadura."},{"t":"Enzima","d":"Proteína que acelera reações químicas no corpo."},{"t":"SNC","d":"Sistema nervoso central: cérebro e medula espinhal."},{"t":"Diurese","d":"Produção e eliminação de urina."},{"t":"Mucosa","d":"Camada úmida que reveste o interior de órgãos e cavidades."},{"t":"Sintoma","d":"Sinal ou queixa causado por uma doença, como dor ou febre."}]}},{"id":"m4","n":4,"titulo":"Farmacocinética: A Jornada","curto":"ADME","sub":"Absorção, distribuição, biotransformação e excreção.","min":10,"selo":"Navegador ADME","icone":"i-dna","pulso":"Agora o foco é o caminho: o que o corpo faz com o fármaco. Vou te mostrar a viagem completa de um comprimido.","objetivo":"Acompanhar as quatro etapas da farmacocinética, entender o efeito de primeira passagem e as formas de atravessar membranas.","treino":[{"t":"game","id":"g4-adme"},{"t":"game","id":"g4-ordem"},{"t":"game","id":"g4-passagem"},{"t":"game","id":"g4-membrana"},{"t":"game","id":"g4-orgao"}],"aula":{"tempo":20,"intro":"Esta é a aula mais longa da parte básica. Vamos acompanhar a viagem do fármaco pelo corpo, etapa por etapa, e explicar cada conceito com calma.","secoes":[{"titulo":"A viagem completa: ADME","blocos":[{"t":"texto","p":["**Farmacocinética** é o caminho que o medicamento faz no organismo. Ela não trata do mecanismo de ação (isso é farmacodinâmica), e sim das etapas que a droga sofre **desde a administração até a excreção**.","São quatro etapas, resumidas na sigla **ADME**:"]},{"t":"fluxo","passos":[{"t":"A · Absorção","d":"entra no sangue"},{"t":"D · Distribuição","d":"circula até o local de ação"},{"t":"M · Biotransformação","d":"é transformado, no fígado"},{"t":"E · Excreção","d":"sai do organismo"}]},{"t":"callout","kind":"memo","titulo":"Atenção a este detalhe do módulo","texto":"Uma vez que o fármaco está no organismo, as etapas **acontecem ao mesmo tempo**. Dividir em quatro é apenas um recurso didático, para facilitar o estudo."},{"t":"callout","kind":"exemplo","titulo":"Analogia da viagem","texto":"Imagine uma encomenda: ela **entra** no sistema (absorção), é **entregue pelas ruas** da cidade (distribuição), é **reembalada** no centro de distribuição (biotransformação) e as sobras de embalagem são **descartadas** (excreção)."}]},{"titulo":"Primeiro, a barreira: como o fármaco atravessa as membranas","blocos":[{"t":"texto","p":["Quase tudo que o fármaco faz no corpo exige **atravessar membranas**: absorção, distribuição, biotransformação e eliminação envolvem passar pelas membranas das células. Por isso vale entender antes o que é essa barreira.","A membrana de uma célula é feita de **uma dupla camada de gordura (lipídios)** com proteínas espalhadas. Por ser feita de gordura, ela deixa passar mais facilmente o que é **solúvel em gordura (lipossolúvel)** e dificulta o que é **solúvel em água (hidrossolúvel)**, como acontece quando você mistura óleo e água."]},{"t":"texto","p":["A capacidade de uma droga de atravessar as paredes dos capilares, as membranas das células e outras barreiras depende do **tamanho e da forma da molécula** e da sua **solubilidade em água e em gordura**. O módulo descreve **seis caminhos**:"]},{"t":"cards","cols":1,"itens":[{"t":"Difusão passiva de lipossolúveis","tag":"principal","d":"O fármaco “atravessa” a membrana de gordura, indo de onde há mais para onde há menos, **sem gastar energia**. É o **principal mecanismo** de transporte dos fármacos. A velocidade depende da concentração, do coeficiente de partição óleo/água, do pH e da área disponível."},{"t":"Difusão passiva de hidrossolúveis","d":"Só passam por **canais aquosos** da membrana (cerca de 8 Å), que restringem moléculas maiores do que as de peso molecular 150. **Não é o principal** mecanismo."},{"t":"Transporte ativo","d":"Usa **energia** e leva a substância **contra o gradiente** (de onde há menos para onde há mais). É seletivo, saturável e pode sofrer inibição competitiva. Ocorre em neurônios, túbulos renais e hepatócitos."},{"t":"Difusão facilitada","d":"Usa **transportadores**, a favor do gradiente e **sem gasto de energia**. Ocorre principalmente com substâncias do próprio corpo (endógenas)."},{"t":"Pinocitose e fagocitose","d":"A membrana **engloba** uma vesícula com o conteúdo extracelular. Importante para algumas macromoléculas, não para moléculas pequenas."},{"t":"Lacunas intercelulares","d":"Nos capilares (**exceto no SNC**), o fluxo pelas lacunas entre as células é o principal caminho. Por isso é importante nos rins (filtração) e na absorção das vias **IM e SC**."}]},{"t":"texto","titulo":"O papel do pH","p":["Só o fármaco na forma **não ionizada** (sem carga elétrica) atravessa bem a membrana. O pH do local em que o remédio se dissolve define quanto dele fica nessa forma. A regra de bolso: as substâncias tendem a ficar ionizadas em ambientes de pH oposto ao delas. Assim, **fármacos ácidos** ionizam mais em locais básicos, e **fármacos básicos** ionizam mais em locais ácidos."]},{"t":"pense","q":"Um fármaco muito lipossolúvel tende a atravessar a membrana com facilidade ou com dificuldade?","a":"Com facilidade, porque a membrana é feita de gordura. A difusão passiva de lipossolúveis é o principal mecanismo de transporte dos fármacos."}]},{"titulo":"A · Absorção","blocos":[{"t":"texto","p":["**Absorção** é a passagem do fármaco do **local de administração para o plasma** (a parte líquida do sangue). Ela começa quando se escolhe a via de administração e termina quando a droga entra na corrente sanguínea.","Duas observações importantes do módulo:"]},{"t":"lista","itens":["As vias **endovenosa** e **intra-arterial** não passam pela absorção: o fármaco já entra direto na circulação.","Em alguns casos, como a inalação de um aerossol ou a aplicação tópica, a absorção **não é necessária** para a ação. Mas para a grande maioria dos fármacos só há ação farmacológica **se houver absorção**."]},{"t":"texto","titulo":"O que interfere na absorção","p":["Vários fatores podem acelerar, retardar ou reduzir a absorção:"]},{"t":"cards","cols":2,"itens":[{"t":"pH do local","d":"Define quanto do fármaco fica na forma que atravessa a membrana."},{"t":"Forma farmacêutica","d":"Comprimido, cápsula, solução, drágea: cada forma libera o fármaco de um jeito."},{"t":"Doenças","d":"Condições como **úlceras** podem mudar a absorção."},{"t":"Dose e concentração","d":"Quanto foi administrado e a concentração no local e na circulação."},{"t":"Motilidade gástrica","d":"A velocidade com que o estômago e o intestino se movimentam."},{"t":"Fluxo de sangue e área de absorção","d":"Quanto mais sangue e mais superfície, mais rápida a absorção."},{"t":"Alimentos","d":"Ingerir com ou sem alimentos altera a absorção de alguns fármacos."},{"t":"Natureza química e peso molecular","d":"As características da própria molécula."}]},{"t":"texto","titulo":"Biodisponibilidade","p":["Chamamos de **biodisponibilidade** a **velocidade e a extensão** com que o princípio ativo é absorvido a partir da forma farmacêutica. Na via endovenosa, por definição, a biodisponibilidade é de **100%**, pois toda a dose entra direto na circulação."]}]},{"titulo":"O efeito de primeira passagem","blocos":[{"t":"texto","p":["Quando você engole um comprimido, o fármaco é absorvido no intestino. O sangue que vem do intestino **passa primeiro pelo fígado** antes de se espalhar pelo resto do corpo. O fígado é o grande órgão que transforma substâncias, e ele pode **metabolizar parte do fármaco antes que ele chegue à circulação geral**.","Isso é o **efeito de primeira passagem**: a metabolização do medicamento pelo fígado (e pela microbiota intestinal) **antes** que ele chegue à circulação sistêmica."]},{"t":"fluxo","titulo":"O caminho do comprimido","passos":[{"t":"Boca e estômago","d":"engole"},{"t":"Intestino","d":"absorve"},{"t":"Fígado","d":"primeira passagem"},{"t":"Circulação geral","d":"o que sobrou age"}]},{"t":"cards","cols":3,"itens":[{"t":"Via oral","tag":"sofre","d":"Está sujeita ao efeito de primeira passagem."},{"t":"Via retal","tag":"sofre pouco","d":"Também, mas **em proporção bem reduzida**."},{"t":"EV e sublingual","tag":"evitam","d":"Entram direto na circulação sistêmica, sem passar antes pelo fígado."}]},{"t":"callout","kind":"memo","titulo":"Por que isso muda a conduta","texto":"A primeira passagem explica por que algumas substâncias **precisam de via diferente da oral** ou de doses diferentes. Ela é um dos motivos de a via prescrita ser tão importante: trocar a via muda o quanto do fármaco chega ao sangue."}]},{"titulo":"D · Distribuição","blocos":[{"t":"texto","p":["Depois de absorvido, o fármaco é **levado pela circulação** para os tecidos. Ele chega primeiro aos órgãos **mais irrigados** (sistema nervoso central, pulmão e coração) e depois é **redistribuído** para tecidos menos irrigados, como o tecido adiposo (gordura). É nessa etapa que a droga chega ao ponto onde vai atuar.","Após a absorção, o fármaco se distribui nos líquidos do corpo e pode ser armazenado nos tecidos, metabolizado ou excretado diretamente."]},{"t":"texto","titulo":"Fração livre e fração ligada","p":["No sangue, parte do fármaco **viaja grudada em proteínas do plasma**, como a **albumina**. Essa parte é chamada **fração ligada**: ela não consegue agir, funciona como um **reservatório** e é eliminada mais devagar. A parte que viaja solta é a **fração livre**, e só ela age."]},{"t":"callout","kind":"exemplo","titulo":"Analogia do ônibus","texto":"Pense no fármaco como passageiros. Os que estão **dentro do ônibus** (ligados à proteína) estão só viajando. Só os que **descem no ponto** (fração livre) chegam ao destino e atuam. Se há menos ônibus (menos proteínas), mais passageiros ficam soltos pelas ruas."},{"t":"cards","cols":1,"itens":[{"t":"Quando faltam proteínas","d":"Desnutrição, hepatite e cirrose reduzem as proteínas do plasma (as células do fígado produzem essas proteínas). Com menos “ônibus”, **aumenta a fração livre** e o efeito pode ficar mais intenso."},{"t":"Deslocamento competitivo","d":"Um fármaco muito ligado a proteínas pode ser **deslocado** por outro que também se liga muito. Isso é uma forma de interação entre medicamentos."},{"t":"Volume de distribuição","d":"É um **volume aparente**: o volume de líquido que seria necessário para conter todo o fármaco do corpo na mesma concentração do plasma. Mostra que a distribuição não é homogênea."}]},{"t":"pense","q":"Qual fração do fármaco no sangue é a que age: a ligada ou a livre?","a":"A livre. A ligada às proteínas funciona como um reservatório e não age enquanto estiver ligada."}]},{"titulo":"M · Biotransformação (metabolismo)","blocos":[{"t":"texto","p":["**Biotransformação** é a fase em que a droga é **transformada em um composto mais hidrossolúvel**, para facilitar a excreção. Ela ocorre principalmente no **fígado**, mas a maioria dos tecidos consegue metabolizar drogas específicas, conforme as enzimas que possui.","Depois das reações de metabolização, os compostos formados tendem a ser **mais solúveis em água e menos ativos biologicamente**."]},{"t":"cards","cols":2,"itens":[{"t":"Fase 1","tag":"preparar","d":"**Oxidação, redução e hidrólise.** A maior parte das oxidações é feita por enzimas do grupo **citocromo P-450**, no fígado. Essa fase “prepara” a molécula e aumenta sua polaridade."},{"t":"Fase 2","tag":"conjugar","d":"**Conjugação**: um grupo químico grande (como o ácido glicurônico) é ligado à molécula. Isso aumenta a solubilidade em água e facilita a excreção."}]},{"t":"texto","p":["Resultado da fase 1: o metabólito pode ser **inativo, menos ativo ou, às vezes, mais ativo** que a molécula original. Quando o próprio metabólito é a forma ativa, o composto original é chamado de **pró-droga**. Exemplo do módulo: o **enalapril**.","Um exemplo completo do módulo: o **ácido acetilsalicílico** (AAS) é metabolizado por hidrólise em ácido salicílico, que ainda tem atividade. Depois é conjugado ao ácido glicurônico ou à glicina, formando dois metabólitos **sem atividade e mais hidrossolúveis**, que os rins eliminam com facilidade."]},{"t":"callout","kind":"memo","titulo":"Ressalva do módulo","texto":"Um mesmo fármaco pode sofrer **várias vias de metabolização**, e nem sempre passa pelas duas fases, nem na ordem apresentada."},{"t":"texto","titulo":"Indução enzimática e diferenças entre pessoas","p":["Algumas substâncias, como certas **drogas, álcool, tabagismo e constituintes da alimentação**, **estimulam o corpo a produzir mais enzimas**. Esse aumento se chama **indução** e pode mudar o efeito de outros medicamentos. Além disso, as enzimas variam de pessoa para pessoa por razões genéticas: por isso o mesmo remédio pode ser metabolizado mais rápido ou mais devagar em indivíduos diferentes."]}]},{"titulo":"E · Excreção","blocos":[{"t":"texto","p":["**Excreção** é a remoção dos compostos do organismo para o meio externo. Os locais de excreção chamam-se **emunctórios**. A principal via é o **rim**, mas também há:"]},{"t":"lista","itens":["Fezes e secreção biliar (bile)","Pulmões (para fármacos gasosos ou voláteis)","Suor, lágrimas e saliva","Leite materno (a glândula mamária)"]},{"t":"callout","kind":"nota","titulo":"Pele e cabelo","texto":"A pele e o cabelo **não são órgãos de excreção**, mas servem de **depósito** para algumas substâncias."},{"t":"texto","titulo":"Como o rim elimina","p":["A unidade funcional do rim é o **néfron**. O sangue arterial passa primeiro pelos **glomérulos**, que filtram parte da água do plasma e do que está dissolvido nela. Mais adiante, muitas substâncias são ainda **secretadas** nos túbulos. Por fim, a maior parte da água é **reabsorvida** ao longo do néfron. Assim, a eliminação renal de um fármaco resulta de **três processos**:"]},{"t":"fluxo","passos":[{"t":"Filtração glomerular","d":"o sangue é filtrado"},{"t":"Secreção tubular","d":"o rim joga mais substâncias na urina"},{"t":"Reabsorção tubular","d":"parte volta ao sangue"}]},{"t":"lista","itens":["Os metabólitos das fases 1 e 2 costumam ser eliminados **mais rápido** que o composto original.","O **pH da urina** (de cerca de 4,5 a 8) influencia: se a urina está ácida, há reabsorção de ácidos fracos; se está básica, há reabsorção de bases fracas.","Doenças dos rins (**nefropatias**) podem prejudicar a eliminação de algumas drogas.","Interações entre drogas podem mudar a velocidade de eliminação por qualquer via."]},{"t":"pense","q":"Por que um paciente com doença renal pode ter mais risco de acúmulo de certos medicamentos?","a":"Porque o rim é a principal via de excreção. Se ele funciona mal, a eliminação fica lenta e o fármaco pode se acumular no organismo."}]}],"resumo":["Farmacocinética é o caminho do fármaco: Absorção, Distribuição, Biotransformação (metabolismo) e Excreção (ADME). As etapas acontecem ao mesmo tempo; a divisão é didática.","Para atravessar membranas (feitas de gordura), a difusão passiva de lipossolúveis é o principal mecanismo. Há também difusão de hidrossolúveis, transporte ativo, difusão facilitada, pinocitose e passagem por lacunas intercelulares.","Absorção: do local de administração ao plasma. EV e intra-arterial não têm absorção; biodisponibilidade da EV é 100%.","Efeito de primeira passagem: o fígado metaboliza parte do fármaco antes de ele chegar à circulação. Atinge a via oral, e em menor grau a retal.","Distribuição: pela circulação, primeiro para órgãos mais irrigados. Só a fração livre (não ligada a proteínas) age.","Biotransformação: no fígado, deixa o composto mais hidrossolúvel (fase 1: oxidação, redução, hidrólise; fase 2: conjugação). Pró-droga só fica ativa depois de transformada.","Excreção: principalmente pelos rins (filtração, secreção e reabsorção), mas também por fezes, bile, pulmões, suor, lágrimas, saliva e leite materno."],"glossario":[{"t":"Plasma","d":"Parte líquida do sangue."},{"t":"Hidrossolúvel","d":"Que se dissolve bem em água."},{"t":"Lipossolúvel","d":"Que se dissolve bem em gordura."},{"t":"Gradiente","d":"Diferença de concentração entre dois lados de uma membrana."},{"t":"Metabólito","d":"Produto formado quando o corpo transforma um fármaco."},{"t":"Emunctório","d":"Local do corpo por onde substâncias são eliminadas."},{"t":"Néfron","d":"Unidade funcional do rim, que filtra o sangue."},{"t":"Sistêmico","d":"Que alcança o corpo todo, pela circulação."}]}},{"id":"m5","n":5,"titulo":"Vias de Administração","curto":"Vias","sub":"A estrada escolhida define a velocidade, a dose e o risco.","min":10,"selo":"Rota Certa","icone":"i-syringe","pulso":"A via é o endereço de entrega do medicamento. Escolheu errado, o pacote chega atrasado, incompleto ou nem chega.","objetivo":"Comparar as principais vias, suas vantagens e desvantagens, e escolher a via mais adequada a cada situação descrita no módulo.","treino":[{"t":"game","id":"g5-vias"},{"t":"game","id":"g5-qualvia"},{"t":"game","id":"g5-procontra"}],"aula":{"tempo":18,"intro":"Aqui você aprende o que é uma via de administração, conhece cada uma delas e entende por que a escolha da via muda a velocidade e o risco do tratamento.","secoes":[{"titulo":"O que é via de administração e por que ela importa","blocos":[{"t":"texto","p":["**Via de administração** é o **caminho pelo qual o medicamento entra no organismo**: pela boca, por baixo da língua, por uma veia, por um músculo, pela pele, pela via respiratória e assim por diante.","A via decide três coisas: **quão rápido** o fármaco age, **quanto** dele chega ao sangue e **com que risco**. Por isso o módulo afirma que a via de administração é um fator importante na ação terapêutica do fármaco."]},{"t":"texto","titulo":"Duas palavras que vão aparecer muito","p":["Algumas vias passam pelo **trato gastrointestinal** (boca, estômago, intestino, reto): costumam ser chamadas de **enterais**. As que usam **injeção**, como a endovenosa, a intramuscular e a subcutânea, são chamadas de **parenterais**. Você verá a palavra “parenteral” em bulas e prescrições."]},{"t":"callout","kind":"memo","titulo":"Lembrete da aula anterior","texto":"**Absorção** é a passagem do fármaco do local de administração para o sangue. Em todas as vias existe absorção, **menos na endovenosa (EV)**, em que o fármaco já entra direto na circulação. Por isso a EV é a via mais rápida e precisa."}]},{"titulo":"Vias pela boca: oral e sublingual","blocos":[{"t":"cards","cols":1,"itens":[{"t":"Via oral (VO)","tag":"pela boca, engolindo","d":"Na grande maioria dos casos, os fármacos são tomados pela boca e **engolidos**. Em regra, cerca de **75%** de um fármaco administrado por via oral é absorvido em **1 a 3 horas**. É a via mais **segura, cômoda e econômica**. As formas (comprimidos, drágeas, cápsulas, xaropes) são simples e práticas, e podem ser feitas para liberar o fármaco aos poucos, reduzindo o número de doses e os efeitos adversos de picos altos no sangue."},{"t":"Via sublingual (SL)","tag":"debaixo da língua","d":"O fármaco é **colocado sob a língua** e absorvido pela mucosa oral, que é extremamente irrigada e ligada a vasos de bom calibre. É indicada quando se precisa de **resposta rápida**, especialmente se o fármaco é **instável ao pH do estômago** ou é metabolizado rápido pelo fígado, pois a sublingual **evita a primeira passagem**."}]},{"t":"cards","cols":2,"itens":[{"t":"Vantagens da via oral","d":"Maior segurança, comodidade e economia; esquemas fáceis de cumprir; absorção favorecida pela grande superfície das vilosidades do intestino."},{"t":"Desvantagens da via oral","d":"Náuseas, vômitos e diarreia por irritação da mucosa; absorção que varia (enzimas digestivas, estômago cheio ou vazio, formulação, pH); **exige cooperação do paciente**."},{"t":"Vantagens da via sublingual","d":"Absorção **rápida** de substâncias hidrossolúveis; reduz a metabolização no fígado por atingir direto a circulação."},{"t":"Desvantagens da via sublingual","d":"**Imprópria** para substâncias irritantes ou de sabor desagradável."}]},{"t":"pense","q":"Por que a via oral exige cooperação do paciente?","a":"Porque o paciente precisa estar em condições de engolir e de aceitar o medicamento. Se está inconsciente ou vomitando, a via oral deixa de ser adequada."}]},{"titulo":"Outras vias: retal, cutânea, ocular e inalatória","blocos":[{"t":"cards","cols":1,"itens":[{"t":"Via retal (VR)","tag":"pelo reto","d":"Usada quando se quer **efeito local** ou **efeito sistêmico**. A absorção costuma ser **irregular e incompleta**, mas a via é útil em pacientes que **não conseguem tomar pela boca**: vômitos, crianças (especialmente lactentes), idosos, transtornos psiquiátricos ou coma. Reduz a biotransformação hepática. Desvantagem: irritação da mucosa retal."},{"t":"Via cutânea e transdérmica","tag":"pela pele","d":"Usada principalmente para **efeito local sobre a pele**. A absorção pode ser considerável e levar a efeitos sistêmicos. Muitas drogas são mal absorvidas pela pele. Cada vez mais se usa a forma **transdérmica**: o fármaco vem em um **adesivo** colado a uma área de pele fina, o que mantém um nível estável e **facilita a retirada em caso de efeito indesejado**. Só serve para fármacos relativamente lipossolúveis e as preparações são caras."},{"t":"Via ocular","tag":"gotas no olho","d":"Muitos fármacos são aplicados como **gotas oculares**, e o efeito vem da absorção pelo epitélio do **saco conjuntival**."},{"t":"Via inalatória","tag":"pelo pulmão","d":"É a via usada para **anestésicos voláteis e gasosos**. Aqui o pulmão serve de via de **administração e de eliminação**. A grande área de superfície e o grande fluxo de sangue permitem **ajustes rápidos** da concentração no plasma."}]}]},{"titulo":"Vias por injeção: endovenosa, intramuscular e subcutânea","blocos":[{"t":"texto","p":["As vias injetáveis são as **parenterais**. A resposta é geralmente mais rápida do que a da via oral, mas exigem mais técnica e mais cuidado."]},{"t":"cards","cols":1,"itens":[{"t":"Endovenosa (EV)","tag":"dentro da veia","d":"É a via **mais rápida e precisa**. **Não ocorre absorção, só distribuição.** A concentração máxima que chega aos tecidos depende fundamentalmente da **rapidez da injeção**. Permite grandes volumes em infusões lentas, aceita substâncias irritantes se diluídas e permite controle da dose para evitar toxicidade."},{"t":"Intramuscular (IM)","tag":"dentro do músculo","d":"Absorção **rápida**. Serve para pacientes inconscientes. Adequada para volumes moderados, veículos aquosos, não aquosos e suspensões. A velocidade depende do local da injeção e do fluxo de sangue local."},{"t":"Subcutânea (SC)","tag":"sob a pele","d":"Absorção **boa e constante** para **soluções** e **lenta** para **suspensões**. Costuma produzir efeito mais rápido que a oral, mas depende do local e do fluxo sanguíneo."}]},{"t":"cards","cols":3,"itens":[{"t":"Riscos da EV","d":"**Superdosagem relativa** se a injeção for rápida; risco de **embolia**, irritação do endotélio da veia, **infecção** por contaminação e **reação anafilática**; impróprio para solventes oleosos e substâncias insolúveis."},{"t":"Riscos da IM","d":"**Dor**; lesões musculares por substâncias irritantes ou de pH distante do neutro; processos inflamatórios se a substância for irritante ou mal absorvida."},{"t":"Riscos da SC","d":"Facilidade de **sensibilização** do paciente; **dor e necrose** com substâncias irritantes."}]},{"t":"texto","titulo":"O que limita a velocidade da injeção IM e SC","p":["A velocidade de absorção depende da **difusão pelo tecido**, da **remoção pelo fluxo de sangue** local, da **formação de complexos** entre fármacos (como insulina com protamina ou benzilpenicilina) e das **injeções oleosas** (usadas para hormônios)."]},{"t":"callout","kind":"atencao","titulo":"Na EV, a velocidade é parte da prescrição","texto":"Em alguns medicamentos, a velocidade de aplicação é uma **instrução de segurança**: digitálicos e aminofilina por via EV devem ser aplicados **lentamente**. Injetar rápido demais pode causar superdosagem relativa."},{"t":"pense","q":"Por que a EV é mais rápida que a IM?","a":"Porque na EV o fármaco entra direto na circulação, sem etapa de absorção. Na IM ele ainda precisa passar do músculo para os vasos."}]},{"titulo":"Comparando as vias","blocos":[{"t":"tabela","cab":["Via","Onde é absorvida","Principal vantagem","Principal cuidado"],"linhas":[["Oral","Mucosa do trato gastrointestinal","Segura, cômoda e econômica","Náuseas e vômitos; exige cooperação"],["Sublingual","Mucosa oral","Absorção rápida; evita o fígado","Imprópria para substâncias irritantes ou de mau sabor"],["Retal","Mucosa retal","Serve para quem não pode usar a boca","Absorção irregular e incompleta"],["Intramuscular","Capilares do músculo","Absorção rápida; serve para inconsciente","Dor; lesão muscular"],["Endovenosa","Nenhuma: direto na circulação","Mais rápida e precisa","Embolia, infecção, anafilaxia, injeção rápida"],["Subcutânea","Capilares sob a pele","Absorção constante para soluções","Dor e necrose com irritantes"]]},{"t":"texto","titulo":"Como se escolhe a via?","p":["Quem escolhe a via é o prescritor, mas entender os critérios ajuda você a perceber quando algo não bate. Em geral, ponderam-se:"]},{"t":"lista","itens":["**Rapidez desejada** (urgência pede vias mais rápidas)","**Estado do paciente** (consciente ou não, vomitando, criança ou idoso)","**Características do fármaco** (estável ou não no estômago, irritante, lipossolúvel ou hidrossolúvel, oleoso)","**Volume a administrar**","**Risco de cada via**"]},{"t":"callout","kind":"nota","titulo":"Quem decide a via é a prescrição","texto":"A via **não pode ser trocada por conta própria**. Dar por via oral algo que é para EV, ou o contrário, é erro de via, um dos 5 certos. Se a via prescrita parece inadequada ao estado do paciente (por exemplo, via oral para quem está vomitando), **comunique ao enfermeiro**."}]},{"titulo":"O que mexe na absorção","blocos":[{"t":"texto","p":["Propriedades do fármaco e variações do organismo interferem na absorção. O módulo destaca:"]},{"t":"lista","itens":["**Natureza química** da molécula e **peso molecular**","**pH** do local onde o fármaco se dissolve","**Coeficiente de partição**, que mostra quão solúvel a molécula é em gordura em relação à água","**Motilidade gástrica**","**Área da superfície** de absorção","**Fluxo de sangue**","**Eliminação antes de chegar ao sangue** (efeito de primeira passagem)","Ingestão **com ou sem alimentos**"]},{"t":"callout","kind":"memo","titulo":"Regra de bolso do pH","texto":"Só o fármaco na forma **não ionizada** atravessa bem a membrana. Substâncias tendem a ficar ionizadas em ambiente de pH oposto ao delas: fármacos **ácidos** ionizam mais em meio **básico**, e fármacos **básicos** ionizam mais em meio **ácido**."}]}],"resumo":["Via de administração é o caminho de entrada do medicamento. Ela define velocidade, quantidade absorvida e risco.","Enteral: pelo trato gastrointestinal. Parenteral: por injeção (EV, IM, SC).","Oral: segura, cômoda e econômica, mas exige cooperação do paciente e sofre primeira passagem. Cerca de 75% são absorvidos em 1 a 3 h.","Sublingual: absorção rápida e evita a primeira passagem. Retal: útil quando a via oral não é possível, mas a absorção é irregular.","EV: mais rápida e precisa, sem absorção, 100% biodisponível; riscos de embolia, infecção, anafilaxia e superdose se for rápida.","IM: rápida, serve para inconsciente, mas dói e pode lesar o músculo. SC: constante para soluções, lenta para suspensões; dor e necrose com irritantes.","Cutânea/transdérmica: efeito local ou adesivo de liberação estável. Inalatória: anestésicos voláteis e gasosos; o pulmão administra e elimina.","A via vem da prescrição e não pode ser trocada por conta própria."],"glossario":[{"t":"Enteral","d":"Pelo trato gastrointestinal."},{"t":"Parenteral","d":"Por injeção, fora do trato gastrointestinal (EV, IM, SC)."},{"t":"Biodisponibilidade","d":"Velocidade e extensão da absorção do princípio ativo."},{"t":"Endotélio","d":"Camada de células que reveste por dentro os vasos de sangue."},{"t":"Embolia","d":"Bloqueio de um vaso por um corpo estranho, como uma bolha de ar."},{"t":"Anafilaxia","d":"Reação alérgica grave, que pode ser fatal."},{"t":"Suspensão","d":"Preparação em que partículas sólidas estão espalhadas em um líquido."},{"t":"Necrose","d":"Morte do tecido."}]}},{"id":"m6","n":6,"titulo":"Prescrição, Rótulo e Genéricos","curto":"Prescrição","sub":"Ler certo é o primeiro passo de administrar certo.","min":12,"selo":"Leitor Clínico","icone":"i-clip","pulso":"Toda administração começa numa folha de papel. Se a prescrição falha, a cadeia inteira falha. Vamos treinar o olho clínico.","objetivo":"Reconhecer os elementos de uma prescrição, seus tipos, as partes da bula e a diferença entre medicamento de referência, genérico e similar.","treino":[{"t":"game","id":"g6-inspect"},{"t":"game","id":"g6-tipos"},{"t":"game","id":"g6-bula"},{"t":"game","id":"g6-generico"},{"t":"game","id":"g6-bio"}],"aula":{"tempo":20,"intro":"Aqui você aprende a ler uma prescrição, entender uma bula e saber a diferença entre medicamento de referência, genérico e similar. Tudo começa pelo papel: se ele está errado, o resto também fica em risco.","secoes":[{"titulo":"A prescrição médica: o que é e para que serve","blocos":[{"t":"texto","p":["A **prescrição médica (PM)**, também chamada de **receita médica**, é uma **ordem escrita** dada por um profissional capacitado: médico, odontólogo ou outro profissional qualificado. É o **documento e a principal fonte de informações** para quem vai preparar e administrar o medicamento.","O papel da enfermagem é **executar a prescrição**. Isso significa seguir exatamente o que está escrito, **mas também significa conferir** se ela está completa, legível e segura. Se faltar algo ou houver dúvida, o caminho é **parar e esclarecer**, não adivinhar."]},{"t":"cards","titulo":"O que uma prescrição completa traz","cols":1,"itens":[{"t":"Data, local e identificação","d":"A **data** da prescrição e o **nome do hospital, UBS ou centro médico**. Sem data, não dá para saber se a ordem ainda vale."},{"t":"Nome do paciente","d":"Quem vai receber. Sem o nome correto, o risco é dar o medicamento para a pessoa errada."},{"t":"Nome do medicamento","d":"Em **letra legível**. Se você precisa “adivinhar” a palavra, a prescrição não está adequada."},{"t":"Dose","d":"Quanto administrar."},{"t":"Via de administração","d":"Por onde administrar: oral, endovenosa, intramuscular etc."},{"t":"Horário e/ou intervalo","d":"Em que hora e de quanto em quanto tempo."},{"t":"Assinatura e carimbo","d":"Com o **registro no conselho** do profissional. Mostra quem prescreveu e que ele tem habilitação."}]},{"t":"callout","kind":"memo","titulo":"Quando a ordem pode ser verbal","texto":"A prescrição **só poderá ser verbal em situação de emergência**. Fora disso, ela precisa estar escrita."}]},{"titulo":"Como ler uma prescrição, passo a passo","blocos":[{"t":"receita","titulo":"Exemplo de prescrição (caso fictício)","linhas":[{"k":"Data e local","v":"15/10 · Hospital Exemplo, Clínica Médica","n":"Confirma quando e onde a ordem foi feita."},{"k":"Paciente","v":"A. R. Lima · leito 12","n":"Compare com a pulseira antes de administrar."},{"k":"Medicamento","v":"Dipirona sódica","n":"Confira com o rótulo: é o mesmo princípio ativo?"},{"k":"Dose","v":"1 g","n":"Compare com a apresentação disponível (mg/mL)."},{"k":"Via","v":"Endovenosa (EV)","n":"A via de preparo e aplicação precisa ser esta."},{"k":"Horário","v":"6/6 h","n":"A cada 6 horas: quatro vezes ao dia."},{"k":"Assinatura e carimbo","v":"Dr(a). Exemplo, registro no conselho","n":"Prescrição validada por profissional habilitado."}]},{"t":"texto","titulo":"Siglas e abreviaturas mais comuns","p":["As prescrições usam abreviaturas. Elas ajudam, mas também são fonte de erro, por isso é importante conhecê-las:"]},{"t":"cards","cols":3,"itens":[{"t":"VO","d":"Via oral"},{"t":"SL","d":"Via sublingual"},{"t":"VR","d":"Via retal"},{"t":"IM","d":"Intramuscular"},{"t":"EV","d":"Endovenosa"},{"t":"SC","d":"Subcutânea"},{"t":"6/6 h","d":"De 6 em 6 horas"},{"t":"8/8 h","d":"De 8 em 8 horas"},{"t":"12/12 h","d":"De 12 em 12 horas"}]},{"t":"callout","kind":"nota","titulo":"Siglas variam","texto":"Algumas siglas mudam de um serviço para outro, e algumas são consideradas perigosas por serem confundidas com facilidade. Em caso de qualquer dúvida sobre uma sigla, **pergunte antes de executar**."}]},{"titulo":"Tipos de prescrição","blocos":[{"t":"cards","cols":1,"itens":[{"t":"Prescrição padrão","d":"Contém **quanto de medicamento o paciente deve receber e por quanto tempo**. Permanece em efeito por **tempo indefinido ou por período especificado**."},{"t":"Prescrição única","d":"Contém a prescrição de um medicamento que o paciente deve usar **apenas uma vez**."},{"t":"Prescrição imediata","d":"Contém um medicamento que o paciente deve receber **imediatamente**, em geral por **problema urgente**."},{"t":"Prescrição permanente","d":"A prescrição médica de forma permanente, elaborada e executada pelas equipes de uma instituição de saúde. Hoje é bem difundida como **protocolo**."},{"t":"Prescrição verbal e telefônica","d":"**Não é a ideal e deve ser evitada**, pois traz risco iminente de erros. Pode ocorrer em situações de urgência e **deve ser transcrita pelo médico o quanto antes**."}]},{"t":"callout","kind":"atencao","titulo":"Se uma ordem verbal for inevitável","texto":"Em urgência, uma boa prática dos serviços é **repetir a ordem em voz alta** para que o prescritor confirme (o nome do medicamento, a dose e a via). E a transcrição pelo médico precisa ser cobrada, para que a ordem fique registrada por escrito."},{"t":"pense","q":"Um paciente em crise precisa de um medicamento agora. Que tipo de prescrição se encaixa?","a":"A prescrição imediata, usada em geral para problemas urgentes. Se for dada oralmente, vale o cuidado das ordens verbais."}]},{"titulo":"Rótulo e bula","blocos":[{"t":"texto","p":["O **rótulo** e a **bula** têm um objetivo único: garantir o **uso adequado e seguro** do medicamento. O módulo descreve o modelo regulatório americano (FDA); no Brasil a lógica é a mesma, e a bula é regulada pela **Anvisa**.","A bula é um **resumo de todos os estudos** feitos desde a descoberta do fármaco, com uma apresentação equilibrada da **utilidade e dos riscos**. Aprender a navegar nela economiza tempo e evita erros."]},{"t":"cards","titulo":"As partes da bula, na ordem","cols":2,"itens":[{"t":"Descrição","d":"Marca, nome científico, forma, via, composição, classe, nome químico e informações físicas e químicas (pH, esterilidade etc.)."},{"t":"Farmacologia clínica","d":"Ações no ser humano, absorção, biotransformação, ligação a proteínas, **meia-vida**, captação por órgãos ou pelo feto, toxicidade."},{"t":"Indicações e uso","d":"Para que o fármaco foi **aprovado** e as condições especiais de uso a curto e a longo prazo."},{"t":"Contraindicações","d":"Situações em que **não se deve usar**, porque os riscos superam o benefício. Inclui hipersensibilidade, terapias associadas, doenças, idade e sexo."},{"t":"Advertências","d":"**Reações adversas graves** e riscos de segurança, limites de uso e o que fazer se ocorrerem."},{"t":"Precauções","d":"Cuidados especiais, interações com alimentos e exames, efeitos na fertilidade, gestação, lactação e crianças."},{"t":"Reações adversas","d":"Efeitos indesejáveis previsíveis e imprevisíveis, organizados por sistema ou por gravidade e frequência."},{"t":"Uso excessivo e dependência","d":"Esquema legal para substâncias controladas, tipos de uso excessivo e dependência."},{"t":"Dose excessiva","d":"Sinais, sintomas e tratamento de **superdose**."},{"t":"Dose e modo de administração","d":"Dose usual, duração, ajustes para crianças, idosos e pessoas com disfunção renal ou hepática, e **velocidades especiais** de administração parenteral."},{"t":"Formas do fármaco","d":"Apresentações, concentrações e meios de identificação (cor, revestimento, número de unidades)."}]},{"t":"callout","kind":"exemplo","titulo":"Duas perguntas e onde achar a resposta","texto":"“Posso dar este remédio a uma gestante?” → **Precauções** (e **Contraindicações**). “Em quanto tempo devo aplicar este medicamento por via EV?” → **Dose e modo de administração**."},{"t":"pense","q":"Você quer saber que sintomas indicam superdose. Em que parte da bula procura?","a":"Em “Dose excessiva”, que traz sinais, sintomas e princípios de tratamento da superdose."}]},{"titulo":"Referência, genérico e similar: uma história curta","blocos":[{"t":"texto","p":["Quando um laboratório descobre e desenvolve um medicamento novo, ele leva muitos anos e investe muito dinheiro (o módulo cita 11 a 12 anos). Em troca, ganha **direito de patente**: só ele pode vender o produto durante um período (a proteção pode durar até 20 anos).","Quando a patente acaba, outros laboratórios podem produzir o mesmo princípio ativo. O Estado exige que provem **qualidade, segurança e eficácia**. É daí que nascem os **genéricos**. No Brasil, a **Lei nº 9.787, de 1999**, instituiu o medicamento genérico, em linha com as normas internacionais e com as diretrizes da OMS."]},{"t":"texto","titulo":"Os três tipos","p":[]},{"t":"cards","cols":1,"itens":[{"t":"Medicamento inovador / de referência","d":"Em geral tem **marca comercial** e obteve o **primeiro registro**, normalmente como medicamento patenteado, com documentação de eficácia, segurança e qualidade. O **medicamento de referência** é o produto com o qual os outros pretendem ser **intercambiáveis**: ele é **eleito e divulgado pelo Ministério da Saúde**."},{"t":"Medicamento genérico","d":"Produto **intercambiável** com o de referência: mesmo fármaco, mesma dose, mesma forma farmacêutica e mesma via, com **mesma segurança e eficácia**. Em geral é produzido **após a expiração da patente**. **Não tem marca**: é identificado pela **DCB** (Denominação Comum Brasileira) ou, na ausência, pela **DCI** (Internacional)."},{"t":"Medicamento similar","d":"Tem os **mesmos princípios ativos, concentração, forma, via, indicação e posologia** do de referência, mas pode diferir em **tamanho, forma, prazo de validade, embalagem, rotulagem e excipientes**. Pode ter marca (similar com marca) ou apenas o nome do princípio ativo (similar sem marca)."}]},{"t":"callout","kind":"memo","titulo":"Como reconhecer um genérico","texto":"A embalagem traz o **nome do princípio ativo** (DCB ou DCI) e os dizeres: **“Medicamento genérico de acordo com a Lei nº 9.787/99”**."},{"t":"callout","kind":"nota","titulo":"Atualização importante","texto":"O módulo foi escrito logo depois da Lei dos Genéricos, em 1999, quando os similares **não precisavam provar equivalência** com o de referência. Hoje, a Anvisa também reconhece **similares intercambiáveis**. Confira a norma vigente e as orientações do seu serviço."}]},{"titulo":"Como se prova que um genérico funciona igual","blocos":[{"t":"texto","p":["Dois conceitos sustentam o genérico. Vamos entendê-los com calma:"]},{"t":"cards","cols":1,"itens":[{"t":"Biodisponibilidade","d":"É a **velocidade e a extensão** da absorção do princípio ativo a partir da forma farmacêutica, medidas pela curva de **concentração × tempo** no sangue ou pela excreção na urina. Não se aplica à via EV, pois nela não há absorção. Por definição, o fármaco por via EV é **100% biodisponível**."},{"t":"Bioequivalência","d":"É o **estudo comparativo** entre as biodisponibilidades de **dois medicamentos** com a mesma indicação, **mesma dose e mesma via extravascular**. Dois medicamentos são bioequivalentes quando **não há diferença estatisticamente significativa** entre a quantidade absorvida e a velocidade da absorção. A ideia é: se as concentrações no sangue são semelhantes, os efeitos tendem a ser os mesmos. Os estudos usam, em geral, **18 a 24 voluntários sadios**."}]},{"t":"texto","titulo":"Equivalente e alternativa farmacêutica","p":["Dois produtos são **equivalentes farmacêuticos** quando têm **quantidades idênticas do mesmo fármaco** e a mesma forma farmacêutica. Mas equivalência farmacêutica **não garante** equivalência terapêutica, porque diferenças nos excipientes ou na fabricação podem mudar o desempenho no organismo. Já as **alternativas farmacêuticas** têm o mesmo princípio ativo, mas não necessariamente na mesma quantidade ou na mesma forma."]},{"t":"callout","kind":"nota","titulo":"Nem todo genérico precisa do estudo","texto":"Alguns medicamentos ficam **isentos** do estudo de bioequivalência, como soluções parenterais (IV, IM, SC) com o mesmo fármaco e concentração, gases medicinais, colírios em solução aquosa e medicamentos de uso tópico sem efeito sistêmico."}]},{"titulo":"Na hora da troca: quem pode substituir e o que isso significa para a enfermagem","blocos":[{"t":"lista","ord":true,"itens":["O **farmacêutico** pode sugerir trocar o medicamento de **referência** pelo **genérico correspondente**, desde que o prescritor **não tenha restringido** isso de próprio punho, com algo como **“Não autorizo a substituição”**.","**Nunca** se substitui por um **similar**, mesmo que ele não tenha marca.","Se a prescrição for de um **similar com marca**, **não se deve substituir**.","A troca deve ser **anotada na prescrição**, com o carimbo do farmacêutico (nome e nº do CRF), data e assinatura, e o paciente deve ser **informado** sobre ela."]},{"t":"callout","kind":"atencao","titulo":"O que você faz","texto":"A enfermagem **administra o que foi prescrito e dispensado**. Se a embalagem que chegou até você não bate com a prescrição (outro nome, outra concentração, outra forma), **pare e comunique**. Pode ser uma substituição legítima, mas isso precisa estar registrado e confirmado, e não deduzido."},{"t":"pense","q":"A prescrição pede um medicamento de marca e a farmácia entregou um genérico. Você administra direto?","a":"Só se a troca estiver registrada na prescrição pelo farmacêutico, com carimbo e assinatura. Se não estiver, pare e confirme com o enfermeiro ou a farmácia."}]}],"resumo":["Prescrição é uma ordem escrita e completa: data e local, paciente, medicamento legível, dose, via, horário/intervalo, assinatura e carimbo com registro no conselho.","Tipos: padrão, única, imediata, permanente (protocolo) e verbal/telefônica (evitar; só em urgência; transcrever o quanto antes).","A bula é o resumo de utilidade e riscos: descrição, farmacologia clínica, indicações, contraindicações, advertências, precauções, reações adversas, uso excessivo, dose excessiva, dose e modo de administração, formas.","Referência/inovador tem marca e foi o primeiro registro; genérico não tem marca, é intercambiável e identificado por DCB/DCI; similar pode diferir em tamanho, validade, embalagem e excipientes.","Genérico traz “Medicamento genérico de acordo com a Lei nº 9.787/99”.","Biodisponibilidade = velocidade e extensão da absorção (EV = 100%). Bioequivalência compara a biodisponibilidade de dois medicamentos.","Quem troca é o farmacêutico, só por genérico correspondente e sem proibição do prescritor. A enfermagem administra o que foi prescrito e dispensado e comunica divergências."],"glossario":[{"t":"Prescritor","d":"Profissional habilitado que escreve a prescrição."},{"t":"Patente","d":"Direito exclusivo de fabricar e vender um produto por um período."},{"t":"DCB e DCI","d":"Denominação Comum Brasileira e Internacional: nomes oficiais dos princípios ativos."},{"t":"Excipiente","d":"Componente do medicamento que não é o princípio ativo."},{"t":"Intercambiável","d":"Que pode ser trocado por outro com a mesma segurança e eficácia."},{"t":"Meia-vida","d":"Tempo que o organismo leva para reduzir à metade a quantidade de fármaco no sangue."},{"t":"Parenteral","d":"Por injeção (EV, IM, SC)."},{"t":"Extravascular","d":"Fora dos vasos de sangue: vias em que há absorção."}]}},{"id":"m7","n":7,"titulo":"Lei, Ética e Responsabilidade","curto":"Ética","sub":"Administrar medicamento é assumir uma responsabilidade legal.","min":8,"selo":"Guardião Ético","icone":"i-shield","pulso":"Administrar medicamentos é um dos maiores pesos sobre a equipe de enfermagem. Aqui você descobre onde a lei te protege e onde ela te cobra.","objetivo":"Reconhecer os artigos do Código de Ética citados no módulo e aplicá-los a situações do dia a dia.","treino":[{"t":"game","id":"g7-erros"},{"t":"game","id":"g7-decisao"}],"aula":{"tempo":14,"intro":"Aqui você entende por que administrar medicamento é um ato com responsabilidade legal e ética, e o que a lei espera de você em cada situação.","secoes":[{"titulo":"Um dos maiores pesos da enfermagem","blocos":[{"t":"texto","p":["O módulo afirma que **a responsabilidade de administrar medicamentos é um dos maiores pesos sobre a equipe de enfermagem**. Isso acontece porque um erro nesse momento pode causar dano direto ao paciente, e quem estava com o medicamento na mão responde por seus atos.","Por isso, quem administra uma medicação precisa conhecer duas coisas: a **legislação que regulamenta a profissão** e as **normas da instituição** onde trabalha. A medicação deve ser feita **conforme a prescrição médica**."]},{"t":"texto","titulo":"O que é “competência legal”?","p":["Cada profissão da enfermagem tem atividades que a lei permite e outras que não. O técnico de enfermagem exerce atividades de **nível médio**, sob **orientação e supervisão do enfermeiro**, conforme a Lei do Exercício Profissional da Enfermagem (Lei nº 7.498/1986). Fazer algo que a lei não autoriza ao seu cargo é agir **fora da competência legal**. Em caso de dúvida sobre o que você pode ou não fazer, consulte o enfermeiro responsável e as normas do seu conselho."]},{"t":"callout","kind":"nota","titulo":"Sobre a numeração dos artigos","texto":"Os artigos citados nesta aula são os do **módulo de estudo**. O Código de Ética dos Profissionais de Enfermagem foi atualizado desde então (Resolução COFEN nº 564/2017) e a **numeração mudou**. Os princípios continuam valendo. Confira sempre o texto vigente no site do COFEN."}]},{"titulo":"Os artigos do módulo, em linguagem simples","blocos":[{"t":"cards","titulo":"Princípios e responsabilidades","cols":1,"itens":[{"t":"Art. 1º · Compromisso","d":"A enfermagem é uma profissão **comprometida com a saúde do ser humano e da coletividade**. Atua na promoção, proteção e recuperação da saúde, **respeitando os preceitos éticos e legais**.","tag":"princípio"},{"t":"Art. 14 · Recusar o que não é da sua competência","d":"É dever **recusar-se a executar atividades que não sejam de sua competência legal**. Não é desobediência: é proteger o paciente e a si mesmo.","tag":"competência"},{"t":"Art. 16 · Assistência livre de danos","d":"Assegurar ao cliente uma assistência **livre de danos decorrentes de imperícia, negligência e imprudência**.","tag":"responsabilidade"},{"t":"Art. 17 · Só aceitar o que você faz com segurança","d":"**Avaliar criteriosamente a própria competência técnica e legal** e só aceitar tarefas quando capaz de um desempenho seguro, para você e para o paciente.","tag":"responsabilidade"},{"t":"Art. 18 · Manter-se atualizado","d":"Ampliar seus **conhecimentos técnicos, científicos e culturais** em benefício do paciente, da coletividade e da profissão.","tag":"responsabilidade"}]},{"t":"cards","titulo":"Deveres, proibições e normas","cols":1,"itens":[{"t":"Art. 24 · Assistência livre de riscos","d":"Prestar assistência **livre dos riscos recorrentes de imperícia**.","tag":"dever"},{"t":"Art. 26 · Informar","d":"Prestar **informações adequadas** ao cliente e à família sobre a assistência, os possíveis benefícios, os riscos e as consequências que possam ocorrer.","tag":"dever"},{"t":"Art. 33 · Proteger o paciente de qualquer colega","d":"**Proteger o cliente** contra danos por imperícia, negligência ou imprudência **por parte de qualquer membro da equipe de saúde**.","tag":"dever"},{"t":"Art. 47 · Nunca ministrar sem saber o que é","d":"É **proibido ministrar medicamentos sem certificar-se da natureza das drogas** que compõem e da existência de risco para o cliente.","tag":"proibição"},{"t":"Art. 50 · Não executar prescrição insegura","d":"É **proibido executar prescrições terapêuticas quando contrárias à segurança do cliente**.","tag":"proibição"},{"t":"Art. 71 · Normas do conselho e da instituição","d":"**Cumprir as normas do Conselho Federal e Regional de Enfermagem** e as da instituição. Quem administra deve conhecer bem a legislação e realizar a medicação conforme a prescrição médica.","tag":"disciplinar"}]},{"t":"callout","kind":"memo","titulo":"O que há de comum","texto":"Em todos esses artigos a ideia é a mesma: o paciente está em primeiro lugar. Você deve **saber o que dá**, **dar só o que é seguro e é da sua competência**, **informar** e **proteger o paciente**, inclusive dos erros dos colegas."}]},{"titulo":"Imperícia, negligência e imprudência","blocos":[{"t":"texto","p":["O módulo cita três tipos de falha, sem definir cada um. São conceitos clássicos do direito e da ética profissional, e conhecê-los ajuda a reconhecer o risco no dia a dia:"]},{"t":"cards","cols":1,"itens":[{"t":"Imperícia","tag":"faltou saber ou saber fazer","d":"**Falta de habilidade ou de conhecimento técnico** para o que se faz. Exemplo: realizar um procedimento que nunca aprendeu, sem supervisão."},{"t":"Negligência","tag":"faltou fazer","d":"**Omissão, descuido**: deixar de fazer o que deveria ser feito. Exemplo: esquecer de checar o pulso antes de um digitálico, ou não comunicar uma reação do paciente."},{"t":"Imprudência","tag":"fez sem cautela","d":"**Agir de forma precipitada**, sem a cautela devida, mesmo sabendo da regra. Exemplo: aplicar rápido um medicamento que devia ser lento, para ganhar tempo."}]},{"t":"callout","kind":"nota","titulo":"Consequências","texto":"Uma falha na assistência pode gerar responsabilização **ética** (perante o conselho), **civil** (reparação de danos) e, em casos graves, **penal**. Por isso conhecer e cumprir as regras também protege o profissional."},{"t":"pense","q":"Um técnico não faz uma checagem que sabia que devia fazer, por falta de atenção. É imperícia, negligência ou imprudência?","a":"Negligência: ele deixou de fazer algo que deveria ter feito."}]},{"titulo":"Na prática: o que fazer em cada situação","blocos":[{"t":"texto","p":["Com os artigos em mente, estas são as condutas esperadas nas situações mais comuns:"]},{"t":"cards","cols":1,"itens":[{"t":"Prescrição ilegível ou com dúvida","d":"**Pare e esclareça** antes de administrar (Art. 47). Nunca tente “adivinhar” o nome do medicamento."},{"t":"Atividade fora da sua competência","d":"**Recuse e comunique** (Art. 14)."},{"t":"Prescrição que parece contrária à segurança do paciente","d":"Por exemplo, o paciente tem **alergia registrada** ao medicamento. **Não execute e comunique** ao enfermeiro e ao prescritor (Art. 50)."},{"t":"Colega prestes a errar","d":"**Interrompa, proteja o paciente e comunique** (Art. 33). A responsabilidade não é só do colega."},{"t":"Ordem verbal ou por telefone sem urgência","d":"Solicite a **prescrição escrita**. Verbal só em urgência e deve ser transcrita pelo médico o quanto antes."},{"t":"Medicamento que você não conhece","d":"**Pesquise e esclareça** com o enfermeiro, o farmacêutico ou a bula antes de administrar (Arts. 17, 18 e 47)."},{"t":"Paciente que pergunta sobre o remédio","d":"**Informe dentro da sua competência** e acione o enfermeiro ou o médico quando a dúvida for maior (Art. 26)."}]},{"t":"callout","kind":"atencao","titulo":"Regra de ouro","texto":"Na dúvida, **pare e comunique**. Parar para esclarecer é sempre melhor do que seguir com insegurança. A lei protege quem para por segurança e cobra de quem age sem certeza."}]}],"resumo":["Administrar medicamentos é um dos maiores pesos da enfermagem: exige conhecer a lei do exercício profissional, as normas da instituição e executar conforme a prescrição.","Art. 14: recusar o que não é da sua competência legal. Art. 17: só aceitar o que faz com segurança. Art. 26: informar paciente e família. Art. 33: proteger o paciente de falhas de qualquer colega.","Art. 47: não ministrar sem certificar-se da natureza da droga. Art. 50: não executar prescrição contrária à segurança do paciente.","Imperícia = falta de habilidade ou conhecimento. Negligência = omissão. Imprudência = agir sem cautela.","Na dúvida: parar, esclarecer e comunicar. A numeração dos artigos mudou na versão atual do Código de Ética (Res. COFEN 564/2017), mas os princípios permanecem."],"glossario":[{"t":"Competência legal","d":"O conjunto de atividades que a lei autoriza para cada categoria profissional."},{"t":"Ministrar","d":"Dar, administrar um medicamento."},{"t":"Cliente","d":"Termo usado no módulo para o paciente ou a pessoa assistida."},{"t":"COFEN e COREN","d":"Conselhos Federal e Regionais de Enfermagem, que fiscalizam e regulamentam a profissão."},{"t":"Prescritor","d":"Profissional habilitado que escreve a prescrição."}]}},{"id":"m8","n":8,"titulo":"Os 5 Certos: Simulador","curto":"5 Certos","sub":"A regra mais importante da administração de medicamentos.","min":14,"selo":"Checagem Perfeita","icone":"i-eye","pulso":"Chegou a missão central. Eu vou te entregar prescrição, pulseira e medicamento. Você decide: administra ou para?","objetivo":"Aplicar a regra dos 5 certos para conferir prescrição, paciente e medicamento, e decidir entre administrar e parar para comunicar.","treino":[{"t":"game","id":"g8-sequencia"},{"t":"game","id":"g8-check"},{"t":"game","id":"g8-qual"}],"aula":{"tempo":20,"intro":"Esta é a aula mais prática do curso. Você vai aprender, certo por certo, o que conferir antes de administrar um medicamento e em que ordem fazer cada coisa.","secoes":[{"titulo":"A regra mais importante da administração","blocos":[{"t":"texto","p":["Antes de dar qualquer medicamento, a equipe de enfermagem passa por uma conferência chamada **os 5 certos**. O módulo chama de **“a regra mais importante”**. São cinco perguntas que você faz sobre o que tem em mãos:"]},{"t":"fluxo","passos":[{"t":"Paciente certo","d":"é a pessoa certa?"},{"t":"Medicamento certo","d":"é o remédio certo?"},{"t":"Dose certa","d":"é a quantidade certa?"},{"t":"Via certa","d":"é o caminho certo?"},{"t":"Hora certa","d":"é o momento certo?"}]},{"t":"texto","p":["A ideia é simples: se **os cinco** conferirem com a prescrição, você pode administrar. Se **um** deles não conferir, você **para**. Cada certo é uma barreira. Se a primeira falhar, a segunda pega o erro, e assim por diante."]},{"t":"callout","kind":"memo","titulo":"Por que existe uma regra assim","texto":"Erros de medicação acontecem **mesmo com profissionais experientes**, em especial em momentos de correria, cansaço e interrupção. A regra dos 5 certos é uma **rede de segurança** contra o erro humano."}]},{"titulo":"1º certo: paciente certo","blocos":[{"t":"texto","p":["É o primeiro porque de nada adianta o medicamento estar certo se ele for para a pessoa errada. Aqui o que importa é **identificar com certeza quem está na sua frente** e compará-lo com a prescrição."]},{"t":"lista","titulo":"Como conferir","itens":["Compare o nome da **prescrição** com o da **pulseira de identificação**, letra por letra.","Sempre que possível, **peça ao paciente que diga o nome completo**, em vez de perguntar “o senhor é o João?”. Quem está confuso ou sedado pode dizer “sim” a qualquer nome.","**Não se identifica paciente pelo número do leito.** Pacientes mudam de leito.","Atenção a **homônimos** e a nomes parecidos na mesma enfermaria. Em muitos serviços esses pacientes recebem um aviso visual."]},{"t":"callout","kind":"exemplo","titulo":"Exemplo","texto":"A prescrição é de “João **Pedro** Alves” e a pulseira diz “João **Pereira** Alves”. Parecem iguais à primeira vista, mas são **pessoas diferentes**. O paciente certo não confere: **pare e comunique**."}]},{"titulo":"2º certo: medicamento certo","blocos":[{"t":"texto","p":["Aqui você compara o **medicamento que tem em mãos** com o que foi prescrito. O que importa é o **princípio ativo**: lembre-se de que um mesmo remédio pode ter nomes diferentes (genérico e comercial). O Código de Ética é direto: é proibido ministrar medicamentos **sem certificar-se da natureza das drogas** (Art. 47)."]},{"t":"lista","titulo":"Como conferir","itens":["**Leia o rótulo** inteiro, sem confiar na embalagem pela cor ou pelo formato.","Compare o **nome e o princípio ativo** do rótulo com o da prescrição.","Atenção a **nomes parecidos**. O módulo traz exemplos que se confundem fácil, como **dopamina e dobutamina**, ou **insulina regular e NPH**.","Confira o **prazo de validade** e se o produto parece **inalterado** (cor, transparência, ausência de partículas). Se algo parecer diferente, **não use** e comunique. Essa conferência faz parte das boas práticas dos serviços.","Se você **não conhece** o medicamento, **pesquise ou pergunte** antes de administrar."]},{"t":"callout","kind":"exemplo","titulo":"Exemplo","texto":"A prescrição pede **dopamina** e a ampola na bandeja diz **dobutamina**. As duas são medicamentos que agem no coração e têm nomes quase iguais, mas são fármacos **diferentes**. Medicamento errado: **pare e comunique**."}]},{"titulo":"3º certo: dose certa","blocos":[{"t":"texto","p":["A dose que você **prepara** precisa ser igual à dose **prescrita**. É o certo em que a matemática entra, e é onde aparecem os erros por troca de unidade ou conta errada."]},{"t":"lista","titulo":"Como conferir","itens":["Compare a **dose escrita** (por exemplo, 1 g) com a **apresentação disponível** (por exemplo, ampola de 500 mg/mL).","Atenção às **unidades**: mg, g, mL. Lembre que **1 g = 1.000 mg**.","Revise o **cálculo**. Em muitos serviços ele é conferido por outro profissional.","Se o resultado parecer **estranho** (muito alto, muito baixo, muitos comprimidos), pare e confirme."]},{"t":"callout","kind":"exemplo","titulo":"Exemplo","texto":"Prescrito: **1 g (2 mL)**, com ampola de **500 mg/mL**. Preparado: **4 mL**, o que equivale a **2 g**. É **o dobro** da dose. Dose errada: **pare, refaça o cálculo e comunique**."},{"t":"callout","kind":"memo","titulo":"Lembrete","texto":"Uma dose acima da máxima leva à **zona tóxica** (missão 2). Para alguns medicamentos, como os aminoglicosídeos, a margem de erro é pequena."}]},{"titulo":"4º certo: via certa","blocos":[{"t":"texto","p":["A **via preparada e aplicada** precisa ser a que está na prescrição. Como você viu na missão 5, a via decide a velocidade e o risco, e **nem toda apresentação serve para toda via**."]},{"t":"lista","titulo":"Como conferir","itens":["Compare a **via escrita** (VO, EV, IM, SC, SL, VR...) com a **apresentação** que você tem: comprimido é oral; frasco injetável não é para a boca.","Verifique no **rótulo** se o produto pode ser dado pela via prescrita.","Na **via EV**, além da via, vale a **velocidade**: alguns medicamentos precisam de aplicação lenta (digitálicos, aminofilina).","Se a via prescrita parece **inadequada ao estado do paciente** (por exemplo, via oral em quem está vomitando), **comunique**."]},{"t":"callout","kind":"exemplo","titulo":"Exemplo","texto":"Prescrito **IM**, mas o preparo está feito para **EV**. Mesmo que o medicamento e a dose estejam certos, a via errada muda a velocidade e os riscos. Via errada: **pare e comunique**."}]},{"titulo":"5º certo: hora certa","blocos":[{"t":"texto","p":["Todo medicamento precisa ser dado no **horário** ou no **intervalo** da prescrição. O horário mantém o nível do fármaco na **janela terapêutica**: se atrasa, o nível cai; se antecipa ou repete, pode subir demais."]},{"t":"lista","titulo":"Como conferir","itens":["Veja o horário prescrito (por exemplo, **10:00** ou **6/6 h**) e compare com a **hora atual**.","Cada serviço define uma **tolerância** (nos exercícios deste site, 30 minutos para mais ou para menos).","Se estiver **fora da tolerância**, não decida sozinho: **comunique** ao enfermeiro.","Atenção a **dose repetida**: antes de administrar, confira se não foi dada por outro colega."]},{"t":"callout","kind":"exemplo","titulo":"Exemplo","texto":"Prescrito para **14:00** e o relógio marca **15:45**. São **1h45 de atraso**, fora da tolerância. Hora errada: **pare e comunique**."}]},{"titulo":"Passo a passo de uma administração segura","blocos":[{"t":"texto","p":["Os 5 certos não são uma checagem única no final. Eles se encaixam em uma **rotina** que começa antes de você chegar ao paciente. Estas são as etapas que costumam ser seguidas (boas práticas dos serviços):"]},{"t":"lista","ord":true,"itens":["**Higienizar as mãos** antes de preparar.","**Ler a prescrição** com atenção: medicamento, dose, via e horário.","**Separar e conferir o rótulo**, comparando com a prescrição. Em seguida, **preparar**.","**Identificar o paciente** (pulseira e nome completo) e **explicar o procedimento**, como pede o Art. 26.","**Administrar** na via e velocidade corretas.","**Registrar** (checar o horário na prescrição) e **observar** possíveis reações."]},{"t":"callout","kind":"nota","titulo":"Três momentos de checagem","texto":"Muitos serviços orientam conferir **três vezes**: ao retirar o medicamento do local de guarda, ao prepará-lo e imediatamente antes de administrá-lo, já ao lado do paciente."}]},{"titulo":"Quando parar e como comunicar","blocos":[{"t":"texto","p":["Se **qualquer** dos cinco certos não conferir, **você não administra**. Isso não é erro seu: é o sistema funcionando. O erro seria ir em frente com a dúvida."]},{"t":"lista","titulo":"Ao comunicar ao enfermeiro, diga com clareza","itens":["**Quem** é o paciente (nome completo e leito).","**Qual** medicamento está em questão.","**O que divergiu**: paciente, medicamento, dose, via ou hora.","**O que você já fez** (parou, separou o medicamento, revisou o cálculo)."]},{"t":"callout","kind":"atencao","titulo":"Na dúvida, pare","texto":"Dúvida é motivo para **parar e comunicar**, não para tentar adivinhar. Esse é o espírito do Código de Ética: nunca ministrar sem certeza do que está dando."},{"t":"texto","titulo":"Bônus: os 9 certos","p":["Muitos serviços ampliam a regra para **nove certos**, acrescentando: **registro certo** (anotar o que foi feito), **orientação certa** (explicar ao paciente), **forma farmacêutica certa** e **monitoramento certo** (observar a resposta). O módulo de estudo ensina os cinco primeiros; o **protocolo da sua instituição** diz qual versão você deve seguir."]}]}],"resumo":["Os 5 certos são: paciente, medicamento, dose, via e hora. Se qualquer um não conferir, não administre: pare e comunique.","Paciente: compare prescrição e pulseira, peça o nome completo e não use o número do leito.","Medicamento: leia o rótulo, compare o princípio ativo, cuidado com nomes parecidos (dopamina × dobutamina; insulina regular × NPH).","Dose: compare dose prescrita × apresentação, revise unidades (1 g = 1.000 mg) e o cálculo.","Via: a via preparada precisa ser a prescrita; na EV, atenção à velocidade.","Hora: respeite horário ou intervalo, dentro da tolerância do serviço.","Rotina segura: mãos, ler a prescrição, conferir e preparar, identificar o paciente, administrar, registrar e observar."],"glossario":[{"t":"Homônimo","d":"Pessoa com o mesmo nome ou nome muito parecido."},{"t":"Apresentação","d":"A forma e a concentração em que o produto vem (ex.: ampola de 500 mg/mL)."},{"t":"Tolerância de horário","d":"Margem de tempo, definida pelo serviço, para dar a dose antes ou depois do horário prescrito."},{"t":"Barreira de segurança","d":"Etapa de conferência que pode impedir um erro de chegar ao paciente."},{"t":"Diluição","d":"Mistura do medicamento com um líquido para reduzir a concentração."}]}},{"id":"m9","n":9,"titulo":"Arsenal: Classes e Cuidados","curto":"Arsenal","sub":"As principais classes de medicamentos e o que a enfermagem precisa observar.","min":18,"selo":"Arsenal Completo","icone":"i-flask","pulso":"Hora de abrir o arsenal. Cada classe tem um cuidado de enfermagem associado. Vou te deixar explorar à vontade.","objetivo":"Reconhecer as classes de medicamentos por sistema, associar cada uma ao seu cuidado de enfermagem e entender as insulinas e o sistema nervoso autônomo.","treino":[{"t":"game","id":"g9-codex"},{"t":"game","id":"g9-classe"},{"t":"game","id":"g9-cuidado"},{"t":"game","id":"g9-insulina"},{"t":"game","id":"g9-sna"},{"t":"game","id":"g9-colin"}],"aula":{"tempo":30,"intro":"Esta aula apresenta as principais classes de medicamentos por sistema do corpo. Cada seção explica primeiro a condição que o medicamento trata, para que as classes façam sentido mesmo para quem nunca estudou o assunto.","secoes":[{"titulo":"Como estudar as classes de medicamentos","blocos":[{"t":"texto","p":["Existem milhares de medicamentos, mas eles se **agrupam por função no organismo**, formando as **classes farmacológicas**. Aprender a classe é mais útil do que decorar nomes soltos: se você sabe a classe, já sabe **para que serve** e **quais cuidados** costumam acompanhá-la.","Para cada classe, guarde quatro coisas: **para que serve**, **exemplos** (pelo nome genérico), **cuidado de enfermagem** e **efeitos de atenção**. Lembre também que todo medicamento tem um **nome genérico** (o princípio ativo) e um **nome comercial** (do fabricante), e que não existem medicamentos sem efeitos colaterais."]},{"t":"callout","kind":"nota","titulo":"Sobre os exemplos desta aula","texto":"Os exemplos seguem o módulo de estudo, com os nomes genéricos. Alguns nomes comerciais e fármacos citados em materiais antigos podem ter saído do mercado. **Consulte sempre a prescrição, a bula e a lista de medicamentos da sua instituição.** Nenhuma dose é indicada aqui."}]},{"titulo":"Sistema circulatório: coração e pressão","blocos":[{"t":"texto","p":["O **coração** é uma bomba que empurra o sangue pelo corpo. Quando essa bomba falha, o sangue circula mal e se acumula nas veias, nas câmaras do coração e nos pulmões. Isso se chama **insuficiência cardíaca**. Os medicamentos do sistema circulatório atuam em problemas como esse, no **ritmo** do coração, na **pressão** e na **circulação**."]},{"t":"cards","cols":1,"itens":[{"t":"Digitálicos","tag":"digoxina","d":"Usados na **insuficiência cardíaca**. Fortalecem a contração do músculo do coração, que passa a esvaziar melhor: aumenta o **débito cardíaco** (volume de sangue bombeado), reduz a pressão venosa e o edema e favorece a diurese. **Cuidados:** verificar o **pulso antes**: se estiver **abaixo de 60**, comunicar o responsável do setor; se EV, aplicar **lentamente**; observar sinais de toxicidade (anorexia, náuseas, cefaleia, confusão); lembrar que as doses são **cumulativas**."},{"t":"Inotrópicos (catecolaminas)","tag":"dobutamina, dopamina","d":"Aumentam a **força de contração** do coração e são usados na descompensação cardíaca. A dobutamina estimula os **receptores beta** do coração. A dopamina também aumenta o fluxo renal. **Atenção:** efeitos adversos da dopamina incluem angina, batimentos ectópicos, cefaleia e hipotensão. Cuidado com os **nomes parecidos**."},{"t":"Antiarrítmicos","tag":"amiodarona, verapamil, lidocaína, propranolol","d":"O ritmo do coração é comandado por um “marca-passo” natural, o **nodo sinoatrial**, no átrio direito. Qualquer desvio desse ritmo é uma **arritmia**. Os antiarrítmicos corrigem esses desvios. **Atenção:** a lidocaína pode causar efeitos no sistema nervoso central (sonolência, desorientação, confusão, perturbações visuais; raramente convulsões e coma)."},{"t":"Anti-hipertensivos","tag":"captopril, enalapril, nifedipina, espironolactona","d":"Regulam a **pressão arterial** por mecanismos diferentes. **Cuidados:** controlar a **pressão arterial**, o **peso** e a **diurese**."},{"t":"Vasodilatadores","tag":"cinarizina, flunarizina","d":"Melhoram a circulação nos tecidos, aumentando o fluxo de sangue."},{"t":"Antianginosos","tag":"isossorbida, nifedipina","d":"A **angina** é a dor no peito causada por falta de sangue no coração. Esses medicamentos **reduzem a crise de angina**."}]},{"t":"pense","q":"Antes de administrar um digitálico, o pulso do paciente é 54 por minuto. O que você faz?","a":"Comunica o responsável do setor antes de administrar: pulso abaixo de 60 é o sinal de alerta descrito no módulo."}]},{"titulo":"Sistema respiratório: tosse e respiração","blocos":[{"t":"texto","p":["A tosse pode ser **seca** (sem secreção, “improdutiva”) ou **produtiva** (com catarro). Os medicamentos respiratórios escolhem entre **acalmar a tosse**, **soltar o catarro** ou **abrir os brônquios**."]},{"t":"cards","cols":2,"itens":[{"t":"Antitussígenos","tag":"codeína","d":"**Acalmam a tosse improdutiva**, sem secreção."},{"t":"Mucolíticos","tag":"acetilcisteína, ambroxol","d":"**Diminuem a aderência das secreções**, deixando o catarro menos grudento."},{"t":"Expectorantes","tag":"guaiacol, cloreto de amônio","d":"**Favorecem a tosse produtiva**: ajudam a eliminar as secreções."},{"t":"Broncodilatadores","tag":"salbutamol, aminofilina","d":"**Dilatam os brônquios**, facilitando a saída do catarro e a respiração. **Cuidado:** aminofilina por EV deve ser aplicada **lentamente** (no mínimo 10 minutos a cada 10 mL), com **controle dos sinais vitais** depois."}]}]},{"titulo":"Sistema digestório","blocos":[{"t":"cards","cols":1,"itens":[{"t":"Antiácidos","tag":"hidróxido de alumínio e de magnésio","d":"**Tamponam a acidez** do estômago e protegem a mucosa. O alumínio pode causar **constipação**; o magnésio pode ter **ação purgativa**."},{"t":"Antieméticos","tag":"ondansetrona, metoclopramida","d":"Combatem **náuseas e vômitos**."},{"t":"Laxantes e purgativos","tag":"plantago, bisacodil, óleo mineral","d":"Os **reeducadores intestinais** têm ação suave; os **purgativos**, ação enérgica; os **estimulantes do peristaltismo** aumentam o movimento do intestino."},{"t":"Antidiarreicos e protetores","tag":"loperamida, carvão ativado","d":"Diminuem ou eliminam a **diarreia**. Absorventes e protetores recobrem a mucosa inflamada."},{"t":"Antifiséticos","tag":"dimeticona","d":"Agente **antiespumante**: altera a tensão superficial das bolhas de gás."},{"t":"Bloqueadores da secreção gástrica","tag":"omeprazol, cimetidina","d":"**Reduzem a secreção de suco gástrico.** Incluem antagonistas dos receptores H2 e **inibidores da bomba de prótons**."}]}]},{"titulo":"Sistema geniturinário e nutrição","blocos":[{"t":"cards","cols":1,"itens":[{"t":"Diuréticos","tag":"furosemida, hidroclorotiazida","d":"Estimulam a **saída de íons e de líquidos** do organismo, evitando o **edema**. Usados também na hipertensão. **Cuidado:** controlar **peso e diurese**."},{"t":"Antissépticos urinários","tag":"nitrofurantoína","d":"Agem **somente nas vias urinárias**."},{"t":"Ocitócicos","tag":"ocitocina, metilergometrina","d":"Provocam **contração uterina**: induzem o parto e ajudam a conter a **hemorragia pós-parto**."},{"t":"Vitaminas","tag":"B1, B12, C, A, D, K","d":"Atuam em vários processos do metabolismo. A necessidade vem **quase toda da alimentação**, mas gravidez e pós-cirúrgico podem exigir suplemento. **Atenção:** cálcio e vitamina D em tratamento prolongado podem **calcificar tecidos**, inclusive o rim (cálculo renal). A falta de vitamina C causa **escorbuto**. A vitamina K participa da **coagulação**."}]}]},{"titulo":"Alergia e inflamação: histamina e corticoides","blocos":[{"t":"texto","p":["Em uma **reação alérgica**, o corpo libera uma substância chamada **histamina**, que age nos vasos e nos músculos lisos. Os **anti-histamínicos** se opõem a essa ação. Os **corticoides**, por sua vez, derivam de hormônios das glândulas suprarrenais e são **anti-inflamatórios e antialérgicos potentes**."]},{"t":"cards","cols":1,"itens":[{"t":"Anti-histamínicos","tag":"dexclorfeniramina, prometazina","d":"Agem nas reações alérgicas **opondo-se à ação da histamina**. **Atenção:** podem causar **sonolência**; alguns estimulam o apetite."},{"t":"Corticoides","tag":"prednisona, dexametasona, hidrocortisona","d":"Anti-inflamatórios e antialérgicos potentes. Devem ser usados **com muita cautela, somente com orientação médica**. **Atenção:** podem provocar **retenção de líquidos** (rosto arredondado) e **imunossupressão**. O corticoide que vem de fora **inibe** a produção do corticoide do próprio corpo."}]}]},{"titulo":"Sistema nervoso central: sono, ansiedade, convulsão","blocos":[{"t":"cards","cols":1,"itens":[{"t":"Hipnóticos","tag":"fenobarbital, midazolam","d":"**Deprimem o SNC** e facilitam o início e a manutenção do sono. Conforme a dose, podem ter efeito hipnótico, sedativo ou anestésico geral."},{"t":"Neurolépticos","tag":"haloperidol, clorpromazina","d":"Agem na **excitação, na agressividade e nos delírios e alucinações**."},{"t":"Tranquilizantes","tag":"diazepam, bromazepam","d":"Agem na **ansiedade e na tensão**. Em doses baixas facilitam o sono; alguns têm ação anticonvulsivante."},{"t":"Antidepressivos","tag":"amitriptilina, imipramina","d":"**Diminuem a depressão.** Costumam exigir cerca de **três semanas de uso** para os efeitos positivos."},{"t":"Anestésicos","tag":"fentanil, lidocaína, bupivacaína","d":"**Gerais** agem por depressão do SNC. **Locais** agem **bloqueando os axônios** dos nervos periféricos."},{"t":"Anticonvulsivantes","tag":"fenitoína, carbamazepina, ácido valproico","d":"**Elevam o limiar excitatório**, prevenindo convulsões."},{"t":"Antiparkinsonianos","tag":"levodopa, biperideno","d":"Precursores da **dopamina**, o neurotransmissor envolvido na doença de Parkinson."}]}]},{"titulo":"Dor, febre e inflamação","blocos":[{"t":"texto","p":["Tanto a dor quanto a febre e a inflamação envolvem uma substância do próprio corpo chamada **prostaglandina**. Muitos medicamentos desta seção funcionam **bloqueando a síntese de prostaglandinas**."]},{"t":"cards","cols":1,"itens":[{"t":"Analgésicos e antitérmicos","tag":"paracetamol, dipirona, AAS","d":"**Bloqueiam a síntese de prostaglandinas** (dor de cabeça, dores musculares e articulares). Também têm **ação antitérmica**: atuam no **hipotálamo**, o “termostato” do corpo, e estimulam a perda de calor."},{"t":"Analgésicos opioides (narcóticos)","tag":"morfina, meperidina","d":"Agem em **receptores opioides do SNC**. Usados em **dores severas** (cólicas renais e biliares, câncer). **Atenção:** podem causar **dependência e euforia**."},{"t":"Anti-inflamatórios não esteroidais (AINEs)","tag":"diclofenaco, cetoprofeno, naproxeno","d":"**Inibem a produção de prostaglandinas**, ligadas à reação inflamatória."}]}]},{"titulo":"Hormônios, diabetes e insulina","blocos":[{"t":"texto","p":["**Hormônios** são substâncias produzidas por glândulas e transportadas pelo sangue para agir em órgãos e tecidos. Os medicamentos desse grupo incluem os corticoides (já vistos), os **hormônios sexuais** (androgênios, estrogênios e progestágenos), os **tireoidianos** (como a levotiroxina, para o hipotireoidismo), e os usados no **diabetes**."]},{"t":"texto","titulo":"Diabetes e insulina","p":["A **insulina** é um hormônio produzido pelo **pâncreas** e liberado no sangue quando a **glicose** (açúcar do sangue) está elevada. Na pessoa que não produz o suficiente, a insulina é aplicada como **reposição** (ação substitutiva). Os tipos de insulina diferem no **início** e na **duração** do efeito (segundo o módulo):"]},{"t":"t
