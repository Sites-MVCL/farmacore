abela","cab":["Tipo","Ação","Início","Duração"],"linhas":[["Regular ou simples","Rápida","30 minutos","5 a 7 horas"],["NPH","Intermediária","1 a 3 horas","24 a 28 horas"],["Protamina-zíncica","Prolongada","4 a 6 horas","cerca de 36 horas"]]},{"t":"callout","kind":"nota","titulo":"Valores do módulo","texto":"Os tempos acima são os do módulo de estudo. Existem insulinas modernas com perfis diferentes. Em serviço, **confira sempre a bula e o protocolo da instituição**, e não confunda tipos de insulina: são nomes parecidos com ações diferentes."},{"t":"cards","cols":2,"itens":[{"t":"Sulfonilureias","tag":"glibenclamida","d":"**Estimulam a produção de insulina do próprio corpo**. Não atuam em quem não tem essa produção."},{"t":"Biguanidas","tag":"metformina","d":"**Diminuem a absorção de glicose** no intestino, e o organismo passa a precisar de menos insulina."}]}]},{"titulo":"Sangue: coagulação e anemia","blocos":[{"t":"texto","p":["**Coagulação** é o processo que faz o sangue formar um coágulo para estancar um sangramento. Em algumas doenças é preciso **diminuir** a coagulação (para evitar coágulos perigosos) e em outras **aumentá-la** (para conter hemorragias)."]},{"t":"cards","cols":1,"itens":[{"t":"Heparina","tag":"anticoagulante","d":"Ação **rápida e fugaz**, por isso é a **preferida nas emergências**. É **inativa por via oral**, então é usada por **via parenteral**."},{"t":"Antagonistas da vitamina K","tag":"varfarina","d":"Anticoagulantes úteis em **tratamentos prolongados**. O efeito só aparece **24 a 48 horas** após a primeira dose e **dura cerca de 7 dias** depois da interrupção."},{"t":"Hemostáticos e coagulantes","tag":"vitamina K, esponja de gelatina","d":"**Interrompem a hemorragia.** A vitamina K participa da coagulação."},{"t":"Antianêmicos","tag":"sulfato ferroso, vitamina B12, ácido fólico","d":"A **anemia** pode ser causada por falta de ferro, de vitamina B12 ou de ácido fólico. O ferro é indispensável para formar a **hemoglobina**."}]}]},{"titulo":"Sistema nervoso autônomo: luta ou repouso","blocos":[{"t":"texto","p":["O **sistema nervoso autônomo** controla funções viscerais necessárias à vida, **fora do controle voluntário**: músculo liso (do intestino e dos vasos), algumas secreções, a frequência e a força do coração e alguns processos do metabolismo. Ele tem **duas divisões**, que funcionam o tempo todo:"]},{"t":"cards","cols":2,"itens":[{"t":"Simpático","tag":"luta ou fuga","d":"Sai da região toracolombar da coluna. **Predomina no estresse** e é altamente **catabólico**. Os neurônios pós-ganglionares liberam principalmente **noradrenalina**."},{"t":"Parassimpático","tag":"repouso e digestão","d":"Sai da região craniossacral. **Predomina na saciedade e no repouso** e é **anabólico**. Os neurônios pós-ganglionares liberam **acetilcolina**."}]},{"t":"texto","p":["Os dois sistemas têm ações opostas em alguns órgãos (como no coração e no intestino), mas não em todos. Dois grupos de medicamentos mexem com o parassimpático:"]},{"t":"cards","cols":2,"itens":[{"t":"Colinérgicos","tag":"neostigmina, pilocarpina","d":"**Estimulam** o parassimpático: aumentam o **peristaltismo** e provocam **miose** (pupila contraída)."},{"t":"Anticolinérgicos","tag":"atropina, escopolamina","d":"**Bloqueiam** o parassimpático: reduzem o **peristaltismo** e provocam **midríase** (pupila dilatada)."}]}]},{"titulo":"Anti-infecciosos: antibióticos e outros","blocos":[{"t":"texto","p":["**Antibióticos** são substâncias que, em condições propícias, **inibem ou destroem o crescimento de micro-organismos** que causam doenças. Eles se dividem em dois grandes grupos:"]},{"t":"cards","cols":2,"itens":[{"t":"Bacteriostáticos","tag":"“param” a bactéria","d":"**Impedem o crescimento bacteriano.** Exemplos: tetraciclina, eritromicina, sulfa."},{"t":"Bactericidas","tag":"“matam” a bactéria","d":"**Provocam a morte da bactéria.** Exemplos: penicilina, aminoglicosídeos, cefalosporinas."}]},{"t":"cards","cols":1,"itens":[{"t":"Penicilinas","tag":"ampicilina, oxacilina","d":"Bactericidas, por VO, IM ou EV. Algumas são **destruídas pelo suco gástrico** se tomadas por boca. **Atenção:** o principal efeito colateral é a **hipersensibilidade**, que pode chegar ao **choque anafilático**. Boa prática: perguntar sobre **alergia a penicilina** antes e **observar** o paciente após a administração."},{"t":"Cefalosporinas","tag":"cefalexina, cefazolina, ceftriaxona","d":"Também **beta-lactâmicas**, como as penicilinas, e por isso podem ter **hipersensibilidade cruzada**. São divididas em **quatro gerações**, conforme o desenvolvimento."},{"t":"Macrolídeos e tetraciclinas","tag":"eritromicina, doxiciclina","d":"Em geral **bacteriostáticos**."},{"t":"Aminoglicosídeos","tag":"gentamicina, amicacina","d":"**Não são absorvidos por via oral.** **Atenção:** podem ser **nefrotóxicos** (agridem os rins) e **ototóxicos** (agridem o ouvido)."},{"t":"Sulfamídicos","tag":"sulfametoxazol + trimetoprima","d":"Antibacterianos de ampla aplicação. **Atenção:** podem causar **reações alérgicas graves**, náuseas, vômitos e tonturas."},{"t":"Antivirais, antifúngicos e antiparasitários","tag":"aciclovir, fluconazol, metronidazol, mebendazol","d":"Tratam infecções por **vírus** (como herpes), **fungos** e **parasitas**, provocando a morte ou a expulsão do agente sem lesar gravemente o paciente."}]},{"t":"pense","q":"Um paciente vai receber uma penicilina. Qual risco você deve ter em mente?","a":"Hipersensibilidade, que pode chegar ao choque anafilático. É importante saber se ele tem alergia prévia e observar o paciente depois da administração."}]}],"resumo":["Classes farmacológicas agrupam medicamentos pela função. Aprenda a classe, o exemplo, o cuidado e o alerta.","Digitálicos: pulso antes (abaixo de 60, comunicar), EV lento, doses cumulativas. Anti-hipertensivos e diuréticos: controlar pressão, peso e diurese. Lidocaína: efeitos no SNC.","Aminofilina EV: aplicar lentamente (mínimo 10 min a cada 10 mL) e controlar sinais vitais.","Corticoides só com orientação médica; anti-histamínicos causam sonolência; opioides podem causar dependência.","Heparina é parenteral (inativa por via oral); varfarina leva 24 a 48 h para agir e dura cerca de 7 dias após parar.","Insulina: regular (rápida, 30 min), NPH (intermediária, 1 a 3 h), protamina-zíncica (prolongada, 4 a 6 h).","Colinérgicos: miose e mais peristaltismo. Anticolinérgicos: midríase e menos peristaltismo.","Penicilinas e cefalosporinas: risco de hipersensibilidade (cruzada). Aminoglicosídeos: nefrotóxicos e ototóxicos."],"glossario":[{"t":"Insuficiência cardíaca","d":"Quando o coração não bombeia o sangue de forma satisfatória."},{"t":"Arritmia","d":"Desvio do ritmo normal do coração."},{"t":"Angina","d":"Dor no peito por falta de sangue no músculo do coração."},{"t":"Prostaglandina","d":"Substância do corpo ligada à dor, à febre e à inflamação."},{"t":"Histamina","d":"Substância liberada nas reações alérgicas."},{"t":"Anticoagulante","d":"Medicamento que previne ou diminui a coagulação do sangue."},{"t":"Nefrotóxico","d":"Que pode causar dano aos rins."},{"t":"Ototóxico","d":"Que pode causar dano ao ouvido."},{"t":"Miose e midríase","d":"Contração e dilatação da pupila."}]}},{"id":"final","n":10,"titulo":"Desafio Final","curto":"Desafio","sub":"Dezesseis perguntas misturando todas as missões.","min":10,"selo":"Comandante de Medicação","icone":"i-medal","pulso":"Última fase. Sem cronômetro, mas com tudo o que você aprendeu. Respire e confira com calma, como na vida real.","objetivo":"Mostrar que você domina os conceitos, as vias, a prescrição, a ética e os 5 certos.","treino":[{"t":"game","id":"final-quiz"}]}],"jogos":{"g1-termo":{"tipo":"quiz","titulo":"Qual termo?","dica":"Leia a definição e escolha o conceito.","rotulo":"Definição","pts":10,"opts":["Fármaco","Medicamento","Droga","Remédio","Placebo"],"itens":[{"q":"Substância que modifica a função fisiológica, com ou sem intenção benéfica.","a":2,"why":"Droga é o termo mais amplo: o que importa é modificar a função, não a intenção."},{"q":"Fármaco cujas propriedades benéficas foram comprovadas cientificamente.","a":1,"why":"A comprovação científica do benefício é o que transforma um fármaco em medicamento."},{"q":"Inclui até massagem, banhos, acupuntura, fé e crença usados em benefício da saúde.","a":3,"why":"Remédio é o termo mais abrangente: vai além de substâncias."},{"q":"Preparação inativa dada para satisfazer a necessidade psicológica de “tomar algo”.","a":4,"why":"O placebo é feito com intenção de aliviar o sofrimento, mesmo com pouco ou nenhum princípio ativo."},{"q":"Estrutura química conhecida que modifica uma função fisiológica já existente.","a":0,"why":"Fármaco é definido pela estrutura química conhecida e pela capacidade de modificar uma função."},{"q":"Todo ___ é um fármaco, mas nem todo fármaco é um ___.","a":1,"why":"Todo medicamento é fármaco, mas nem todo fármaco foi comprovado como benéfico."}]},"g1-nomes":{"tipo":"match","titulo":"Ligue o nome à definição","dica":"Toque em um nome e depois na definição correspondente.","pts":5,"pares":[{"l":"Nome químico","r":"Deriva da estrutura molecular da substância"},{"l":"Nome oficial","r":"Consta nos livros oficiais, as farmacopeias"},{"l":"Nome genérico","r":"Nome do princípio ativo, sem marca"},{"l":"Nome comercial","r":"Nome dado pelo laboratório ao produto"}]},"g1-forma":{"tipo":"quiz","titulo":"Sólido, líquido ou gasoso?","dica":"Classifique cada forma farmacêutica pelo estado físico.","rotulo":"Forma","pts":5,"opts":["Sólido","Líquido","Gasoso"],"tons":["c","v","a"],"itens":[{"q":"Cápsula","a":0,"why":"Sólido com invólucro de gelatina."},{"q":"Xarope","a":1,"why":"Solução com dois terços de açúcar."},{"q":"Aerossol (spray)","a":2,"why":"Aerossóis e gases estão no grupo dos gasosos."},{"q":"Supositório","a":0,"why":"Sólido de formato cônico ou oval, para uso retal."},{"q":"Colírio","a":1,"why":"Solução aquosa para a mucosa ocular."},{"q":"Oxigênio","a":2,"why":"Gás medicinal."},{"q":"Drágea","a":0,"why":"Sólido com revestimento de goma-laca, açúcar e corante."},{"q":"Elixir","a":1,"why":"Líquido hidroalcoólico, açucarado ou glicerinado."},{"q":"Pomada","a":0,"why":"No módulo, está entre as formas sólidas (pastosa ou semissólida)."},{"q":"Emulsão","a":1,"why":"Preparação líquida feita de óleo e água."}]},"g1-origem":{"tipo":"quiz","titulo":"Qual é a origem?","dica":"Natural, sintético ou semissintético?","rotulo":"Origem","pts":10,"opts":["Natural","Sintético","Semissintético"],"itens":[{"q":"Extraído de uma planta ou de um órgão de animal.","a":0,"why":"Medicamentos naturais vêm de órgãos, glândulas, plantas ou peçonhas."},{"q":"Produzido exclusivamente pelo trabalho de laboratório.","a":1,"why":"Os sintéticos são resultado do trabalho de laboratório."},{"q":"Substância natural alterada quimicamente para mudar as características da ação.","a":2,"why":"A alteração de uma substância natural define o semissintético."}]},"g2-janela":{"tipo":"janela","titulo":"Painel de dose","dica":"Arraste o controle por toda a barra. Visite as quatro zonas.","pts":5,"zonas":[{"id":"z0","nome":"Sem efeito","de":0,"ate":22,"tom":"n","msg":"Abaixo da dose mínima: o fármaco ainda não produz o efeito terapêutico. O tratamento não está funcionando."},{"id":"z1","nome":"Terapêutica","de":22,"ate":60,"tom":"ok","msg":"Entre a dose mínima e a máxima: aqui está o efeito terapêutico desejado. É a janela alvo."},{"id":"z2","nome":"Tóxica","de":60,"ate":85,"tom":"al","msg":"Passou da dose máxima: surgem efeitos tóxicos, perturbações e intoxicação."},{"id":"z3","nome":"Letal","de":85,"ate":100,"tom":"x","msg":"Zona letal: a quantidade pode causar a morte."}]},"g2-fatores":{"tipo":"pick","titulo":"Quem modifica a dose?","dica":"Marque tudo o que o módulo lista como fator que modifica a dosagem. Depois, confira.","pts":5,"itens":[{"t":"Idade","ok":true,"why":"Crianças e idosos respondem de forma diferente."},{"t":"Peso corporal","ok":true,"why":"Está na lista de fatores do módulo."},{"t":"Fatores genéticos","ok":true,"why":"As enzimas variam de pessoa para pessoa."},{"t":"Cor da embalagem","ok":false,"why":"A aparência da caixa não muda a dose."},{"t":"Condições do paciente","ok":true,"why":"Função renal, hepática, cardíaca e doenças alteram a resposta."},{"t":"Nome do laboratório","ok":false,"why":"A marca não é um fator de dosagem."},{"t":"Método de administração","ok":true,"why":"A via e a técnica mudam a quantidade que chega ao sangue."},{"t":"Fatores ambientais e temperatura","ok":true,"why":"Constam no módulo entre os fatores que modificam a dosagem."},{"t":"Tamanho da letra da bula","ok":false,"why":"Não tem relação com a dose."},{"t":"Sexo e fatores psicológicos","ok":true,"why":"Também estão na lista do módulo."}]},"g2-efeitos":{"tipo":"quiz","titulo":"Qual efeito?","dica":"Quando fármacos se encontram, ou quando o efeito foge do plano.","rotulo":"Situação","pts":10,"opts":["Adição","Potencialização","Antagonismo","Efeito adverso ou colateral","Efeito cumulativo"],"itens":[{"q":"Os efeitos de dois fármacos se somam.","a":0,"why":"Adição é o efeito combinado de dois fármacos."},{"q":"Um fármaco aumenta ou prolonga a ação de outro.","a":1,"why":"Esse é o conceito de potencialização."},{"q":"Duas substâncias administradas têm efeito contrário.","a":2,"why":"É o antagonismo."},{"q":"A droga é eliminada mais devagar do que absorvida e a concentração vai subindo (ex.: digitalina).","a":4,"why":"Medicamentos cumulativos exigem atenção às doses acumuladas."},{"q":"Ação diferente do efeito planejado.","a":3,"why":"É o efeito adverso ou indesejado."},{"q":"Efeito imprevisível, sem relação com a principal ação do fármaco.","a":3,"why":"É o efeito colateral. Nenhum medicamento é livre deles."}]},"g3-acao":{"tipo":"quiz","titulo":"Local, sistêmica, remota?","dica":"Diga como cada situação se encaixa.","rotulo":"Situação","pts":10,"opts":["Local","Sistêmica","Remota","Local-geral"],"tons":["c","v","a","m"],"itens":[{"q":"Pomada aplicada diretamente em uma ferida.","a":0,"why":"Age onde foi aplicada, sem passar pelo sangue."},{"q":"Antibiótico por via oral, que precisa ser absorvido e cair na corrente sanguínea.","a":1,"why":"Ação sistêmica: absorção, sangue e depois o local de ação."},{"q":"Colírio instilado na conjuntiva.","a":0,"why":"Ação local na mucosa ocular."},{"q":"A digitalina fortalece o coração, a circulação melhora e a diurese aumenta.","a":2,"why":"Um órgão estimulado que estimula outro: ação remota."},{"q":"Epinefrina na mucosa nasal estanca a hemorragia, é absorvida e eleva a pressão arterial.","a":3,"why":"Efeito local, absorção e depois efeito geral."},{"q":"Antisséptico na pele que impede o desenvolvimento de micro-organismos.","a":0,"why":"O antisséptico é um tipo de ação local."}]},"g3-tipos":{"tipo":"match","titulo":"Ligue o tipo de ação","dica":"Toque em um termo e depois na função correspondente.","pts":5,"pares":[{"l":"Antisséptico","r":"Impede o desenvolvimento de micro-organismos"},{"l":"Adstringente","r":"Contrai o tecido"},{"l":"Emoliente","r":"Lubrifica e amolece o tecido"},{"l":"Anestésico","r":"Paralisa as terminações nervosas sensoriais"},{"l":"Estimulante","r":"Aumenta a atividade de um órgão (ex.: cafeína)"},{"l":"Depressor","r":"Diminui as funções de um órgão (ex.: morfina)"}]},"g3-terapeutica":{"tipo":"quiz","titulo":"Curativa, paliativa ou substitutiva?","dica":"Qual é o objetivo do tratamento?","rotulo":"Situação","pts":10,"opts":["Curativa","Paliativa","Substitutiva"],"tons":["g","a","v"],"itens":[{"q":"Antibiótico que elimina a bactéria causadora da infecção.","a":0,"why":"Remove o agente causador: ação curativa ou específica."},{"q":"Analgésico que alivia a dor de cabeça.","a":1,"why":"Alivia o sintoma: ação paliativa ou sintomática."},{"q":"Insulina em um paciente que não produz o suficiente.","a":2,"why":"Repõe uma substância ausente: ação substitutiva."},{"q":"Antitérmico que baixa a febre, mas não remove a causa dela.","a":1,"why":"Trata o sintoma, sem eliminar a causa."},{"q":"Hormônio tireoidiano no hipotireoidismo.","a":2,"why":"Repõe o hormônio que está em falta."},{"q":"Antiparasitário que provoca a morte do parasita.","a":0,"why":"Elimina o agente causador."}]},"g3-receptor":{"tipo":"agonista","titulo":"Laboratório de receptores","dica":"Teste os quatro cenários e veja o que acontece com a resposta da célula.","pts":5,"estados":[{"id":"livre","nome":"Receptor livre","msg":"O receptor está disponível, sem nenhuma ligação. Sem fármaco, não há resposta."},{"id":"ago","nome":"Agonista","msg":"A chave certa: o agonista se encaixa e ativa o receptor. A resposta, o efeito, acontece."},{"id":"ant","nome":"Antagonista","msg":"Interage com o receptor, mas não o estimula. O receptor fica ocupado e a resposta não acontece."},{"id":"disp","nome":"Os dois juntos","msg":"Agonista e antagonista competitivo disputam o mesmo sítio. Com o antagonista ocupando o receptor, o agonista fica de fora e o efeito é bloqueado."}]},"g3-agonista":{"tipo":"quiz","titulo":"Agonista ou antagonista?","dica":"Quem ativa e quem bloqueia?","rotulo":"Característica","pts":10,"opts":["Agonista","Antagonista"],"tons":["g","r"],"itens":[{"q":"Intensifica ou estimula um receptor.","a":0,"why":"Essa é a definição do agonista."},{"q":"Interage com o receptor, mas não o estimula.","a":1,"why":"Ocupa o receptor sem ativá-lo."},{"q":"Impede as ações de um agonista.","a":1,"why":"É o papel do antagonista."},{"q":"Disputa com o agonista os sítios receptores (competitivo).","a":1,"why":"O antagonista competitivo compete pelo mesmo local."}]},"g4-adme":{"tipo":"adme","titulo":"A jornada ADME","dica":"Toque nas estações, ou avance com o botão. Visite as quatro.","pts":5,"estacoes":[{"id":"abs","nome":"Absorção","sigla":"A","local":"Local de administração","texto":"É a passagem do fármaco do local de administração para o plasma. Começa na escolha da via e termina quando a droga entra na corrente sanguínea.","pontos":["As vias EV e intra-arterial não têm absorção: entram direto na circulação.","Interferem: pH do meio, forma farmacêutica, doenças (como úlceras), dose, fluxo sanguíneo, motilidade gástrica, alimentos e a química do fármaco.","Para a maioria dos fármacos, sem absorção não há ação farmacológica. Exceções: aerossóis e uso tópico."],"enf":"Por isso a via prescrita importa tanto: ela define a velocidade e a quantidade que chegam ao sangue."},{"id":"dist","nome":"Distribuição","sigla":"D","local":"Circulação","texto":"Pela circulação, o fármaco vai até o local de ação. Chega primeiro aos órgãos mais irrigados (sistema nervoso central, pulmão, coração) e depois é redistribuído a tecidos menos irrigados, como o adiposo.","pontos":["Parte do fármaco viaja ligada a proteínas do plasma, como a albumina. A fração ligada é um reservatório e não age; só a fração livre atua.","Desnutrição, hepatite e cirrose reduzem as proteínas do plasma: sobra mais fármaco livre.","Um fármaco muito ligado a proteínas pode ser deslocado por outro que também se liga muito."],"enf":"Pacientes desnutridos ou com doença hepática podem responder de forma mais intensa. Observe e comunique alterações."},{"id":"bio","nome":"Biotransformação","sigla":"M","local":"Fígado, principalmente","texto":"O organismo transforma o fármaco em um composto mais hidrossolúvel, o que facilita a excreção. O fígado é o órgão principal, mas outros tecidos também metabolizam.","pontos":["Fase 1: oxidação, redução e hidrólise, em grande parte pelo citocromo P-450.","Fase 2: conjugação, como a ligação ao ácido glicurônico.","O metabólito pode ser inativo, menos ativo ou até mais ativo. Pró-droga: só fica ativa depois de transformada (ex.: enalapril)."],"enf":"Álcool, tabagismo e alguns fármacos podem aumentar a produção de enzimas e mudar o efeito de outros medicamentos."},{"id":"exc","nome":"Excreção","sigla":"E","local":"Rins, principalmente","texto":"Os compostos são removidos do organismo para o meio externo. Os locais de excreção se chamam emunctórios.","pontos":["Rim: filtração glomerular, secreção tubular e reabsorção tubular.","Também: fezes e bile, pulmões (gases e voláteis), suor, lágrimas, saliva e leite materno.","Doenças dos rins (nefropatias) podem prejudicar a eliminação de alguns fármacos."],"enf":"Pele e cabelo não excretam, mas armazenam algumas substâncias. Fármacos podem passar para o leite materno."}]},"g4-ordem":{"tipo":"order","titulo":"Monte a jornada","dica":"Toque nas etapas na ordem em que acontecem (didaticamente).","passos":[{"t":"Absorção","d":"Do local de administração até a corrente sanguínea.","dica":"A jornada começa na entrada."},{"t":"Distribuição","d":"O fármaco circula e chega ao local de ação.","dica":"Depois de entrar no sangue, ele precisa circular."},{"t":"Biotransformação","d":"O fígado transforma em composto mais hidrossolúvel.","dica":"Antes de sair, ele é transformado."},{"t":"Excreção","d":"Remoção do organismo, principalmente pelos rins.","dica":"A saída é o fim da jornada."}]},"g4-passagem":{"tipo":"quiz","titulo":"Sofre o efeito de primeira passagem?","dica":"O fármaco passa pelo fígado antes de chegar à circulação?","rotulo":"Via","pts":10,"opts":["Sofre","Sofre pouco","Evita"],"tons":["r","a","g"],"itens":[{"q":"Via oral.","a":0,"why":"O fármaco absorvido no intestino passa pelo fígado antes de chegar à circulação sistêmica."},{"q":"Via retal.","a":1,"why":"O módulo cita a via retal sujeita ao efeito, mas em proporções bem reduzidas."},{"q":"Via endovenosa.","a":2,"why":"Entra direto na circulação: não há absorção nem primeira passagem."},{"q":"Via sublingual.","a":2,"why":"Reduz a biotransformação hepática por atingir diretamente a circulação sistêmica."}]},"g4-membrana":{"tipo":"match","titulo":"Ligue o mecanismo","dica":"Toque em um mecanismo e depois na característica.","pts":5,"pares":[{"l":"Difusão passiva de lipossolúveis","r":"Principal mecanismo de transporte dos fármacos"},{"l":"Transporte ativo","r":"Gasta energia e vai contra o gradiente"},{"l":"Difusão facilitada","r":"Usa transportador, sem gastar energia"},{"l":"Lacunas intercelulares","r":"Base da absorção IM e SC e da filtração nos rins"},{"l":"Pinocitose","r":"A membrana engloba uma vesícula com macromoléculas"}]},"g4-orgao":{"tipo":"quiz","titulo":"Qual órgão ou via?","dica":"Onde cada processo acontece?","rotulo":"Pista","pts":10,"opts":["Fígado","Rim","Pulmão","Circulação"],"tons":["a","c","v","m"],"itens":[{"q":"Principal órgão da biotransformação.","a":0,"why":"O fígado prepara a droga para a excreção."},{"q":"Filtra o sangue nos glomérulos e elimina fármacos hidrossolúveis.","a":1,"why":"Filtração glomerular, secreção e reabsorção tubular."},{"q":"Via de eliminação de anestésicos voláteis.","a":2,"why":"O pulmão é via de administração e de eliminação para gases e voláteis."},{"q":"Leva o fármaco até o local de ação.","a":3,"why":"A distribuição acontece pela circulação."},{"q":"Na cirrose, falha em produzir proteínas do plasma e em metabolizar.","a":0,"why":"Os hepatócitos produzem as proteínas plasmáticas."}]},"g5-vias":{"tipo":"curvas","titulo":"Simulador de vias","dica":"Escolha uma via e compare a curva com a da via EV (tracejada). Visite as oito.","pts":3,"vias":[{"id":"ev","nome":"Endovenosa","sigla":"EV","membrana":"Direto na circulação","inicio":"Imediato","ka":0,"ke":0.35,"h":1,"pros":["Efeito rápido e preciso","Grandes volumes em infusões lentas","Aceita substâncias irritantes, se diluídas","Permite controle da dose para evitar toxicidade"],"contras":["Superdosagem relativa se a injeção for rápida","Risco de embolia, irritação do endotélio, infecção por contaminação e reação anafilática","Impróprio para solventes oleosos e substâncias insolúveis"],"enf":"Não há absorção, apenas distribuição. Aplique na velocidade correta."},{"id":"sl","nome":"Sublingual","sigla":"SL","membrana":"Mucosa oral","inicio":"Muito rápido","ka":3,"ke":0.35,"h":0.85,"pros":["Absorção rápida de substâncias hidrossolúveis","Reduz a biotransformação hepática, pois atinge a circulação direto","Útil se o fármaco é instável ao pH gástrico"],"contras":["Imprópria para substâncias irritantes ou de sabor desagradável"],"enf":"A região sublingual é muito irrigada. O comprimido deve ficar sob a língua, sem engolir."},{"id":"im","nome":"Intramuscular","sigla":"IM","membrana":"Capilares do músculo","inicio":"Rápido","ka":2,"ke":0.35,"h":0.85,"pros":["Absorção rápida","Serve para pacientes inconscientes","Adequada para volumes moderados, veículos aquosos, não aquosos e suspensões"],"contras":["Dor","Lesões musculares por substâncias irritantes ou de pH distante da neutro","Processos inflamatórios se a substância for irritante ou mal absorvida"],"enf":"A velocidade depende do local de injeção e do fluxo sanguíneo local."},{"id":"sc","nome":"Subcutânea","sigla":"SC","membrana":"Capilares sob a pele","inicio":"Moderado","ka":1.1,"ke":0.35,"h":0.75,"pros":["Absorção boa e constante para soluções","Absorção lenta para suspensões"],"contras":["Facilidade de sensibilização do paciente","Dor e necrose com substâncias irritantes"],"enf":"Em geral produz efeito mais rápido que a via oral, mas depende do local e do fluxo sanguíneo."},{"id":"vo","nome":"Oral","sigla":"VO","membrana":"Mucosa do trato gastrointestinal","inicio":"Lento","ka":0.7,"ke":0.35,"h":0.6,"pros":["Maior segurança, comodidade e economia","Esquemas fáceis de seguir pelo paciente","Absorção intestinal favorecida pela grande superfície das vilosidades"],"contras":["Efeitos adversos como náuseas, vômitos e diarreia, por irritação da mucosa","Absorção varia com enzimas digestivas, estômago cheio ou vazio, formulação e pH","Exige a cooperação do paciente"],"enf":"Cerca de 75% de um fármaco oral são absorvidos em 1 a 3 horas, em regra. Sofre o efeito de primeira passagem."},{"id":"re","nome":"Retal","sigla":"VR","membrana":"Mucosa retal","inicio":"Variável","ka":0.8,"ke":0.35,"h":0.45,"pros":["Serve para pacientes inconscientes ou com náuseas e vômitos, particularmente lactentes","Reduz a biotransformação hepática"],"contras":["Absorção irregular e incompleta","Irritação da mucosa retal"],"enf":"Útil em quem não consegue tomar pela boca: vômitos, crianças, idosos, transtornos psiquiátricos ou coma."},{"id":"td","nome":"Cutânea e transdérmica","sigla":"TD","membrana":"Pele","inicio":"Lento e sustentado","ka":0.22,"ke":0.12,"h":0.5,"pros":["Efeito local na pele","Adesivo transdérmico dá um estado de equilíbrio estável","Fácil retirar o adesivo se houver efeito indesejado"],"contras":["Muitas drogas são mal absorvidas pela pele","O adesivo só serve para fármacos relativamente lipossolúveis","Preparações caras"],"enf":"A absorção pode ser considerável e causar efeitos sistêmicos. Colírios agem pela absorção no saco conjuntival."},{"id":"in","nome":"Inalatória","sigla":"INA","membrana":"Pulmão","inicio":"Muito rápido","ka":5,"ke":0.8,"h":0.8,"pros":["Usada para anestésicos voláteis e gasosos","O pulmão é via de administração e de eliminação","Grande área de superfície e fluxo de sangue permitem ajustes rápidos"],"contras":["Depende de equipamento e de técnica adequada"],"enf":"Em aerossóis e uso tópico, a absorção nem sempre é necessária para a ação do fármaco."}]},"g5-qualvia":{"tipo":"quiz","titulo":"Qual via?","dica":"Escolha a via descrita em cada situação, segundo o módulo.","rotulo":"Situação","pts":10,"itens":[{"q":"Via mais rápida e precisa para administrar um fármaco.","opts":["Endovenosa","Oral","Subcutânea"],"a":0,"why":"A EV não passa pela absorção: o efeito é rápido e a dose, controlável."},{"q":"Precisa de resposta rápida, e o fármaco é instável ao pH gástrico.","opts":["Sublingual","Oral","Cutânea"],"a":0,"why":"A região sublingual é muito irrigada e evita o fígado e o estômago."},{"q":"Paciente com vômitos e incapaz de tomar pela boca (o módulo cita esta via como útil).","opts":["Retal","Oral","Sublingual"],"a":0,"why":"A via retal é útil em pacientes que não conseguem tomar pela boca, embora a absorção seja irregular."},{"q":"Via usada para anestésicos voláteis e gasosos.","opt l","Propranolol"],"cuidado":"","alerta":""},{"id":"antitus","s":"resp","nome":"Antitussígenos","fn":"Acalmam a tosse improdutiva, sem secreção.","ex":["Codeína","Clobutinol"],"cuidado":"","alerta":""},{"id":"mucol","s":"resp","nome":"Mucolíticos","fn":"Diminuem a aderência das secreções.","ex":["Acetilcisteína","Bromexina","Ambroxol","Carbocisteína"],"cuidado":"","alerta":""},{"id":"expect","s":"resp","nome":"Expectorantes","fn":"Favorecem a tosse produtiva, para eliminar as secreções.","ex":["Cloreto de amônio","Guaiacol","Iodeto de potássio"],"cuidado":"","alerta":""},{"id":"broncod","s":"resp","nome":"Broncodilatadores","fn":"Dilatam os brônquios, facilitando a saída do catarro e a respiração.","ex":["Salbutamol","Fenoterol","Terbutalina","Teofilina","Aminofilina"],"cuidado":"Aminofilina EV: aplicar lentamente (no mínimo 10 min a cada 10 mL) e controlar os sinais vitais depois.","alerta":""},{"id":"antiac","s":"gi","nome":"Antiácidos","fn":"Tamponam a acidez gástrica e protegem a mucosa por barreira física.","ex":["Hidróxido de alumínio","Hidróxido de magnésio"],"cuidado":"","alerta":"O alumínio pode causar constipação; o magnésio pode ter ação purgativa."},{"id":"antiem","s":"gi","nome":"Antieméticos","fn":"Combatem náuseas e vômitos.","ex":["Dimenidrato","Ondansetrona","Metoclopramida"],"cuidado":"","alerta":""},{"id":"laxat","s":"gi","nome":"Laxantes e purgativos","fn":"Reeducadores intestinais têm ação suave; purgativos, ação enérgica; estimulantes aumentam o peristaltismo.","ex":["Plantago","Senne","Óleo mineral","Bisacodil"],"cuidado":"","alerta":""},{"id":"antidiar","s":"gi","nome":"Antidiarreicos e protetores","fn":"Diminuem a diarreia. Absorventes e protetores recobrem a mucosa inflamada.","ex":["Loperamida","Difenoxilato","Carvão ativado","Pectina"],"cuidado":"","alerta":""},{"id":"antifis","s":"gi","nome":"Antifiséticos","fn":"Agente antiespumante: altera a tensão superficial das bolhas de gás.","ex":["Dimeticona"],"cuidado":"","alerta":""},{"id":"bloq","s":"gi","nome":"Bloqueadores da secreção gástrica","fn":"Reduzem a secreção de suco gástrico: antagonistas H2 e inibidores da bomba de prótons.","ex":["Cimetidina","Omeprazol"],"cuidado":"","alerta":""},{"id":"diur","s":"gu","nome":"Diuréticos","fn":"Estimulam a saída de íons e líquidos, evitando edema. Usados na hipertensão.","ex":["Furosemida","Hidroclorotiazida","Clortalidona","Espironolactona"],"cuidado":"Controlar o peso e a diurese.","alerta":""},{"id":"antisurin","s":"gu","nome":"Antissépticos urinários","fn":"Agem somente nas vias urinárias.","ex":["Nitrofurantoína","Ácido nalidíxico","Fenazopiridina"],"cuidado":"","alerta":""},{"id":"ocit","s":"gu","nome":"Ocitócicos","fn":"Provocam contração uterina: induzem o parto e inibem a hemorragia pós-parto.","ex":["Ocitocina","Metilergometrina"],"cuidado":"","alerta":""},{"id":"vit","s":"nut","nome":"Vitaminas","fn":"Atuam em processos metabólicos. A necessidade vem quase toda da alimentação; gravidez e pós-cirúrgico podem exigir suplemento.","ex":["B1","B12","C","A","D","K"],"cuidado":"","alerta":"Cálcio e vitamina D em tratamento prolongado podem calcificar tecidos, inclusive o rim (cálculo renal). A falta de vitamina C causa escorbuto."},{"id":"apet","s":"nut","nome":"Tônicos e estimulantes do apetite","fn":"Sais de cálcio, fósforo e flúor para ossos e dentes. Alguns anti-histamínicos estimulam o apetite.","ex":["Ciproeptadina","Buclizina"],"cuidado":"","alerta":""},{"id":"antihist","s":"alerg","nome":"Anti-histamínicos","fn":"Opõem-se à ação da histamina nas reações alérgicas.","ex":["Dexclorfeniramina","Prometazina"],"cuidado":"","alerta":"Podem causar sonolência. Alguns estimulam o apetite."},{"id":"cortic","s":"alerg","nome":"Corticoides","fn":"Derivados de hormônios da suprarrenal, com ação anti-inflamatória e antialérgica potente.","ex":["Prednisona","Dexametasona","Hidrocortisona","Metilprednisolona"],"cuidado":"Usar com muita cautela, somente com orientação médica.","alerta":"Podem reter líquido (rosto arredondado) e causar imunossupressão. O corticoide que vem de fora inibe a produção do corpo."},{"id":"hipn","s":"snc","nome":"Hipnóticos","fn":"Deprimem o sistema nervoso central e facilitam o sono. Conforme a dose, sedam ou anestesiam.","ex":["Fenobarbital","Midazolam","Nitrazepam"],"cuidado":"","alerta":""},{"id":"neurol","s":"snc","nome":"Neurolépticos","fn":"Agem sobre a excitação, a agressividade, os delírios e as alucinações.","ex":["Haloperidol","Clorpromazina"],"cuidado":"","alerta":""},{"id":"tranq","s":"snc","nome":"Tranquilizantes","fn":"Agem na ansiedade e na tensão. Em baixas doses facilitam o sono; alguns são anticonvulsivantes.","ex":["Diazepam","Bromazepam","Lorazepam"],"cuidado":"","alerta":""},{"id":"antidep","s":"snc","nome":"Antidepressivos","fn":"Diminuem a depressão.","ex":["Amitriptilina","Imipramina","Clomipramina"],"cuidado":"Costumam exigir cerca de três semanas de uso para o efeito positivo aparecer.","alerta":""},{"id":"anest","s":"snc","nome":"Anestésicos","fn":"Gerais: deprimem o sistema nervoso central. Locais: bloqueiam os axônios dos nervos periféricos.","ex":["Fentanil","Halotano","Lidocaína","Bupivacaína"],"cuidado":"","alerta":""},{"id":"anticonv","s":"snc","nome":"Anticonvulsivantes","fn":"Elevam o limiar excitatório e previnem as convulsões.","ex":["Fenitoína","Carbamazepina","Ácido valproico"],"cuidado":"","alerta":""},{"id":"antipark","s":"snc","nome":"Antiparkinsonianos","fn":"Precursores da dopamina, o neurotransmissor envolvido na doença de Parkinson.","ex":["Levodopa + carbidopa","Biperideno"],"cuidado":"","alerta":""},{"id":"analg","s":"dor","nome":"Analgésicos e antitérmicos","fn":"Bloqueiam a síntese de prostaglandinas (dor) e atuam no hipotálamo para baixar a temperatura.","ex":["Paracetamol","Dipirona","AAS"],"cuidado":"","alerta":""},{"id":"opioid","s":"dor","nome":"Analgésicos opioides (narcóticos)","fn":"Atuam em receptores opioides do sistema nervoso central. Usados em dores severas, como cólicas e câncer.","e Pilocarpina em colírio.","a":0,"why":"Colinérgico, como neostigmina e piridostigmina."}]},"final-quiz":{"tipo":"quiz","titulo":"Desafio final","dica":"Escolha a melhor resposta. Sem cronômetro.","rotulo":"Pergunta","pts":15,"itens":[{"q":"Qual afirmação define melhor um medicamento?","opts":["Fármaco com benefício comprovado cientificamente","Qualquer substância que altere o corpo","Apenas o que é vendido em farmácia"],"a":0,"why":"Missão 1: o que o diferencia do fármaco é a comprovação científica."},{"q":"Como se chama a dose que ultrapassa a máxima e causa intoxicação?","opts":["Dose tóxica","Dose mínima","Dose terapêutica"],"a":0,"why":"Missão 2: acima da máxima, surgem efeitos tóxicos."},{"q":"A digitalina fortalece o coração, melhora a circulação e aumenta a diurese. Esse é um exemplo de ação:","opts":["Remota","Local","Sistêmica sem passar pelo sangue"],"a":0,"why":"Missão 3: um órgão estimula outro, distante."},{"q":"Que tipo de fármaco ocupa o sítio do receptor, sem estimulá-lo, e impede as ações de um agonista?","opts":["Antagonista competitivo","Agonista","Pró-droga"],"a":0,"why":"Missão 3."},{"q":"Qual etapa da farmacocinética NÃO acontece na via endovenosa?","opts":["Absorção","Distribuição","Excreção"],"a":0,"why":"Missão 4: a EV entra direto na circulação."},{"q":"O efeito de primeira passagem é mais relevante em qual via?","opts":["Oral","Endovenosa","Sublingual"],"a":0,"why":"Missão 4: o fígado metaboliza antes de a droga chegar à circulação."},{"q":"Qual via é descrita como a mais rápida e precisa?","opts":["Endovenosa","Subcutânea","Retal"],"a":0,"why":"Missão 5."},{"q":"Qual destes NÃO é um elemento essencial da prescrição?","opts":["Cor do papel","Via de administração","Horário ou intervalo"],"a":0,"why":"Missão 6."},{"q":"A prescrição verbal ou telefônica deve ser:","opts":["Evitada; só em urgência e transcrita pelo médico o quanto antes","Preferida nos plantões noturnos","Considerada equivalente à escrita"],"a":0,"why":"Missão 6."},{"q":"Qual troca o farmacêutico pode sugerir, se o prescritor não proibiu?","opts":["Referência por genérico correspondente","Referência por qualquer similar","Genérico por manipulado"],"a":0,"why":"Missão 6."},{"q":"A imprudência é:","opts":["Agir de forma precipitada, sem a cautela devida","Não ter habilidade técnica","Omitir um cuidado que devia ser feito"],"a":0,"why":"Missão 7."},{"q":"Você recebe uma tarefa fora da sua competência legal. Qual a conduta?","opts":["Recusar e comunicar","Fazer para ajudar","Fazer se o paciente concordar"],"a":0,"why":"Missão 7: Art. 14."},{"q":"Quais são os 5 certos?","opts":["Via, medicamento, paciente, dose e hora","Via, marca, médico, dose e local","Dose, laboratório, validade, cor e hora"],"a":0,"why":"Missão 8."},{"q":"Prescrita dopamina e o rótulo diz dobutamina. O que fazer?","opts":["Parar e comunicar: medicamento errado","Administrar: são parecidos","Administrar metade da dose"],"a":0,"why":"Missão 8."},{"q":"Pulso de 52 bpm antes de um digitálico. O que fazer?","opts":["Comunicar o responsável do setor","Administrar normalmente","Aplicar mais rápido"],"a":0,"why":"Missão 9."},{"q":"Qual insulina do módulo começa a agir em cerca de 30 minutos?","opts":["Regular ou simples","NPH","Protamina-zíncica"],"a":0,"why":"Missão 9."}]}}}</script>
<script>
(() => {
'use strict';
/* ============ dados ============ */
const D = JSON.parse(document.getElementById('data').textContent);
const MS = D.missoes, G = D.jogos, META = D.meta, BONUS = META.bonus, LEVELS = META.niveis;
const KEY = 'farmacore:v1';
const LESSON_XP = 10;

/* ============ utilitários ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ic = (id, cls) => `<svg class="ico ${cls || ''}" aria-hidden="true"><use href="#${id}"/></svg>`;
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const pad = n => String(n).padStart(2, '0');
const PRAISE = ['Isso!', 'Acertou!', 'Boa!', 'Exato!', 'Perfeito!', 'Checado!'];
const pick = a => a[Math.floor(Math.random() * a.length)];
const TAGS = {quiz:'Quiz', match:'Conexões', order:'Sequência', pick:'Seleção', explore:'Exploração', janela:'Simulador', adme:'Simulador', curvas:'Simulador', agonista:'Simulador', inspect:'Simulador', checkpoint:'Simulador', codex:'Arsenal', insulina:'Simulador'};
const PERSIST = ['explore', 'janela', 'adme', 'curvas', 'agonista', 'insulina', 'codex'];

/* ============ estado ============ */
const blank = () => ({xp:0, got:{}, games:{}, done:{}, found:{}, lesson:{}, unlocked:{}, name:''});
let S = blank();
let current = 'mapa';
function load() { try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (d && typeof d === 'object') S = Object.assign(blank(), d); } } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function gameMax(g) {
  switch (g.tipo) {
    case 'quiz': return g.itens.length * g.pts;
    case 'match': return g.pares.length * g.pts;
    case 'order': return 20;
    case 'pick': return g.itens.length * g.pts;
    case 'explore': return g.pontos.length * g.pts;
    case 'janela': return g.zonas.length * g.pts;
    case 'adme': return g.estacoes.length * g.pts;
    case 'curvas': return g.vias.length * g.pts;
    case 'agonista': return g.estados.length * g.pts;
    case 'insulina': return g.tipos.length * g.pts;
    case 'inspect': return g.casos.reduce((t, c) => t + c.campos.length * g.pts, 0);
    case 'checkpoint': return g.casos.length * (g.certos.length * g.ptsLinha + g.ptsDecisao);
    case 'codex': return g.meta * g.ptsCartao;
  }
  return 0;
}
const gamesOf = m => (m.treino || []).filter(b => b.t === 'game').map(b => b.id);
const missionMax = m => (m.aula ? LESSON_XP : 0) + BONUS + gamesOf(m).reduce((t, id) => t + gameMax(G[id]), 0);
const trainingOpen = m => !m.aula || S.lesson[m.id] || S.unlocked[m.id] || gamesOf(m).some(id => S.games[id]);
const MAX = MS.reduce((t, m) => t + missionMax(m), 0);
function levelOf(p) { let i = 0; LEVELS.forEach((l, k) => { if (p >= Math.ceil(l.a * MAX)) i = k; }); return i; }
function earned(gid) { let t = 0; for (const k in S.got) { if (k === gid || k.indexOf(gid + ':') === 0) t += S.got[k]; } return t; }
const missionOf = gid => MS.find(m => gamesOf(m).includes(gid));
const seloCount = () => MS.filter(m => S.done[m.id]).length;
const nextMission = () => MS.find(m => !S.done[m.id]);

/* ============ pontos e efeitos ============ */
function award(key, n, at) {
  const prev = S.got[key] || 0;
  if (n <= prev) return 0;
  const before = levelOf(S.xp);
  S.got[key] = n; S.xp += n - prev; save();
  floatPts(n - prev, at);
  updateHUD(true);
  const after = levelOf(S.xp);
  if (after > before) toast('Nova patente: ' + LEVELS[after].nome + '!', true);
  return n - prev;
}
function visit(gid, key, pts, at) {
  S.found[gid] = S.found[gid] || {};
  if (S.found[gid][key]) return false;
  S.found[gid][key] = 1; save();
  award(gid + ':' + key, pts, at);
  return true;
}
const foundCount = gid => Object.keys(S.found[gid] || {}).length;
function gameDone(gid) {
  if (!S.games[gid]) { S.games[gid] = true; save(); }
  const sec = $(`.game[data-gid="${gid}"]`);
  if (sec) setTag(sec, true);
  const m = missionOf(gid); if (m) updateMissionEnd(m.id);
}
function setTag(sec, done) {
  const t = $('.g-tag', sec); if (!t) return;
  t.textContent = done ? 'Concluído' : (TAGS[sec.dataset.type] || 'Jogo');
  sec.classList.toggle('is-done', !!done);
}
function floatPts(n, at) {
  if (reduce) return;
  const el = document.createElement('div'); el.className = 'float-pts'; el.textContent = '+' + n + ' XP';
  let x = innerWidth / 2, y = innerHeight / 2;
  if (at && at.getBoundingClientRect) { const r = at.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top; }
  el.style.left = Math.max(30, Math.min(innerWidth - 70, x)) + 'px'; el.style.top = y + 'px';
  document.body.appendChild(el); setTimeout(() => el.remove(), 1150);
}
let toastT;
function toast(msg, big) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (big ? ' big' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function burst() {
  if (reduce) return;
  const cols = ['#22E4FF', '#8D7DFF', '#FF4FB0', '#5BFFAA', '#FFC24B'];
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('div'); s.className = 'spark';
    const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 190;
    s.style.left = innerWidth / 2 + 'px'; s.style.top = innerHeight / 2 + 'px';
    s.style.background = cols[i % cols.length];
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1250);
  }
}

/* ============ blocos de conteúdo ============ */
const CALL_ICON = {atencao:'i-alert', memo:'i-brain', nota:'i-info', ok:'i-check', exemplo:'i-bolt'};
function pulsoSvg(id) {
  return `<svg class="pulso" viewBox="0 0 80 80" aria-hidden="true"><defs><radialGradient id="pg${id}" cx="50%" cy="38%"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#22E4FF"/><stop offset="1" stop-color="#0a2a6a"/></radialGradient></defs><circle cx="40" cy="40" r="38.5" fill="none" stroke="#8D7DFF" stroke-opacity=".55"/><circle cx="40" cy="40" r="35" fill="none" stroke="#22E4FF" stroke-opacity=".6" stroke-dasharray="3 5"/><circle cx="40" cy="40" r="29" fill="url(#pg${id})"/><circle cx="31" cy="37" r="3.2" fill="#031018"/><circle cx="49" cy="37" r="3.2" fill="#031018"/><path d="M32 48q8 6.5 16 0" stroke="#031018" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>`;
}
function renderBlock(b) {
  switch (b.t) {
    case 'texto':
      return `<section class="txt">${b.titulo ? `<h2 class="blk-title">${esc(b.titulo)}</h2>` : ''}${(b.p || []).map(p => `<p>${fmt(p)}</p>`).join('')}</section>`;
    case 'cards':
      return `<section>${b.titulo ? `<h2 class="blk-title">${esc(b.titulo)}</h2>` : ''}<div class="cards ${b.cols === 3 ? 'c3' : b.cols === 2 ? 'c2' : ''}">${b.itens.map(c => `<article class="card"><h4>${esc(c.t)}${c.tag ? `<span class="tag">${esc(c.tag)}</span>` : ''}</h4><p>${fmt(c.d)}</p></article>`).join('')}</div></section>`;
    case 'callout':
      return `<aside class="callout ${b.kind}">${ic(CALL_ICON[b.kind] || 'i-info')}<div><b>${esc(b.titulo)}</b><p>${fmt(b.texto)}</p></div></aside>`;
    case 'tabela':
      return `<div class="tbl-wrap"><table><thead><tr>${b.cab.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.linhas.map(r => `<tr>${r.map(c => `<td>${fmt(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'lista': {
      const tag = b.ord ? 'ol' : 'ul';
      return `<section class="txt">${b.titulo ? `<h3 class="sub-title">${esc(b.titulo)}</h3>` : ''}<${tag} class="les-list">${b.itens.map(i => `<li>${fmt(i)}</li>`).join('')}</${tag}></section>`;
    }
    case 'fluxo':
      return `<section>${b.titulo ? `<h3 class="sub-title">${esc(b.titulo)}</h3>` : ''}<div class="fluxo">${b.passos.map((p, i) => `<div class="fl-step"><b>${esc(p.t)}</b><span>${esc(p.d || '')}</span></div>${i < b.passos.length - 1 ? `<span class="fl-arr" aria-hidden="true">${ic('i-play')}</span>` : ''}`).join('')}</div></section>`;
    case 'barra':
      return `<section>${b.titulo ? `<h3 class="sub-title">${esc(b.titulo)}</h3>` : ''}<div class="barra">${b.segs.map(x => `<div class="br-seg ${x.c}"><b>${esc(x.n)}</b><span>${esc(x.d || '')}</span></div>`).join('')}</div></section>`;
    case 'pense':
      return `<aside class="pense"><div class="pn-h">${ic('i-brain')} Pare e pense</div><p class="pn-q">${fmt(b.q)}</p><button class="btn btn-sm" data-act="pense">Ver a resposta</button><p class="pn-a" hidden>${fmt(b.a)}</p></aside>`;
    case 'receita':
      return `<section>${b.titulo ? `<h3 class="sub-title">${esc(b.titulo)}</h3>` : ''}<div class="rx">${b.linhas.map(l => `<div class="rc-row"><span class="k">${esc(l.k)}</span><span class="v">${esc(l.v)}</span><span class="n">${esc(l.n || '')}</span></div>`).join('')}</div></section>`;
    case 'game': {
      const g = G[b.id];
      return `<section class="game panel" data-gid="${b.id}" data-type="${g.tipo}"><div class="g-head"><div><div class="g-tag">${TAGS[g.tipo] || 'Jogo'}</div><h3 class="g-title">${esc(g.titulo)}</h3>${g.dica ? `<p class="g-hint">${esc(g.dica)}</p>` : ''}</div><span class="g-pts">+${gameMax(g)} XP</span></div><div class="g-body"></div></section>`;
    }
  }
  return '';
}

/* ============ jogos: montagem ============ */
function mountGame(sec) {
  const gid = sec.dataset.gid, g = G[gid], body = $('.g-body', sec), R = RENDER[g.tipo];
  setTag(sec, !!S.games[gid]);
  if (!PERSIST.includes(g.tipo) && S.games[gid]) {
    body.innerHTML = `<div class="g-done-strip"><span><b>Concluído</b> · ${earned(gid)}/${gameMax(g)} XP</span><button class="btn btn-sm" data-act="replay">${ic('i-reload')} Jogar de novo</button></div>`;
    $('[data-act=replay]', body).onclick = () => R(body, gid, g, sec);
  } else R(body, gid, g, sec);
}
const endMsg = (r, n) => r >= .9 ? 'Excelente! Domínio total desta etapa.' : r >= .6 ? 'Bom trabalho! Releia os pontos que escaparam e tente de novo se quiser.' : 'Vale reler o conteúdo acima e jogar de novo. Errar aqui é treino.';
const replayBtn = (id) => `<button class="btn btn-sm" id="${id}">${ic('i-reload')} Jogar de novo</button>`;

/* ----- quiz ----- */
function rQuiz(body, gid, g) {
  const items = g.itens, n = items.length; let i = 0, right = 0;
  const step = () => {
    const it = items[i]; let opts, a;
    if (it.opts) { const idx = shuffle(it.opts.map((_, k) => k)); opts = idx.map(k => it.opts[k]); a = idx.indexOf(it.a); }
    else { opts = g.opts; a = it.a; }
    const cols = !it.opts && opts.every(o => o.length < 26);
    body.innerHTML = `<div class="g-prog"><span>${esc(g.rotulo || 'Pergunta')} ${i + 1}/${n}</span><div class="bar"><span style="width:${i / n * 100}%"></span></div></div>
      <p class="q-text">${fmt(it.q)}</p>
      <div class="opts ${cols ? 'cols' : ''}" role="group" aria-label="Alternativas">${opts.map((o, k) => `<button class="opt ${!it.opts && g.tons ? 't-' + g.tons[k] : ''}" data-k="${k}"><span class="k">${'ABCDE'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="fb-slot" role="status"></div>`;
    const bs = $$('.opt', body);
    bs.forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === a;
      bs.forEach(x => x.disabled = true);
      b.classList.add(ok ? 'ok' : 'bad'); if (!ok) bs[a].classList.add('ok');
      if (ok) { right++; award(gid + ':' + i, g.pts, b); }
      const last = i === n - 1;
      $('.fb-slot', body).innerHTML = `<div class="fb ${ok ? 'good' : 'miss'}"><b>${ok ? pick(PRAISE) : 'Quase lá'}</b>${ok ? '' : 'Resposta certa: <strong>' + esc(opts[a]) + '</strong>. '}${fmt(it.why)}</div><div class="row" style="margin-top:12px"><button class="btn btn-primary" id="nx">${last ? 'Ver resultado' : 'Próxima'} ${ic('i-play')}</button></div>`;
      const nx = $('#nx', body); nx.focus({preventScroll: true});
      nx.onclick = () => { if (last) end(); else { i++; step(); } };
    });
  };
  const end = () => {
    gameDone(gid);
    body.innerHTML = `<div class="g-end"><div class="score">${right}<small> / ${n} acertos</small></div><p>${endMsg(right / n)}</p><p class="mono small muted">XP neste jogo: ${earned(gid)} de ${gameMax(g)}</p>${replayBtn('rp')}</div>`;
    $('#rp', body).onclick = () => { i = 0; right = 0; step(); };
  };
  step();
}

/* ----- ligar pares ----- */
function rMatch(body, gid, g) {
  const n = g.pares.length;
  const L = g.pares.map((p, i) => ({i, t: p.l}));
  let R = shuffle(g.pares.map((p, i) => ({i, t: p.r})));
  let sl = null, sr = null, done = new Set(), mist = 0;
  body.innerHTML = `<div class="g-prog"><span id="mp">0/${n} pares</span><div class="bar"><span id="mb" style="width:0"></span></div></div>
    <div class="mt"><div class="mt-col" id="ml">${L.map(x => `<button class="mt-it" data-s="l" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>
    <div class="mt-col" id="mr">${R.map(x => `<button class="mt-it" data-s="r" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div><div class="fb-slot" role="status"></div>`;
  const all = $$('.mt-it', body);
  const clear = () => all.forEach(b => b.classList.remove('sel'));
  all.forEach(b => b.onclick = () => {
    const s = b.dataset.s, i = +b.dataset.i;
    if (done.has(i) && b.classList.contains('ok')) return;
    if (s === 'l') sl = i; else sr = i;
    all.filter(x => x.dataset.s === s && !x.classList.contains('ok')).forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    if (sl !== null && sr !== null) {
      if (sl === sr) {
        const pair = all.filter(x => +x.dataset.i === sl);
        pair.forEach(x => { x.classList.remove('sel'); x.classList.add('ok'); x.disabled = true; });
        done.add(sl); award(gid + ':' + sl, g.pts, b);
        $('#mp', body).textContent = done.size + '/' + n + ' pares'; $('#mb', body).style.width = done.size / n * 100 + '%';
        sl = sr = null;
        if (done.size === n) {
          gameDone(gid);
          $('.fb-slot', body).innerHTML = `<div class="fb good"><b>Tudo conectado!</b>${mist ? mist + ' tentativa(s) fora do lugar. ' : 'Sem nenhum erro. '}XP: ${earned(gid)} de ${gameMax(g)}.</div><div class="row" style="margin-top:12px">${replayBtn('rp')}</div>`;
          $('#rp', body).onclick = () => rMatch(body, gid, g);
        }
      } else {
        mist++;
        const bad = all.filter(x => x.classList.contains('sel'));
        bad.forEach(x => x.classList.add('bad'));
        sl = sr = null;
        setTimeout(() => bad.forEach(x => x.classList.remove('bad', 'sel')), 450);
      }
    }
  });
}

/* ----- ordenar ----- */
function rOrder(body, gid, g) {
  const steps = g.passos.map((p, i) => ({...p, i}));
  let pool = shuffle(steps.slice()); if (pool.every((s, k) => s.i === k)) pool.push(pool.shift());
  let next = 0, mist = 0; const placed = [];
  const draw = (msg, bad) => {
    body.innerHTML = `<div class="ord-grid"><div class="ord-col"><h5>Embaralhado</h5><div class="ord-list pool">${pool.map(s => `<button class="step" data-i="${s.i}"><span><b>${esc(s.t)}</b>${s.d ? `<span>${esc(s.d)}</span>` : ''}</span></button>`).join('') || '<p class="muted small">Tudo no lugar.</p>'}</div></div>
      <div class="ord-col"><h5>Sua sequência</h5><div class="ord-list">${placed.map((s, k) => `<div class="step placed"><span class="n">${k + 1}</span><span><b>${esc(s.t)}</b>${s.d ? `<span>${esc(s.d)}</span>` : ''}</span></div>`).join('') || '<p class="muted small">Toque no primeiro passo.</p>'}</div></div></div>
      <div class="fb-slot" role="status">${msg ? `<div class="fb ${bad ? 'info' : 'good'}"><b>${bad ? 'Ainda não' : 'Sequência completa!'}</b>${msg}</div>` : ''}</div>`;
    $$('.pool .step', body).forEach(b => b.onclick = () => {
      const s = steps[+b.dataset.i];
      if (s.i === next) {
        placed.push(s); pool = pool.filter(x => x.i !== s.i); next++;
        if (next === steps.length) {
          const pts = Math.max(5, 20 - 3 * mist); award(gid, pts, b); gameDone(gid);
          draw(`${mist ? mist + ' tentativa(s) fora de ordem. ' : 'Sem nenhum erro. '}XP: ${earned(gid)} de 20.<div class="row" style="margin-top:10px">${replayBtn('rp')}</div>`, false);
          $('#rp', body).onclick = () => rOrder(body, gid, g);
        } else draw('', false);
      } else {
        mist++; b.classList.add('shake');
        const sl = $('.fb-slot', body); sl.innerHTML = `<div class="fb info"><b>Ainda não</b>${esc(steps[next].dica || 'Pense no que vem primeiro.')}</div>`;
        setTimeout(() => b.classList.remove('shake'), 400);
      }
    });
  };
  draw();
}

/* ----- janela de dose ----- */
function ecgPath(period, amp, jit) {
  let d = 'M0 38'; const mid = 38;
  for (let x = 0; x < 800; x += period) {
    const j = jit ? (Math.random() - .5) * jit : 0;
    d += ` L${x + period * .28} ${mid} L${x + period * .34} ${mid - amp * .22} L${x + period * .4} ${mid} L${x + period * .5} ${mid} L${x + period * .54} ${mid + amp * .2} L${x + period * .6} ${mid - amp - j} L${x + period * .66} ${mid + amp * .42} L${x + period * .72} ${mid} L${x + period * .86} ${mid - amp * .28} L${x + period * .96} ${mid} L${x + period} ${mid}`;
  }
  return d;
}
const TONE = {n:'#8FA3C2', ok:'#5BFFAA', al:'#FFC24B', x:'#FF5470'};

/* ----- curvas por via ----- */
function curvePts(v) {
  const N = 90, T = 10, pts = [];
  for (let k = 0; k <= N; k++) {
    const t = k / N * T;
    pts.push(v.ka ? v.ka / (v.ka - v.ke) * (Math.exp(-v.ke * t) - Math.exp(-v.ka * t)) : Math.exp(-v.ke * t));
  }
  const m = Math.max(...pts);
  return pts.map(p => p / m * v.h);
}
function rCurvas(body, gid, g) {
  const X0 = 44, X1 = 346, Y0 = 176, Y1 = 22, N = 90;
  const toPath = pts => pts.map((p, k) => (k ? 'L' : 'M') + (X0 + (X1 - X0) * k / N).toFixed(1) + ' ' + (Y0 - (Y0 - Y1) * p).toFixed(1)).join(' ');
  const ev = toPath(curvePts(g.vias[0]));
  body.innerHTML = `<div class="cv-chips" role="group" aria-label="Vias">${g.vias.map((v, i) => `<button class="cv-chip${S.found[gid] && S.found[gid][v.id] ? ' seen' : ''}" data-i="${i}">${v.sigla}</button>`).join('')}</div>
    <svg class="cv-svg" viewBox="0 0 360 206" role="img" aria-label="Curva ilustrativa de concentração no sangue ao longo do tempo"><defs><linearGradient id="cvg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22E4FF" stop-opacity=".35"/><stop offset="1" stop-color="#22E4FF" stop-opacity="0"/></linearGradient></defs>
      <line class="cv-ax" x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}"/><line class="cv-ax" x1="${X0}" y1="${Y1 - 6}" x2="${X0}" y2="${Y0}"/>
      <text class="cv-t" x="${X1}" y="${Y0 + 18}" text-anchor="end">tempo →</text><text class="cv-t" x="${X0 - 6}" y="${Y1}" text-anchor="end">conc.</text>
      <path class="cv-ref" d="${ev}"/><path class="cv-area" id="ca" d=""/><path class="cv-cur" id="cc" d=""/>
      <text class="cv-t" x="${X1}" y="${Y1 + 6}" text-anchor="end" fill="#aaa">tracejada = EV (referência)</text></svg>
    <div class="cv-info" id="ci" role="region" aria-live="polite"></div>`;
  const sel = i => {
    const v = g.vias[i], pts = curvePts(v), d = toPath(pts);
    $('#cc', body).setAttribute('d', d); $('#ca', body).setAttribute('d', d + ` L${X1} ${Y0} L${X0} ${Y0} Z`);
    $$('.cv-chip', body).forEach((b, k) => { b.classList.toggle('on', k === i); if (k === i) b.classList.add('seen'); });
    $('#ci', body).innerHTML = `<div class="cv-kpis"><span class="kpi">Via: <b>${esc(v.nome)}</b></span><span class="kpi">Início: <b>${esc(v.inicio)}</b></span><span class="kpi">Membrana: <b>${esc(v.membrana)}</b></span></div>
      <div class="pc"><div class="p"><h5>Vantagens</h5><ul>${v.pros.map(x => `<li>${fmt(x)}</li>`).join('')}</ul></div><div class="c"><h5>Desvantagens</h5><ul>${v.contras.map(x => `<li>${fmt(x)}</li>`).join('')}</ul></div></div>
      <div class="callout atencao">${ic('i-alert')}<div><b>Olhar de enfermagem</b><p>${fmt(v.enf)}</p></div></div>`;
    visit(gid, v.id, g.pts, $$('.cv-chip', body)[i]);
    if (foundCount(gid) >= g.vias.length) gameDone(gid);
  };
  $$('.cv-chip', body).forEach(b => b.onclick = () => sel(+b.dataset.i));
  sel(0);
}

      $('#cpn', body).onclick = () => {
        if (!last) { ci++; draw(); return; }

        body.innerHTML = `<div class="g-end"><div class="score">${decHit}<small> / ${g.casos.length} decisões certas</small></div><p>${hit} de ${tot} certos conferidos. ${endMsg(decHit / g.casos.length)}</p><p class="mono small muted">XP neste jogo: ${earned(gid)} de ${gameMax(g)}</p>${replayBtn('rp')}</div>`;

function bindCert(box) {
  const inp = $('#cert-in', box); if (!inp) return;
  inp.oninput = () => { S.name = inp.value.trim(); save(); $('#cert-nm', box).textContent = S.name; };
  $('#cert-pr', box).onclick = () => {
    const holder = $('#cert-print'); holder.innerHTML = $('#cert', box).outerHTML; holder.hidden = false;
    const after = () => { holder.hidden = true; holder.innerHTML = ''; window.removeEventListener('afterprint', after); };
    window.addEventListener('afterprint', after); window.print();
  };
}
function completeMission(mid) {
  const m = MS.find(x => x.id === mid); if (S.done[mid]) return;
  award('bonus:' + mid, BONUS, $('#fin')); S.done[mid] = true; save(); updateHUD(); burst(); updateMissionEnd(mid);
  seloModal(m);
}
function seloModal(m) {
  const md = $('#modal'), idx = MS.indexOf(m), nxt = MS[idx + 1], fim = !MS.some(x => !S.done[x.id]);
  md.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-label="Selo conquistado"><div class="eyebrow">${fim ? 'Trilha completa' : 'Selo conquistado'}</div><div class="hex-big">${ic(m.icone)}</div><h3>${esc(m.selo)}</h3>
    <p class="muted">${fim ? 'Você concluiu toda a trilha. Patente atual: ' : 'Missão concluída. Patente atual: '}<strong>${esc(LEVELS[levelOf(S.xp)].nome)}</strong> · ${S.xp} XP.</p>
    <div class="row center">${nxt ? `<button class="btn btn-primary" data-go="${nxt.id}" data-close>Próxima missão</button>` : ''}<button class="btn" data-go="mapa" data-close>Ver o mapa</button><button class="btn btn-ghost" data-close>Fechar</button></div></div>`;
  md.hidden = false; const f = $('button', md); if (f) f.focus();
  md.onclick = e => { if (e.target === md) closeModal(); };
}
function closeModal() { const md = $('#modal'); md.hidden = true; md.innerHTML = ''; }

/* ============ navegação ============ */
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  if (MS.some(m => m.id === parts[0])) show(parts[0], parts[1]); else show('mapa');
}
function go(id) {
  const target = id === 'mapa' ? '#/' : '#/' + id;
  if (location.hash === target || (id === 'mapa' && !location.hash)) route(); else location.hash = target;
}
function show(id, tab) {
  current = id; document.body.dataset.view = id === 'mapa' ? 'mapa' : 'missao';
  const app = $('#app');
  if (id === 'mapa') app.innerHTML = renderHome();
  else {
    const m = MS.find(x => x.id === id);
    curTab = !m.aula ? 'treino' : (tab === 'aula' || tab === 'treino' ? tab : defaultTab(m));
    app.innerHTML = renderMission(m, curTab);
    if (curTab === 'treino' && trainingOpen(m)) { $$('.game', app).forEach(mountGame); updateMissionEnd(id); }
  }
  window.scrollTo({top: 0, behavior: 'auto'});
  const h = $('.m-title', app) || $('.hero-title', app); if (h) h.focus({preventScroll: true});
  updateHUD(); document.title = (id === 'mapa' ? 'FARMACORE — Administração de Medicamentos' : MS.find(x => x.id === id).titulo + ' · FARMACORE');
}
function bind() {
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); const cl = g.hasAttribute('data-close'); if (cl) closeModal(); go(g.dataset.go); return; }
    if (e.target.closest('[data-close]')) closeModal();
    const pn = e.target.closest('[data-act=pense]');
    if (pn) { const a = pn.parentElement.querySelector('.pn-a'); a.hidden = !a.hidden; pn.textContent = a.hidden ? 'Ver a resposta' : 'Esconder a resposta'; return; }
    const sc = e.target.closest('[data-scroll]');
    if (sc) { const t = document.getElementById(sc.dataset.scroll); if (t) t.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'}); return; }
    const lf = e.target.closest('#les-fin'); if (lf) { finishLesson(lf.dataset.mid, lf); return; }
    const ul = e.target.closest('[data-act=unlock]'); if (ul) { S.unlocked[ul.dataset.mid] = true; save(); route(); return; }
    if (e.target.closest('#reset')) { if (confirm('Zerar todo o progresso (XP, selos e jogos) neste aparelho?')) { S = blank(); save(); route(); toast('Progresso zerado.'); } }
  });
  $('#brand').onclick = () => go('mapa'); $('#btn-map').onclick = () => go('mapa');
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
}

/* ============ fundo animado ============ */
function fx() {
  const c = $('#fx'); if (!c || reduce) return;
  const ctx = c.getContext('2d'); let w, h, pts = [], last = 0;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const resize = () => { w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); const n = Math.min(46, Math.round(w * h / 32000)); pts = Array.from({length: n}, () => ({x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25})); };
  resize(); window.addEventListener('resize', resize);
  const loop = t => {
    requestAnimationFrame(loop);
    if (document.hidden || t - last < 33) return; last = t;
    ctx.clearRect(0, 0, w, h);
    pts.forEach(p => { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > w) p.vx *= -1; if (p.y < 0 || p.y > h) p.vy *= -1; });
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y, d = dx * dx + dy * dy;
        if (d < 17000) { ctx.strokeStyle = `rgba(34,228,255,${(1 - d / 17000) * .22})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke(); }
      }
      ctx.fillStyle = 'rgba(120,230,255,.55)'; ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, 1.6, 0, 6.3); ctx.fill();
    }
  };
  requestAnimationFrame(loop);
}

/* ============ início ============ */
load(); bind(); fx(); route();
})();

</script>
