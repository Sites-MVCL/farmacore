<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="Cybele França Brito">
<meta name="theme-color" content="#050A14">
<title>FARMACORE — Administração de Medicamentos</title>
<meta name="description" content="Trilha interativa e gamificada de farmacologia para técnicos de enfermagem: 9 missões, simuladores e desafio final sobre administração de medicamentos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Orbitron:wght@500;600;700;800;900&display=swap">
<style>
/* FARMACORE — tema futurista: console clínico escuro, neon ciano, painéis com cantos marcados */
:root{
  color-scheme: dark;
  --bg:#050A14; --bg2:#09111F;
  --panel:rgba(11,21,38,.82); --panel-2:rgba(16,30,52,.9); --panel-solid:#0B1526;
  --line:rgba(70,190,255,.20); --line-2:rgba(70,200,255,.42);
  --ink:#E7F2FF; --muted:#93A9C8; --dim:#5F7899;
  --cyan:#22E4FF; --cyan-d:#0AA9C4; --cyan-s:rgba(34,228,255,.12);
  --violet:#8D7DFF; --violet-s:rgba(141,125,255,.14);
  --magenta:#FF4FB0; --magenta-s:rgba(255,79,176,.13);
  --lime:#5BFFAA; --lime-s:rgba(91,255,170,.12);
  --amber:#FFC24B; --amber-s:rgba(255,194,75,.13);
  --red:#FF5470; --red-s:rgba(255,84,112,.13);
  --f-display:"Orbitron","Eurostile","Bank Gothic",system-ui,sans-serif;
  --f-body:"Exo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
  --glow:0 0 0 1px rgba(34,228,255,.25),0 0 22px -4px rgba(34,228,255,.45);
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.62;padding:0 16px 72px;position:relative;overflow-x:hidden}
@media(min-width:720px){body{padding-inline:28px}}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 520px at 85% -10%,rgba(34,228,255,.13),transparent 60%),
  radial-gradient(700px 480px at -10% 30%,rgba(141,125,255,.12),transparent 60%),
  radial-gradient(800px 600px at 60% 110%,rgba(255,79,176,.08),transparent 60%),
  linear-gradient(180deg,#050A14,#070F1D 60%,#050A14)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:linear-gradient(rgba(70,190,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(70,190,255,.07) 1px,transparent 1px);
  background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 30%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 80% 70% at 50% 30%,#000 30%,transparent 80%)}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.12;letter-spacing:.02em;text-wrap:balance;font-weight:700}
p{margin:0}
ul,ol{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cyan)}
strong{color:#fff;font-weight:700}
::selection{background:rgba(34,228,255,.35)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
.muted{color:var(--muted)} .small{font-size:.9rem}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}

/* ---------- painel base ---------- */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;border:2px solid var(--cyan);opacity:.8}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:var(--r)}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:var(--r)}
.panel.flat::before,.panel.flat::after{display:none}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:6px;border:1px solid var(--line-2);background:rgba(34,228,255,.06);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;transition:transform .12s,box-shadow .15s,background .15s,border-color .15s}
.btn:hover{background:rgba(34,228,255,.14);border-color:var(--cyan);box-shadow:var(--glow);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-primary{background:linear-gradient(135deg,#22E4FF,#4FA3FF);color:#031018;border-color:transparent;box-shadow:0 0 28px -6px rgba(34,228,255,.7)}
.btn-primary:hover{background:linear-gradient(135deg,#6EF0FF,#6FB4FF);color:#031018;box-shadow:0 0 34px -4px rgba(34,228,255,.9)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:rgba(255,255,255,.05);border-color:var(--line);box-shadow:none}
.btn-lg{min-height:56px;padding:12px 28px;font-size:.92rem}
.btn-sm{min-height:36px;padding:6px 12px;font-size:.7rem}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row.center{justify-content:center}

/* ---------- HUD ---------- */
.hud{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:40;max-width:1120px;margin:8px auto 0;display:flex;align-items:center;gap:10px;padding:8px 10px 10px 12px;background:rgba(6,13,26,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line-2);border-radius:10px;overflow:hidden;box-shadow:0 10px 40px -16px rgba(0,0,0,.8),0 0 0 1px rgba(34,228,255,.05)}
.hud-brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 6px;font-family:var(--f-display);font-weight:800;font-size:1.02rem;letter-spacing:.14em;color:#fff;white-space:nowrap}
.hud-brand .ico{width:26px;height:26px;color:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}
.hud-brand b{color:var(--cyan);font-weight:800}
.hud-stats{margin-left:auto;display:flex;align-items:center;gap:6px;min-width:0}
.stat{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-family:var(--f-mono);font-size:.8rem;font-weight:600;white-space:nowrap;line-height:1.2}
.stat b{font-variant-numeric:tabular-nums}
.stat .ico{width:15px;height:15px}
.stat-xp{color:var(--amber);border-color:rgba(255,194,75,.35)}
.stat-xp.bump{animation:bump .5s ease}
.stat-lvl{color:var(--violet);border-color:rgba(141,125,255,.4)}
.stat-selo{color:var(--magenta);border-color:rgba(255,79,176,.35)}
.btn-map{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:6px;background:rgba(34,228,255,.1);color:var(--cyan);padding:6px 11px;font-family:var(--f-mono);font-weight:600;font-size:.8rem}
.btn-map:hover{background:rgba(34,228,255,.2)}
body[data-view="mapa"] .btn-map{display:none}
.hud-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
.hud-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--magenta));box-shadow:0 0 12px var(--cyan);transition:width .6s ease}
@media(max-width:640px){.brand-name,.stat-u,.lvl-k,.btn-map span{display:none}.hud{gap:6px;padding-inline:8px}.stat{padding:5px 8px;font-size:.76rem}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18);box-shadow:0 0 18px rgba(255,194,75,.7)}100%{transform:scale(1)}}

/* ---------- telas ---------- */
.view{max-width:1120px;margin-inline:auto}
.mission{max-width:800px;margin-inline:auto;padding-block:26px 0}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr);gap:34px;padding-block:34px 10px}
@media(min-width:960px){.home{grid-template-columns:minmax(0,1fr) 440px;gap:56px;align-items:start;padding-top:50px}}
.home-text{display:grid;gap:20px;align-content:start;min-width:0}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;width:fit-content;padding:5px 12px;border:1px solid var(--line-2);border-radius:999px;background:rgba(34,228,255,.07);font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.hero-kicker i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);animation:blink 1.6s infinite}
.hero-title{font-size:clamp(2.7rem,9.5vw,5.1rem);font-weight:900;letter-spacing:.06em;line-height:.95;color:#fff;text-shadow:0 0 30px rgba(34,228,255,.35)}
.hero-title span{background:linear-gradient(90deg,var(--cyan),var(--violet) 60%,var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(34,228,255,.4))}
.lead{font-size:1.14rem;color:var(--muted);max-width:60ch}
.pulso-row{display:flex;align-items:flex-end;gap:14px}
.pulso{width:78px;height:78px;flex:none;animation:float 4.5s ease-in-out infinite}
.bubble{position:relative;background:var(--panel-2);border:1px solid var(--line-2);border-radius:14px 14px 14px 4px;padding:12px 16px;font-size:.98rem;max-width:46ch;box-shadow:0 0 24px -10px rgba(34,228,255,.5)}
.bubble .who{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;color:var(--cyan);margin-bottom:2px}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.cta-note{font-size:.9rem;color:var(--muted);font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:.82rem;color:var(--muted)}
.chip .ico{width:14px;height:14px;color:var(--cyan)}
.vitrine{display:grid;gap:12px}
.vit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.selo-box{display:grid;justify-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:8px;border:1px dashed var(--line);color:var(--dim);font-size:.74rem;line-height:1.25}
.selo-box .hex{width:54px;height:60px}
.selo-box.on{border-style:solid;border-color:rgba(255,194,75,.45);background:var(--amber-s);color:var(--ink)}

.map-wrap{display:grid;gap:10px;justify-items:center}
.map{position:relative;width:100%;max-width:440px;border-radius:14px;overflow:hidden;border:1px solid var(--line-2);background:linear-gradient(180deg,rgba(10,20,38,.9),rgba(7,14,28,.9));box-shadow:0 0 50px -18px rgba(34,228,255,.5)}
.map-bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.seg{fill:none;stroke:rgba(70,190,255,.28);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 9}
.seg.done{stroke:var(--cyan);stroke-dasharray:none;stroke-width:3.5;filter:drop-shadow(0 0 5px var(--cyan))}
.node{position:absolute;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;--d:58px;color:var(--ink)}
.node-l{transform:translate(calc(var(--d) / -2),-50%)}
.node-r{flex-direction:row-reverse;text-align:right;transform:translate(calc(-100% + var(--d) / 2),-50%)}
.hexd{position:relative;flex:none;width:var(--d);height:calc(var(--d) * 1.1);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;background:linear-gradient(160deg,rgba(34,228,255,.7),rgba(141,125,255,.5))}
.hexd::before{content:"";position:absolute;inset:2px;clip-path:inherit;background:#0A1426}
.hexd>*{position:relative}
.hexd .ico{width:24px;height:24px;color:var(--cyan)}
.node-n{position:absolute;top:-2px;right:-2px;font-family:var(--f-mono);font-size:.62rem}
.node-lab{display:grid;gap:1px;max-width:128px;line-height:1.15}
.node-lab b{font-family:var(--f-display);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
.node-lab span{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.node:hover .hexd,.node:focus-visible .hexd{filter:drop-shadow(0 0 10px var(--cyan))}
.node.done .hexd{background:linear-gradient(160deg,var(--lime),var(--cyan))}
.node.done .hexd::before{background:#0C2A2E}
.node.done .hexd .ico{color:var(--lime)}
.node.now .hexd{background:linear-gradient(160deg,var(--amber),var(--magenta));animation:pulse 1.8s infinite}
.node.now .hexd .ico{color:var(--amber)}
.node.now .node-lab span{color:var(--amber)}
.map-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.map-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px var(--amber))}50%{filter:drop-shadow(0 0 14px var(--amber))}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- missão ---------- */
.m-head{display:grid;gap:12px;margin-bottom:22px}
.m-title{font-size:clamp(1.7rem,5.5vw,2.5rem);color:#fff}
.m-sub{font-size:1.1rem;color:var(--muted)}
.m-meta{display:flex;flex-wrap:wrap;gap:8px}
.meta-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.meta-pill .ico{width:14px;height:14px;color:var(--cyan)}
.objetivo{border-left:3px solid var(--cyan);background:linear-gradient(90deg,rgba(34,228,255,.1),transparent);padding:12px 16px;border-radius:0 8px 8px 0}
.objetivo b{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:3px}
.blocks{display:grid;gap:22px}
.blk-title{font-size:1.28rem;color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.blk-title::before{content:"";width:8px;height:20px;background:linear-gradient(var(--cyan),var(--violet));border-radius:2px;box-shadow:0 0 10px var(--cyan)}
.txt p+p{margin-top:10px}
.txt p{color:#CFE0F5}

.cards{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:620px){.cards.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.cards.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;position:relative;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line-2)}
.card h4{font-size:.86rem;letter-spacing:.07em;text-transform:uppercase;color:var(--cyan);display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:5px}
.card .tag{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.06em;text-transform:none;color:var(--muted);border:1px solid var(--line);padding:1px 7px;border-radius:99px;font-weight:500}
.card p{font-size:.97rem;color:#C5D8F0}
.card p+p{margin-top:6px}

.callout{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 16px;border-radius:8px;border:1px solid;--c:var(--cyan);border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent)}
.callout .ico{width:24px;height:24px;color:var(--c);margin-top:2px}
.callout b{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin-bottom:2px}
.callout p{color:#DCEBFF;font-size:.98rem}
.callout.atencao{--c:var(--amber)} .callout.memo{--c:var(--violet)} .callout.nota{--c:var(--cyan)} .callout.ok{--c:var(--lime)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;text-align:left;color:var(--cyan);background:rgba(34,228,255,.07);padding:10px 14px}
td{padding:10px 14px;border-top:1px solid var(--line);color:#CFE0F5;vertical-align:top}
td:first-child{font-weight:700;color:#fff}

/* ---------- jogos ---------- */
.game{padding:20px;border-color:var(--line-2);background:linear-gradient(180deg,rgba(14,28,50,.9),rgba(9,18,34,.9));box-shadow:0 0 40px -22px rgba(34,228,255,.7)}
.g-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.g-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--magenta);margin-bottom:4px}
.g-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--magenta);box-shadow:0 0 8px var(--magenta)}
.game.is-done .g-tag{color:var(--lime)}
.game.is-done .g-tag::before{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.g-title{font-size:1.15rem;color:#fff}
.g-hint{color:var(--muted);font-size:.93rem;margin-top:3px}
.g-pts{font-family:var(--f-mono);font-size:.78rem;font-weight:700;color:var(--amber);border:1px solid rgba(255,194,75,.4);background:var(--amber-s);padding:3px 9px;border-radius:6px;white-space:nowrap}
.g-prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.g-prog .bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.g-prog .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 8px var(--cyan);transition:width .4s}
.q-text{font-size:1.1rem;color:#fff;margin-bottom:14px;line-height:1.45}
.opts{display:grid;gap:8px}
.opts.cols{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 14px;text-align:left;border:1px solid var(--line-2);border-radius:8px;background:rgba(255,255,255,.035);color:var(--ink);transition:border-color .12s,background .12s,transform .1s,box-shadow .12s;--t:var(--cyan)}
.opt:hover:not(:disabled){border-color:var(--t);background:color-mix(in srgb,var(--t) 12%,transparent);transform:translateX(2px)}
.opt .k{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:5px;border:1px solid color-mix(in srgb,var(--t) 60%,transparent);color:var(--t);font-family:var(--f-mono);font-size:.76rem;font-weight:700}
.opts.cols .opt{justify-content:center;text-align:center}
.opts.cols .opt .k{display:none}
.opt.t-c{--t:var(--cyan)} .opt.t-v{--t:var(--violet)} .opt.t-a{--t:var(--amber)} .opt.t-m{--t:var(--magenta)} .opt.t-g{--t:var(--lime)} .opt.t-r{--t:var(--red)}
.opt.ok{border-color:var(--lime);background:var(--lime-s);box-shadow:0 0 18px -6px var(--lime)}
.opt.ok .k{background:var(--lime);color:#021;border-color:var(--lime)}
.opt.bad{border-color:var(--red);background:var(--red-s)}
.opt.bad .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt:disabled:not(.ok):not(.bad){opacity:.45}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;border:1px solid;font-size:.96rem;animation:rise .25s ease}
.fb b{display:block;font-family:var(--f-display);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.fb.good{border-color:rgba(91,255,170,.5);background:var(--lime-s)} .fb.good b{color:var(--lime)}
.fb.miss{border-color:rgba(255,84,112,.5);background:var(--red-s)} .fb.miss b{color:var(--red)}
.fb.info{border-color:var(--line-2);background:var(--cyan-s)} .fb.info b{color:var(--cyan)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.g-end{display:grid;gap:12px;justify-items:start;animation:rise .3s}
.g-end .score{font-family:var(--f-display);font-size:2rem;color:#fff}
.g-end .score small{font-size:.9rem;color:var(--muted);font-family:var(--f-mono)}
.g-done-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:8px;border:1px solid rgba(91,255,170,.4);background:var(--lime-s)}
.g-done-strip b{color:var(--lime)}

/* ordem */
.ord-grid{display:grid;gap:14px}
@media(min-width:680px){.ord-grid{grid-template-columns:1fr 1fr}}
.ord-col h5{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;font-weight:600}
.ord-list{display:grid;gap:8px;align-content:start;min-height:60px}
.step{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:rgba(255,255,255,.035);text-align:left;width:100%}
.step b{display:block;color:#fff}
.step span{font-size:.88rem;color:var(--muted)}
.pool .step:hover{border-color:var(--cyan);background:var(--cyan-s)}
.step.placed{border-color:rgba(91,255,170,.5);background:var(--lime-s)}
.step .n{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:5px;background:var(--lime);color:#021;font-family:var(--f-mono);font-weight:700;font-size:.8rem}
.step.shake{animation:shake .35s;border-color:var(--red)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* pick */
.pk{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.pk-it{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;background:rgba(255,255,255,.035);text-align:left;width:100%}
.pk-it .box{flex:none;width:22px;height:22px;border-radius:5px;border:1px solid var(--line-2);display:grid;place-items:center;color:transparent}
.pk-it.sel{border-color:var(--cyan);background:var(--cyan-s)}
.pk-it.sel .box{background:var(--cyan);color:#021;border-color:var(--cyan)}
.pk-it.ok{border-color:var(--lime);background:var(--lime-s)}
.pk-it.bad{border-color:var(--red);background:var(--red-s)}
.pk-it small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}

/* explore */
.ex{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.ex-it{text-align:left;padding:14px;border:1px solid var(--line-2);border-radius:8px;background:rgba(255,255,255,.035);min-height:76px;width:100%;transition:all .15s}
.ex-it b{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;color:var(--cyan)}
.ex-it p{margin-top:8px;font-size:.95rem;color:#CFE0F5}
.ex-it:not(.open){border-style:dashed}
.ex-it:not(.open):hover{border-color:var(--cyan);background:var(--cyan-s)}
.ex-it.open{border-color:rgba(91,255,170,.5);background:var(--lime-s)}
.ex-it.open b{color:var(--lime)}

/* match */
.mt{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.mt{gap:8px}}
.mt-col{display:grid;gap:8px;align-content:start}
.mt-it{padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;background:rgba(255,255,255,.035);text-align:left;width:100%;font-size:.94rem;min-height:48px;transition:all .12s}
.mt-it:hover:not(:disabled){border-color:var(--cyan);background:var(--cyan-s)}
.mt-it.sel{border-color:var(--amber);background:var(--amber-s);box-shadow:0 0 14px -4px var(--amber)}
.mt-it.ok{border-color:var(--lime);background:var(--lime-s);opacity:.9}
.mt-it.bad{border-color:var(--red);background:var(--red-s);animation:shake .35s}
.mt-it:disabled{cursor:default}

/* janela de dose */
.jn-mon{border:1px solid var(--line-2);border-radius:10px;background:#04101B;padding:12px 14px;display:grid;gap:8px}
.jn-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.jn-led{display:inline-flex;align-items:center;gap:7px;font-weight:700}
.jn-led i{width:9px;height:9px;border-radius:50%;background:var(--c,#7a8);box-shadow:0 0 10px var(--c,#7a8)}
.jn-ecg{width:100%;height:76px;display:block}
.jn-ecg path{fill:none;stroke:var(--c,#7a8);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--c,#7a8));animation:ecgmove 3s linear infinite}
@keyframes ecgmove{to{transform:translateX(-400px)}}
.jn-gauge{position:relative;height:34px;border-radius:8px;overflow:hidden;display:flex;border:1px solid var(--line-2);margin-top:14px}
.jn-z{display:grid;place-items:center;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.85);overflow:hidden;white-space:nowrap}
.jn-z.n{background:rgba(120,140,170,.35)} .jn-z.ok{background:rgba(91,255,170,.4)} .jn-z.al{background:rgba(255,194,75,.42)} .jn-z.x{background:rgba(255,84,112,.5)}
.jn-z.seen{box-shadow:inset 0 -3px 0 var(--lime)}
.jn-range{width:100%;margin:10px 0 0;-webkit-appearance:none;appearance:none;height:30px;background:transparent}
.jn-range::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,#6c7f9c,#5BFFAA 30%,#FFC24B 65%,#FF5470)}
.jn-range::-moz-range-track{height:6px;border-radius:99px;background:linear-gradient(90deg,#6c7f9c,#5BFFAA 30%,#FFC24B 65%,#FF5470)}
.jn-range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--cyan);margin-top:-10px;box-shadow:0 0 16px var(--cyan)}
.jn-range::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--cyan);box-shadow:0 0 16px var(--cyan)}
.jn-msg{margin-top:10px;padding:12px 14px;border-radius:8px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);min-height:72px}
.jn-msg b{font-family:var(--f-display);font-size:.9rem;color:var(--c);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}

/* adme */
.ad-track{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:30px 4px 6px}
.ad-line{position:absolute;left:12.5%;right:12.5%;top:52px;height:3px;background:repeating-linear-gradient(90deg,var(--line-2) 0 8px,transparent 8px 14px)}
.ad-line span{position:absolute;left:0;top:0;height:100%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);transition:width .6s}
.ad-cap{position:absolute;top:43px;left:12.5%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--cyan) 55%,#0a6);box-shadow:0 0 18px var(--cyan);transition:left .6s cubic-bezier(.5,0,.2,1);z-index:2}
.ad-st{position:relative;z-index:1;display:grid;justify-items:center;gap:6px;width:25%;background:none;border:0;padding:0;text-align:center}
.ad-st .hexd{--d:50px}
.ad-st .hexd b{font-family:var(--f-display);font-size:1.1rem;color:var(--cyan)}
.ad-st span{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ad-st.on .hexd{background:linear-gradient(160deg,var(--amber),var(--magenta))}
.ad-st.on span{color:var(--amber)}
.ad-st.seen .hexd::before{background:#0C2A2E}
.ad-st.seen .hexd b{color:var(--lime)}
.ad-body{margin-top:14px;display:grid;gap:10px}
.ad-body h4{font-size:1.1rem;color:#fff}
.ad-body .where{font-family:var(--f-mono);font-size:.74rem;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase}
.ad-body ul{margin:0;padding-left:20px;color:#CFE0F5;display:grid;gap:5px}

/* curvas */
.cv-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cv-chip{padding:7px 13px;border-radius:6px;border:1px solid var(--line-2);background:rgba(255,255,255,.035);font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.cv-chip:hover{border-color:var(--cyan)}
.cv-chip.on{background:var(--cyan);color:#031018;border-color:var(--cyan);box-shadow:0 0 16px -2px var(--cyan)}
.cv-chip.seen:not(.on){border-color:rgba(91,255,170,.55);color:var(--lime)}
.cv-svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:#04101B}
.cv-ax{stroke:var(--line-2);stroke-width:1}
.cv-t{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.cv-ref{fill:none;stroke:rgba(255,255,255,.35);stroke-width:1.6;stroke-dasharray:4 4}
.cv-cur{fill:none;stroke:var(--cyan);stroke-width:3;filter:drop-shadow(0 0 5px var(--cyan));stroke-linejoin:round}
.cv-area{fill:url(#cvg)}
.cv-info{display:grid;gap:10px;margin-top:12px}
.cv-kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{padding:6px 11px;border:1px solid var(--line);border-radius:6px;font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.kpi b{color:var(--cyan)}
.pc{display:grid;gap:10px}
@media(min-width:620px){.pc{grid-template-columns:1fr 1fr}}
.pc h5{margin:0 0 5px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
.pc .p h5{color:var(--lime)} .pc .c h5{color:var(--red)}
.pc ul{margin:0;padding-left:18px;font-size:.93rem;color:#CFE0F5;display:grid;gap:3px}

/* receptor */
.rc-stage{border:1px solid var(--line-2);border-radius:10px;background:#04101B;overflow:hidden}
.rc-svg{display:block;width:100%;height:auto}
.rc-mem{fill:rgba(141,125,255,.25);stroke:var(--violet);stroke-width:2}
.rc-rec{fill:rgba(34,228,255,.14);stroke:var(--cyan);stroke-width:3;transition:all .4s}
.rc-ago,.rc-ant{transition:transform .7s cubic-bezier(.5,0,.2,1),opacity .4s}
.rc-ago rect{fill:var(--lime);stroke:#bfffe0;stroke-width:2}
.rc-ant rect{fill:var(--red);stroke:#ffc0c9;stroke-width:2}
.rc-ago text{fill:var(--lime);font-family:var(--f-mono);font-size:10px}
.rc-ant text{fill:var(--red);font-family:var(--f-mono);font-size:10px}
.rc-eff{opacity:0;transition:opacity .4s}
.rc-lab{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.rc-stage[data-s="livre"] .rc-ago{transform:translate(-110px,-60px);opacity:.25}
.rc-stage[data-s="livre"] .rc-ant{transform:translate(110px,-60px);opacity:.25}
.rc-stage[data-s="ago"] .rc-ago{transform:translate(0,0)}
.rc-stage[data-s="ago"] .rc-ant{transform:translate(110px,-60px);opacity:0}
.rc-stage[data-s="ago"] .rc-rec{fill:rgba(91,255,170,.3);stroke:var(--lime)}
.rc-stage[data-s="ago"] .rc-eff{opacity:1}
.rc-stage[data-s="ant"] .rc-ant{transform:translate(0,0)}
.rc-stage[data-s="ant"] .rc-ago{transform:translate(-110px,-60px);opacity:0}
.rc-stage[data-s="ant"] .rc-rec{fill:rgba(255,84,112,.25);stroke:var(--red)}
.rc-stage[data-s="disp"] .rc-ant{transform:translate(0,0)}
.rc-stage[data-s="disp"] .rc-ago{transform:translate(-48px,-52px);opacity:.9}
.rc-stage[data-s="disp"] .rc-rec{fill:rgba(255,84,112,.25);stroke:var(--red)}
.rc-btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

/* inspect / checkpoint */
.rx{border:1px solid var(--line-2);border-radius:10px;background:#04101B;overflow:hidden}
.rx-head{padding:10px 14px;background:rgba(34,228,255,.08);font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rx-row{display:grid;grid-template-columns:minmax(98px,.7fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
@media(max-width:560px){.rx-row{grid-template-columns:1fr auto}.rx-row .k{grid-column:1/-1}}
.rx-row .k{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rx-row .v{color:#fff;font-weight:500}
.rx-row .v.blank{color:var(--dim);font-style:italic}
.tg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.tg button{border:0;background:rgba(255,255,255,.04);padding:6px 11px;font-family:var(--f-mono);font-size:.72rem;font-weight:600;min-height:34px}
.tg button+button{border-left:1px solid var(--line-2)}
.tg button.on.good{background:var(--lime);color:#021}
.tg button.on.warn{background:var(--amber);color:#210}
.tg button:hover:not(.on){background:rgba(255,255,255,.1)}
.rx-row.res-ok{background:var(--lime-s)} .rx-row.res-bad{background:var(--red-s)}
.rx-row .why{grid-column:1/-1;font-size:.88rem;color:#FFD0D8}
.rx-foot{padding:12px 14px;border-top:1px solid var(--line)}
.cp-grid{display:grid;gap:0}
.cp-head,.cp-line{display:grid;grid-template-columns:minmax(96px,.8fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px}
.cp-head{background:rgba(34,228,255,.08);font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.cp-line{border-top:1px solid var(--line)}
.cp-line .nm{font-family:var(--f-display);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cp-line .a{color:#fff} .cp-line .b{color:#fff}
.cp-line.res-ok{background:var(--lime-s)} .cp-line.res-bad{background:var(--red-s)}
.cp-line .why{grid-column:1/-1;font-size:.88rem;color:#FFD0D8}
@media(max-width:620px){.cp-head{display:none}.cp-line{grid-template-columns:1fr 1fr}.cp-line .nm{grid-column:1/-1}.cp-line .tg{grid-column:1/-1}.cp-line .a::before{content:"Prescrição";display:block;color:var(--dim);font-size:.7rem;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em}.cp-line .b::before{content:"Em mãos";display:block;color:var(--dim);font-size:.7rem;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em}}
.cp-story{padding:10px 14px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--line)}
.cp-dec{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-top:1px solid var(--line)}
.btn-go{border-color:rgba(91,255,170,.6);background:var(--lime-s);color:var(--lime)}
.btn-go:hover{background:rgba(91,255,170,.22);border-color:var(--lime);box-shadow:0 0 18px -4px var(--lime)}
.btn-stop{border-color:rgba(255,84,112,.6);background:var(--red-s);color:var(--red)}
.btn-stop:hover{background:rgba(255,84,112,.22);border-color:var(--red);box-shadow:0 0 18px -4px var(--red)}

/* codex */
.cx-tools{display:grid;gap:10px;margin-bottom:12px}
.cx-search{width:100%;min-height:46px;padding:10px 14px;border-radius:8px;border:1px solid var(--line-2);background:#04101B;color:var(--ink);font:inherit}
.cx-search:focus{outline:2px solid var(--cyan);outline-offset:1px}
.cx-sys{display:flex;flex-wrap:wrap;gap:6px}
.cx-s{padding:5px 11px;border-radius:99px;border:1px solid var(--line-2);background:rgba(255,255,255,.035);font-size:.78rem;font-family:var(--f-mono)}
.cx-s.on{background:var(--cyan);color:#031018;border-color:var(--cyan)}
.cx-meter{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.76rem;color:var(--muted);margin-bottom:12px}
.cx-meter .bar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.cx-meter .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cyan));box-shadow:0 0 8px var(--lime);transition:width .4s}
.cx-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));max-height:640px;overflow:auto;padding:2px}
.cx-c{text-align:left;padding:12px 14px;border:1px solid var(--line-2);border-radius:8px;background:rgba(255,255,255,.035);width:100%;display:grid;gap:6px;align-content:start}
.cx-c:hover{border-color:var(--cyan)}
.cx-c .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cx-c b{font-family:var(--f-display);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:#fff;line-height:1.2}
.cx-c .sysn{font-family:var(--f-mono);font-size:.62rem;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.cx-c .fn{font-size:.9rem;color:#C5D8F0}
.cx-c.seen{border-color:rgba(91,255,170,.45)}
.cx-c.seen b::after{content:" ✓";color:var(--lime)}
.cx-det{display:none;gap:7px;margin-top:4px;padding-top:8px;border-top:1px dashed var(--line-2);font-size:.9rem}
.cx-c.open{grid-column:1/-1;background:var(--panel-2);border-color:var(--cyan)}
.cx-c.open .cx-det{display:grid}
.cx-ex{display:flex;flex-wrap:wrap;gap:6px}
.cx-ex span{padding:2px 9px;border-radius:99px;background:var(--violet-s);border:1px solid rgba(141,125,255,.4);font-size:.8rem}
.cx-care,.cx-al{padding:8px 10px;border-radius:6px;border-left:3px solid}
.cx-care{border-color:var(--cyan);background:var(--cyan-s)} .cx-al{border-color:var(--amber);background:var(--amber-s)}
.cx-care b,.cx-al b{display:block;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.cx-care b{color:var(--cyan)} .cx-al b{color:var(--amber)}
.cx-empty{padding:24px;text-align:center;color:var(--muted)}

/* insulina */
.in-chart{border:1px solid var(--line-2);border-radius:10px;background:#04101B;padding:12px 14px 6px}
.in-row{display:grid;grid-template-columns:116px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:10px;text-align:left;width:100%;background:none;border:0;padding:4px;border-radius:8px}
.in-row:hover,.in-row.on{background:rgba(34,228,255,.08)}
.in-row .nm{font-family:var(--f-mono);font-size:.72rem;line-height:1.25;color:var(--muted)}
.in-row.on .nm{color:var(--cyan)}
.in-track{position:relative;height:22px;border-radius:5px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 10%)}
.in-lat{position:absolute;top:8px;height:6px;border-radius:99px;background:rgba(255,255,255,.2)}
.in-act{position:absolute;top:3px;height:16px;border-radius:5px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,transparent));box-shadow:0 0 12px -2px var(--c)}
.in-ax{display:flex;justify-content:space-between;margin-left:126px;font-family:var(--f-mono);font-size:.64rem;color:var(--dim)}
.in-det{margin-top:12px}

/* fim da missão */
.m-end{display:grid;gap:14px;justify-items:start}
.m-end h3{font-size:1.2rem;color:#fff}
.m-end .prog{width:100%}
.m-end .prog .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.m-end .prog .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));box-shadow:0 0 10px var(--cyan);transition:width .5s}
.disclaimer{max-width:1120px;margin-inline:auto;margin-top:34px;padding:16px 18px;border:1px solid var(--line);border-radius:8px;font-size:.84rem;color:var(--muted);display:grid;gap:6px}
.disclaimer b{color:var(--ink)}
.foot-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* certificado */
.cert{position:relative;padding:28px 24px;border:1px solid var(--cyan);border-radius:12px;background:linear-gradient(135deg,#0A1A30,#0A1226);box-shadow:var(--glow);display:grid;gap:12px;text-align:center;justify-items:center}
.cert h3{font-size:1.5rem;letter-spacing:.14em}
.cert .nm{font-family:var(--f-display);font-size:1.6rem;color:#fff;min-height:1.4em;border-bottom:1px dashed var(--line-2);padding:0 20px}
.cert .meta{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.cert input{width:min(320px,100%);min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid var(--line-2);background:#04101B;color:var(--ink);font:inherit;text-align:center}
@media print{
  body>*:not(#cert-print){display:none!important}
  body{background:#fff!important;color:#000!important}
  body::before,body::after,#fx{display:none}
  #cert-print{display:block!important;position:static}
  .cert{background:#fff;color:#000;border:2px solid #000;box-shadow:none}
  .cert *{color:#000!important}
  .cert input,.cert .no-print,.cert .btn{display:none!important}
}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(2,6,14,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:rise .25s}
.modal-card{width:min(440px,100%);padding:30px 24px;text-align:center;display:grid;gap:12px;justify-items:center;background:linear-gradient(180deg,#0E1F38,#09121F);border:1px solid var(--cyan);border-radius:14px;box-shadow:0 0 60px -10px rgba(34,228,255,.6)}
.modal-card h3{font-size:1.4rem;color:#fff}
.hex-big{width:112px;height:124px;position:relative;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--amber),var(--magenta));animation:pulse 1.8s infinite}
.hex-big::before{content:"";position:absolute;inset:3px;clip-path:inherit;background:#0E1F38}
.hex-big .ico{position:relative;width:48px;height:48px;color:var(--amber)}
.selo-box .hex{display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line-2);position:relative}
.selo-box .hex::before{content:"";position:absolute;inset:2px;clip-path:inherit;background:#091426}
.selo-box .hex .ico{position:relative;width:22px;height:22px;color:var(--dim)}
.selo-box.on .hex{background:linear-gradient(160deg,var(--amber),var(--magenta))}
.selo-box.on .hex .ico{color:var(--amber)}

/* toasts e partículas */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%) translateY(20px);z-index:90;padding:11px 18px;border-radius:8px;border:1px solid var(--cyan);background:rgba(8,18,34,.96);box-shadow:var(--glow);font-family:var(--f-mono);font-size:.84rem;opacity:0;transition:all .3s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.big{border-color:var(--amber);box-shadow:0 0 28px -4px var(--amber);color:var(--amber)}
.float-pts{position:fixed;z-index:95;pointer-events:none;font-family:var(--f-display);font-weight:800;color:var(--amber);text-shadow:0 0 12px var(--amber);animation:flo 1.1s ease-out forwards}
@keyframes flo{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-54px)}}
.spark{position:fixed;z-index:96;width:8px;height:8px;border-radius:2px;pointer-events:none;animation:spk 1.2s ease-out forwards}
@keyframes spk{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(540deg)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---------- aula + abas ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0 22px;padding:5px;border:1px solid var(--line-2);border-radius:12px;background:rgba(6,13,26,.7);position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);z-index:30;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tab{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:8px 12px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font-family:var(--f-display);font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:left;transition:all .15s}
.tab span{display:grid;line-height:1.15}
.tab small{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;color:var(--dim);font-weight:500}
.tab .ico{width:22px;height:22px}
.tab .tk{color:var(--lime);width:18px;height:18px}
.tab:hover{background:rgba(34,228,255,.07);color:var(--ink)}
.tab.on{background:linear-gradient(135deg,rgba(34,228,255,.2),rgba(141,125,255,.18));border-color:var(--cyan);color:#fff;box-shadow:0 0 22px -8px var(--cyan)}
.tab.on small{color:var(--cyan)}
@media(max-width:520px){.tab{font-size:.68rem;gap:6px;padding:6px}.tab .ico:first-child{display:none}}
.lesson{gap:34px}
.les-intro p{font-size:1.08rem;color:#DCEBFF;margin-bottom:14px}
.toc{display:flex;flex-wrap:wrap;gap:8px}
.toc-b{cursor:pointer;color:var(--ink);text-align:left;font-family:inherit;font-size:.82rem}
.toc-b b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--cyan);color:#031018;font-family:var(--f-mono);font-size:.7rem}
.toc-b:hover{border-color:var(--cyan);background:var(--cyan-s)}
.les-sec{display:grid;gap:14px;scroll-margin-top:150px}
.les-eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--magenta)}
.les-h{font-size:clamp(1.3rem,4.4vw,1.75rem);color:#fff;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.les-body{display:grid;gap:18px}
.les-body .txt p{font-size:1.06rem;line-height:1.7}
.sub-title{font-size:1.02rem;color:var(--cyan);margin-bottom:8px;font-family:var(--f-display);letter-spacing:.04em}
.les-list{padding-left:22px;display:grid;gap:7px;color:#D4E4F8}
.les-list li::marker{color:var(--cyan)}
ol.les-list li::marker{font-family:var(--f-mono);font-weight:700}
.callout.exemplo{--c:var(--lime)}
.pense{padding:16px 18px;border-radius:10px;border:1px dashed var(--violet);background:var(--violet-s);display:grid;gap:10px;justify-items:start}
.pn-h{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
.pn-q{color:#fff;font-size:1.05rem}
.pn-a{padding:10px 14px;border-radius:8px;border-left:3px solid var(--lime);background:var(--lime-s);color:#E3FFEF;animation:rise .25s}
.fluxo{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.fl-step{flex:1 1 130px;display:grid;gap:3px;align-content:center;padding:12px 14px;border:1px solid var(--line-2);border-radius:8px;background:linear-gradient(160deg,rgba(34,228,255,.1),rgba(141,125,255,.08));text-align:center}
.fl-step b{font-family:var(--f-display);font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:#fff}
.fl-step span{font-size:.85rem;color:var(--muted)}
.fl-arr{display:grid;place-items:center;color:var(--cyan);flex:0 0 auto}
.fl-arr .ico{width:20px;height:20px}
@media(max-width:620px){.fluxo{flex-direction:column}.fl-arr{transform:rotate(90deg);height:20px}.fl-step{flex:none}}
.barra{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line-2)}
.br-seg{flex:1;padding:12px 8px;text-align:center;display:grid;gap:3px;align-content:center;min-width:0}
.br-seg b{font-family:var(--f-display);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:#fff}
.br-seg span{font-size:.78rem;color:rgba(255,255,255,.8)}
.br-seg.n{background:rgba(120,140,170,.32)} .br-seg.ok{background:rgba(91,255,170,.34)} .br-seg.al{background:rgba(255,194,75,.36)} .br-seg.x{background:rgba(255,84,112,.42)}
.rc-row{display:grid;grid-template-columns:minmax(100px,.7fr) minmax(0,1.2fr) minmax(0,1.6fr);gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}
.rc-row:first-child{border-top:0}
.rc-row .k{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rc-row .v{color:#fff;font-weight:600}
.rc-row .n{font-size:.88rem;color:var(--cyan)}
@media(max-width:620px){.rc-row{grid-template-columns:1fr;gap:2px}}
.resumo{border-color:rgba(91,255,170,.45);background:linear-gradient(180deg,rgba(91,255,170,.07),rgba(11,21,38,.85))}
.resumo .eyebrow{color:var(--lime)}
.resumo .les-h{margin:6px 0 14px}
.res-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.res-list li{display:grid;grid-template-columns:auto 1fr;gap:10px;color:#DFFFEF}
.res-list .ico{color:var(--lime);margin-top:4px}
.glos{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.gl{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:grid;gap:2px}
.gl b{font-family:var(--f-display);font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--cyan)}
.gl span{font-size:.92rem;color:#C5D8F0}
.lock{text-align:center;display:grid;gap:12px;justify-items:center;padding:36px 22px}
.lock-ic{width:64px;height:64px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--amber);background:var(--amber-s);color:var(--amber)}
.lock-ic .ico{width:30px;height:30px}
.lock h2{font-size:1.4rem;color:#fff}
.lock p{max-width:52ch;color:var(--muted)}
.lnk{background:none;border:0;padding:0;color:var(--cyan);text-decoration:underline;text-underline-offset:3px;font:inherit}

.disclaimer .credit{font-size:.95rem;color:var(--ink)}
.disclaimer .credit strong{color:var(--cyan)}
.refs{border-top:1px dashed var(--line-2);padding-top:10px;margin-top:4px}
.refs summary{cursor:pointer;font-family:var(--f-mono);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
.refs ul{margin:6px 0 10px;padding-left:20px;display:grid;gap:6px}
.refs p{margin:10px 0 2px}

<script id="data" type="application/json">{"meta":{"titulo":"FARMACORE","subtitulo":"Simulador de administração de medicamentos para técnicos de enfermagem","fonte":"Farmacologia — Técnico em Enfermagem, Módulo 1 (CETEP)","bonus":25,"niveis":[{"nome":"Recruta","a":0},{"nome":"Cadete","a":0.15},{"nome":"Operador","a":0.35},{"nome":"Especialista","a":0.6},{"nome":"Comandante","a":0.85}]},"missoes":[{"id":"m1","n":1,"titulo":"Vocabulário Farmacêutico","curto":"Vocabulário","sub":"Fármaco, droga, remédio: não são sinônimos.","min":8,"selo":"Decodificador","icone":"i-book","pulso":"Antes de administrar qualquer coisa, você precisa falar a língua da farmacologia. Vamos calibrar o seu vocabulário.","objetivo":"Diferenciar os conceitos básicos, reconhecer os quatro nomes de um medicamento e classificar formas farmacêuticas e origens.","treino":[{"t":"game","id":"g1-termo"},{"t":"game","id":"g1-nomes"},{"t":"game","id":"g1-forma"},{"t":"game","id":"g1-origem"}],"aula":{"tempo":14,"intro":"Nesta aula você começa do zero. Não é preciso saber nada de farmacologia: cada palavra nova é explicada antes de ser usada.","secoes":[{"titulo":"Por que um técnico de enfermagem estuda farmacologia?","blocos":[{"t":"texto","p":["Boa parte do seu trabalho vai ser **preparar e administrar medicamentos**. Quem decide qual medicamento o paciente recebe é o prescritor (em geral, o médico). Mas quem coloca o remédio no corpo do paciente é a enfermagem. Isso coloca em suas mãos o último passo da cadeia, e é nesse último passo que muitos erros se escondem.","Estudar farmacologia serve para você responder, antes de cada administração, quatro perguntas simples: **o que é isso? para que serve? como age no corpo? o que pode dar errado?** Quando você sabe responder, você deixa de ser alguém que apenas “cumpre ordens” e passa a ser uma barreira de segurança para o paciente."]},{"t":"callout","kind":"memo","titulo":"Ideia central do curso","texto":"Conhecer o medicamento é uma forma de cuidar do paciente. O que você aprende aqui te ajuda a notar um erro antes que ele aconteça."},{"t":"texto","titulo":"Um pouco de história","p":["As civilizações antigas misturavam **magia, religião e drogas** para tratar doenças. As drogas vinham de plantas ou animais e muitas vezes eram vistas como mágicas. Quem dominava esse conhecimento era respeitado e temido.","Com o tempo, o conhecimento sobre os medicamentos cresceu junto com outras ciências: a **anatomia** (como o corpo é feito), a **fisiologia** (como o corpo funciona), a **bioquímica** e a **química**. É por isso que a farmacologia de hoje se apoia na ciência, e não mais na crença."]}]},{"titulo":"O que é Farmacologia? Os dois grandes blocos","blocos":[{"t":"texto","p":["**Farmacologia** é a ciência que estuda os fármacos sob todos os aspectos: de onde vêm, como agem e quais são os seus efeitos no ser humano.","Para facilitar, ela é dividida em dois blocos. Eles vão aparecer em todas as aulas, então vale fixar a diferença com uma analogia:"]},{"t":"callout","kind":"exemplo","titulo":"Analogia da encomenda","texto":"Pense no medicamento como uma **encomenda**. A **farmacocinética** é a viagem da encomenda: ela entra, circula, é processada e sai. A **farmacodinâmica** é o que a encomenda faz quando chega à casa do destinatário."},{"t":"cards","cols":2,"itens":[{"t":"Farmacocinética","tag":"o caminho","d":"O que **o corpo faz com o fármaco**. Quatro etapas: absorção, distribuição, biotransformação e excreção. É o assunto da missão 4."},{"t":"Farmacodinâmica","tag":"a ação","d":"O que **o fármaco faz no corpo**: onde age, como age e qual efeito produz. É o assunto da missão 3."}]},{"t":"pense","q":"Se eu pergunto “quanto tempo o remédio demora para sair do corpo?”, a pergunta é de farmacocinética ou de farmacodinâmica?","a":"Farmacocinética. Ela trata do caminho do fármaco no corpo, incluindo a saída (excreção)."}]},{"titulo":"Cinco palavras que parecem iguais, mas não são","blocos":[{"t":"texto","p":["No dia a dia, as pessoas usam “remédio”, “medicamento” e “droga” como se fossem a mesma coisa. Na farmacologia, cada palavra tem um significado próprio. Vamos entender uma de cada vez."]},{"t":"cards","cols":1,"itens":[{"t":"Fármaco","tag":"do grego pharmacon, “remédio”","d":"É a **substância química** de estrutura conhecida e capaz de **modificar uma função que o corpo já tem**. Exemplo: o paracetamol, como molécula, é um fármaco."},{"t":"Medicamento","tag":"do latim medicamentum","d":"É o fármaco que tem **benefícios comprovados cientificamente** e é apresentado de forma adequada ao uso (comprimido, ampola, xarope). Exemplo: o comprimido de paracetamol vendido na farmácia."},{"t":"Droga","tag":"do inglês drug","d":"Qualquer substância que **modifica a função do corpo, com ou sem intenção de fazer bem**. Na farmacologia a palavra é mais ampla do que no uso popular, em que costuma lembrar substâncias ilícitas."},{"t":"Remédio","tag":"re + medior, “curar de novo”","d":"É **tudo o que se usa em benefício da saúde**. Pode ser uma substância (animal, vegetal, mineral, sintética), mas também um procedimento (massagem, banho, acupuntura), a fé, a crença ou a influência de alguém."},{"t":"Placebo","tag":"do latim placeo, “agradar”","d":"É algo feito com **intenção de aliviar o sofrimento**, mesmo em concentração mínima ou sem nenhum princípio ativo. Pode ser uma preparação inativa dada para satisfazer a necessidade psicológica de “tomar alguma coisa”."}]},{"t":"callout","kind":"memo","titulo":"A frase que resume","texto":"**Todo medicamento é um fármaco, mas nem todo fármaco é um medicamento.** Medicamento é o fármaco que já provou, pela ciência, que faz bem."},{"t":"pense","q":"Uma massagem relaxante pode ser chamada de remédio? E de medicamento?","a":"De remédio, sim, porque remédio é tudo o que se usa em benefício da saúde, inclusive procedimentos. De medicamento, não: medicamento é um fármaco com benefício comprovado, e massagem não é substância."}]},{"titulo":"O que tem dentro de um medicamento?","blocos":[{"t":"texto","p":["Um comprimido não é feito só da substância que trata. Ele é uma mistura de componentes, chamada de **fórmula farmacêutica**. Pense num suco: a fruta é o que dá o sabor e o valor nutritivo, a água dá volume, e o açúcar corrige o gosto."]},{"t":"cards","cols":3,"itens":[{"t":"Princípio ativo","tag":"a fruta","d":"A substância que **tem a ação farmacológica**. É o que trata. É isolada de um órgão animal, de um vegetal ou produzida em laboratório."},{"t":"Corretivo","tag":"o açúcar","d":"Corrige sabor, cor e aspecto: sabor, corantes e açúcares."},{"t":"Veículo","tag":"a água","d":"Dá volume e corpo ao produto: talco, pós e outros."}]},{"t":"callout","kind":"atencao","titulo":"Por que isso importa para você","texto":"Quando uma prescrição, uma caixa ou um colega falam de um medicamento, o que importa para a segurança é o **princípio ativo**. Dois produtos com nomes diferentes podem ter o mesmo princípio ativo, e dois produtos com nomes parecidos podem ter princípios ativos totalmente diferentes."},{"t":"texto","titulo":"Alguns outros conceitos do módulo","p":["Você vai encontrar estes termos em bulas, prescrições e na rotina do serviço:"]},{"t":"cards","cols":2,"itens":[{"t":"Medicamento simples","d":"Feito a partir de **um único fármaco**. Exemplo: xarope de vitamina C."},{"t":"Medicamento composto","d":"Feito a partir de **vários fármacos**. Exemplo: comprimido de ácido salicílico com cafeína."},{"t":"Uso externo","d":"Aplicado na **superfície do corpo ou nas mucosas**. Exemplos: cremes e xampus."},{"t":"Uso interno","d":"Administrado **dentro do organismo**, pela boca ou pelas cavidades naturais (vagina, nariz, ânus, ouvidos, olhos)."},{"t":"Medicamento oficial","d":"Aquele que está **oficializado nas monografias** (livros oficiais)."},{"t":"Medicamento oficinal ou de manipulação","d":"Preparado **na própria farmácia**, segundo normas e doses de farmacopeia ou formulário."},{"t":"Medicamento homeopático","d":"Preparado a partir de substâncias naturais dos reinos **animal, vegetal e mineral**, e não apenas de plantas, como muita gente acredita."},{"t":"Medicamento placebo","d":"Substância ou preparação **inativa**, dada para satisfazer a necessidade psicológica do paciente de tomar um remédio."}]}]},{"titulo":"Os quatro nomes de um medicamento","blocos":[{"t":"texto","p":["Um mesmo medicamento pode aparecer na prescrição, no rótulo e na caixa com **nomes diferentes**. Se você não sabe disso, pode achar que são remédios distintos e dar duas vezes a mesma coisa, ou o contrário, achar que são o mesmo quando não são.","O exemplo do módulo é o **paracetamol**:"]},{"t":"tabela","cab":["Nome","O que é","Exemplo (paracetamol)"],"linhas":[["Nome químico","Descreve a estrutura da molécula. É longo e usado por químicos.","N-acetil-p-aminofenol"],["Nome oficial","O que consta nos livros oficiais (farmacopeias).","paracetamol"],["Nome genérico","O nome do **princípio ativo**. É aceito no mundo todo e não pertence a nenhuma marca.","paracetamol"],["Nome comercial","O nome que o **laboratório dá ao seu produto**. Outro laboratório não pode usar o mesmo nome.","Tylenol®"]]},{"t":"texto","p":["Outros termos que vão aparecer: a **denominação genérica** é o nome de aceitação universal usado para o princípio ativo sem marca; o **nome de marca** é de propriedade do fabricante, que tem direitos de patente sobre a comercialização; o **medicamento de referência** é o produto que está no mercado há bastante tempo e serve de modelo de comparação; e o **medicamento similar** tem o mesmo fármaco, concentração, forma farmacêutica e via do medicamento de referência, mas **não tem comprovada a bioequivalência** com ele. Na missão 6 você vai entender esses dois últimos em detalhe."]},{"t":"callout","kind":"exemplo","titulo":"Como ler uma caixa de remédio","texto":"Procure sempre **duas** informações: o nome grande (comercial, quando existe) e, logo abaixo ou ao lado, o **nome do princípio ativo**. Se o nome comercial da caixa não é o que está na prescrição, confira se o princípio ativo é o mesmo antes de seguir. Na dúvida, pergunte ao enfermeiro ou ao farmacêutico."},{"t":"pense","q":"A prescrição pede “paracetamol” e a caixa diz “Tylenol”. Pode ser o mesmo medicamento?","a":"Sim. Paracetamol é o nome genérico (princípio ativo) e Tylenol é um nome comercial. Mas só se confirma olhando o princípio ativo escrito na caixa."}]},{"titulo":"Formas farmacêuticas: como o medicamento se apresenta","blocos":[{"t":"texto","p":["**Forma farmacêutica** é a maneira física pela qual o medicamento chega até você. É a diferença entre um comprimido, um xarope e um spray, mesmo que o princípio ativo seja o mesmo. A forma importa porque ela influencia **por onde** o remédio entra e **com que velocidade** age.","Os medicamentos são encontrados em três estados físicos: sólido, líquido e gasoso."]},{"t":"cards","titulo":"Sólidos","cols":2,"itens":[{"t":"Comprimido","d":"Consistência sólida e formato variável, obtido por compressão da substância medicamentosa em moldes."},{"t":"Pó","d":"Tomado em colheradas ou acondicionado em sachês."},{"t":"Drágea","d":"O princípio ativo fica no **núcleo**, com revestimento de goma-laca, açúcar e corante. Usada quando o sabor é desagradável, quando a absorção deve ocorrer no intestino ou quando o fármaco agride a mucosa."},{"t":"Cápsula","d":"O medicamento fica dentro de um **invólucro de gelatina**, que elimina o sabor desagradável, facilita a deglutição e/ou a liberação."},{"t":"Pastilha","d":"Sólido de forma circular, com o princípio ativo unido a açúcar e mucilagem, para **dissolver devagar na boca**."},{"t":"Supositório","d":"Cônico ou oval, para **via retal**. Pode ter ação local ou sistêmica. Também chamado óvulo ou lápis, conforme o formato e o uso."},{"t":"Pomada","d":"Forma pastosa ou semissólida, de veículo oleoso, em que o princípio ativo é o pó."},{"t":"Creme","d":"Exclusivo para uso tópico: na pele, vaginal e retal."}]},{"t":"cards","titulo":"Líquidos","cols":2,"itens":[{"t":"Solução","d":"Mistura homogênea de líquidos, ou de um líquido com um sólido."},{"t":"Xarope","d":"Solução que contém **dois terços de açúcar**."},{"t":"Elixir","d":"Preparação líquida **hidroalcoólica**, açucarada ou glicerinada, de uso oral, com substâncias aromáticas e medicamentosas."},{"t":"Emulsão","d":"Preparação feita de **dois líquidos que não se misturam**, óleo e água."},{"t":"Colírio","d":"Solução aquosa para uso na **mucosa ocular**."}]},{"t":"cards","titulo":"Gasosos","cols":2,"itens":[{"t":"Gás","d":"Oxigênio, carbogênio e outros gases medicinais."},{"t":"Aerossol","d":"O medicamento é liberado em forma de névoa por um spray. Exemplo: o spray de salbutamol."}]},{"t":"callout","kind":"atencao","titulo":"Revestimento tem motivo","texto":"Drágeas e cápsulas existem por razões como sabor, proteção da mucosa, absorção no intestino ou liberação lenta. **Não corte, macere ou abra** sem antes confirmar com o enfermeiro ou o farmacêutico."},{"t":"pense","q":"Por que um fabricante faria uma drágea em vez de um comprimido simples?","a":"Porque o fármaco pode ter sabor desagradável, precisar ser absorvido só no intestino ou irritar a mucosa. O revestimento resolve esses problemas."}]},{"titulo":"De onde vêm os medicamentos?","blocos":[{"t":"texto","p":["Segundo a origem, os medicamentos podem ser de três tipos:"]},{"t":"cards","cols":3,"itens":[{"t":"Naturais","tag":"da natureza","d":"**Extraídos** de órgãos, glândulas, plantas ou peçonhas de animais."},{"t":"Sintéticos","tag":"do laboratório","d":"Preparados com auxílio de matéria-prima natural, mas resultado **exclusivamente do trabalho de laboratório**. Exemplo: alguns antibióticos."},{"t":"Semissintéticos","tag":"natural + laboratório","d":"Resultam de **alterações em substâncias naturais**, feitas para modificar as características da ação."}]},{"t":"pense","q":"Uma substância extraída de uma planta é depois modificada em laboratório para agir por mais tempo. Qual é a origem?","a":"Semissintética: parte de uma substância natural, que é alterada para mudar as características da ação."}]}],"resumo":["Farmacologia estuda os fármacos. Farmacocinética é o caminho do fármaco no corpo; farmacodinâmica é o que ele faz no corpo.","Fármaco é a substância; medicamento é o fármaco com benefício comprovado; droga modifica a função com ou sem intenção benéfica; remédio é tudo o que se usa em benefício da saúde; placebo alivia o sofrimento sem (ou com pouquíssimo) princípio ativo.","Fórmula farmacêutica = princípio ativo + corretivo + veículo.","Um medicamento tem nome químico, oficial, genérico (princípio ativo) e comercial (marca do laboratório). Na dúvida, confira o princípio ativo.","Formas farmacêuticas: sólidas (comprimido, drágea, cápsula, pastilha, supositório, pomada), líquidas (solução, xarope, elixir, emulsão, colírio) e gasosas (gases e aerossóis).","Origem: natural, sintética ou semissintética."],"glossario":[{"t":"Princípio ativo","d":"A substância do medicamento que tem a ação farmacológica."},{"t":"Forma farmacêutica","d":"A maneira física de apresentação (comprimido, xarope, colírio...)."},{"t":"Fórmula farmacêutica","d":"O conjunto de componentes do produto: princípio ativo, corretivo e veículo."},{"t":"Farmacopeia","d":"Livro oficial que reúne normas e informações sobre os medicamentos."},{"t":"Mucosa","d":"Camada úmida que reveste o interior de órgãos e cavidades, como a boca e o nariz."},{"t":"Tópico","d":"De uso na superfície do corpo, como na pele."}]}},{"id":"m2","n":2,"titulo":"Dose e Janela Terapêutica","curto":"Dose","sub":"A diferença entre remédio e veneno é a dose.","min":8,"selo":"Fiel da Balança","icone":"i-scale","pulso":"Dose é o botão de volume do medicamento. Muito baixo, não faz nada. Muito alto, machuca. Vamos achar a janela certa.","objetivo":"Distinguir dose mínima, máxima, tóxica e letal; listar fatores que modificam a dose; reconhecer adição, potencialização, antagonismo e efeitos indesejados.","treino":[{"t":"game","id":"g2-janela"},{"t":"game","id":"g2-fatores"},{"t":"game","id":"g2-efeitos"}],"aula":{"tempo":14,"intro":"Aqui você aprende o que é dose, como ler uma dose na prescrição e por que a mesma quantidade pode ser segura para uma pessoa e perigosa para outra.","secoes":[{"titulo":"O que é dose?","blocos":[{"t":"texto","p":["**Dose** é a quantidade de uma droga que, quando administrada ao organismo, produz um efeito terapêutico. **Posologia** é o estudo das doses de administração dos medicamentos: quanto, quantas vezes, por quanto tempo.","Pense no volume do rádio. Muito baixo, você não escuta nada. No ponto certo, escuta bem. Alto demais, machuca o ouvido. Com os medicamentos acontece o mesmo: **a dose é o botão de volume**."]},{"t":"texto","titulo":"Lendo uma dose: mg, g, mL e concentração","p":["Antes de seguir, vale conhecer as unidades que aparecem na prescrição e nos rótulos:"]},{"t":"cards","cols":2,"itens":[{"t":"mg e g","d":"**mg** é miligrama e **g** é grama. Como 1 g = 1.000 mg, uma dose de 1 g é a mesma que 1.000 mg."},{"t":"mL","d":"**mL** é mililitro, uma medida de volume de líquido. Ampolas e frascos trazem o volume em mL."},{"t":"Concentração","d":"Diz **quanto fármaco existe em cada mL**. “500 mg/mL” significa 500 mg de fármaco em cada mL de líquido."},{"t":"Apresentação","d":"É a forma como o produto vem: “comprimido de 40 mg”, “ampola de 2 mL”, “frasco de 100 mL”. Dose prescrita e apresentação nem sempre falam a mesma língua."}]},{"t":"callout","kind":"exemplo","titulo":"Exemplo passo a passo","texto":"A prescrição pede **1 g** de um medicamento. A ampola do estoque é de **500 mg/mL**. Como 1 g = 1.000 mg, e cada mL tem 500 mg, são necessários **2 mL** (2 × 500 = 1.000). Se você preparasse 4 mL, estaria dando o dobro da dose."},{"t":"callout","kind":"nota","titulo":"Cálculo de medicação","texto":"Este exemplo serve só para você entender a lógica. O cálculo de doses é um assunto à parte do curso. Na prática, **confira sempre o resultado com o protocolo da instituição e, quando exigido, com outro profissional**."}]},{"titulo":"As quatro doses e a janela terapêutica","blocos":[{"t":"texto","p":["O módulo classifica as doses em quatro tipos. Imagine uma régua que vai de “quase nada” até “perigoso”: cada dose marca um ponto dessa régua."]},{"t":"barra","titulo":"A régua da dose","segs":[{"n":"Sem efeito","c":"n","d":"Abaixo da dose mínima"},{"n":"Terapêutica","c":"ok","d":"Entre a mínima e a máxima"},{"n":"Tóxica","c":"al","d":"Acima da máxima"},{"n":"Letal","c":"x","d":"Pode causar a morte"}]},{"t":"cards","cols":2,"itens":[{"t":"Dose mínima","tag":"onde o efeito começa","d":"É a **menor quantidade** de um medicamento capaz de produzir o efeito terapêutico. Abaixo dela, o tratamento não funciona."},{"t":"Dose máxima","tag":"o limite seguro","d":"É a **maior quantidade** capaz de produzir o efeito terapêutico. Se for ultrapassada, aparecem efeitos tóxicos no organismo doente."},{"t":"Dose tóxica","tag":"zona de perigo","d":"É a quantidade que **ultrapassa a dose máxima**, causando perturbações e intoxicação, que podem chegar à morte."},{"t":"Dose letal","tag":"zona fatal","d":"É a quantidade de um medicamento que **causa a morte**."}]},{"t":"texto","p":["A faixa que fica entre a dose mínima e a dose máxima é o que se costuma chamar de **janela terapêutica**: é nela que o medicamento faz o efeito desejado com segurança. O objetivo da prescrição é manter o paciente dentro dessa janela."]},{"t":"callout","kind":"atencao","titulo":"Por que “dose certa” é um dos 5 certos","texto":"Uma dose errada não é só um número errado. Ela pode empurrar o paciente para fora da janela: para baixo (o tratamento falha) ou para cima (intoxicação). Para alguns fármacos, a janela é estreita e a margem de erro é pequena."},{"t":"pense","q":"O paciente tomou uma dose menor do que a dose mínima. Ele ficou intoxicado?","a":"Não. Abaixo da dose mínima o problema é outro: o efeito terapêutico não aparece e o tratamento não funciona. A intoxicação vem de doses acima da máxima."}]},{"titulo":"Quem muda a dose? Os nove fatores do módulo","blocos":[{"t":"texto","p":["A mesma dose não vale para todo mundo. O módulo lista **nove fatores** que modificam a dosagem. A explicação de cada um ajuda a entender por que a prescrição é individual:"]},{"t":"cards","cols":2,"itens":[{"t":"Idade","d":"Crianças e idosos absorvem, metabolizam e eliminam os fármacos de forma diferente dos adultos."},{"t":"Peso corporal","d":"Um corpo maior distribui o fármaco em mais volume. Em muitos casos a dose depende do peso."},{"t":"Sexo","d":"Diferenças do organismo entre homens e mulheres podem influenciar a resposta."},{"t":"Condições do paciente","d":"Doenças, estado nutricional e o funcionamento do **fígado, dos rins, do coração e do intestino** alteram a resposta."},{"t":"Fatores psicológicos","d":"Expectativa, ansiedade e crença influenciam o efeito percebido, como no placebo."},{"t":"Fatores ambientais","d":"O ambiente em que o paciente está pode influenciar a resposta ao medicamento."},{"t":"Temperatura","d":"Mudanças de temperatura corporal ou do ambiente podem alterar a absorção e o efeito."},{"t":"Método de administração","d":"A via e a técnica mudam quanto do fármaco chega ao sangue e com que rapidez."},{"t":"Fatores genéticos","d":"As enzimas que processam os fármacos variam de pessoa para pessoa, por herança genética."}]},{"t":"callout","kind":"memo","titulo":"Lição de enfermagem","texto":"Você não decide a dose, mas pode **perceber sinais** de que o paciente é diferente do esperado: idoso frágil, criança, doença renal ou hepática, paciente muito magro. Esses sinais devem ser comunicados ao enfermeiro."}]},{"titulo":"Quando medicamentos se encontram: adição, potencialização, antagonismo","blocos":[{"t":"texto","p":["Muitos pacientes tomam **vários medicamentos ao mesmo tempo**. Eles podem se ajudar, se atrapalhar ou se somar. O módulo traz os conceitos básicos dessas combinações:"]},{"t":"cards","cols":1,"itens":[{"t":"Adição","tag":"1 + 1 = 2","d":"É o **efeito combinado** de dois fármacos: um soma o seu efeito ao do outro."},{"t":"Potencialização","tag":"1 + 1 = 3","d":"Ocorre quando um fármaco **aumenta ou prolonga a ação** de outro."},{"t":"Antagonismo","tag":"um freia, outro acelera","d":"Duas ou mais substâncias administradas têm **efeito contrário**: uma reduz ou anula o efeito da outra."}]},{"t":"pense","q":"Um paciente usa um remédio que acelera o coração e outro que o desacelera. Que conceito se aplica?","a":"Antagonismo: os dois têm efeitos contrários."}]},{"titulo":"Efeitos que fogem do plano","blocos":[{"t":"texto","p":["Todo medicamento faz **o que foi escolhido para fazer** (o efeito terapêutico) e pode fazer **outras coisas** também. O módulo é direto: **não existem medicamentos sem efeitos colaterais, apenas medicamentos com efeitos colaterais de maior ou menor intensidade**."]},{"t":"cards","cols":1,"itens":[{"t":"Efeito adverso ou indesejado","d":"Uma **ação diferente do efeito planejado**."},{"t":"Efeito colateral","d":"Efeito **imprevisível**, que não está relacionado à principal ação do fármaco."},{"t":"Efeito cumulativo","d":"A eliminação do medicamento é **mais lenta do que a absorção**, e a concentração vai aumentando no organismo."}]},{"t":"callout","kind":"exemplo","titulo":"Analogia da banheira","texto":"Imagine uma banheira com a torneira aberta e um ralo pequeno. Se a água entra mais rápido do que sai, o nível sobe. Um medicamento **cumulativo** funciona assim: se cada dose entra mais rápido do que o corpo elimina, o nível no organismo vai subindo, até chegar à zona tóxica. A **digitalina** (digitálico) é o exemplo clássico do módulo."},{"t":"callout","kind":"atencao","titulo":"O que fazer diante de um efeito inesperado","texto":"Observe o paciente, **não ignore** queixas novas depois de um medicamento e **comunique** ao enfermeiro. Deixar de comunicar um efeito indesejado é uma forma de negligência (você vai ver na missão 7)."},{"t":"pense","q":"Por que um medicamento cumulativo exige mais atenção às doses anteriores?","a":"Porque o que foi dado antes ainda está no corpo. Se o organismo elimina mais devagar do que absorve, a soma das doses pode chegar a níveis tóxicos mesmo que cada dose isolada pareça normal."}]}],"resumo":["Dose é a quantidade que produz o efeito terapêutico; posologia estuda as doses.","1 g = 1.000 mg. Concentração diz quanto fármaco há em cada mL (ex.: 500 mg/mL).","Dose mínima = menor quantidade com efeito; máxima = maior quantidade com efeito; tóxica = acima da máxima; letal = causa a morte. A janela terapêutica fica entre a mínima e a máxima.","Nove fatores modificam a dose: idade, sexo, condições do paciente, fatores psicológicos, ambientais, temperatura, método de administração, fatores genéticos e peso corporal.","Adição soma efeitos; potencialização aumenta ou prolonga a ação de outro fármaco; antagonismo é efeito contrário.","Efeito adverso é ação diferente da planejada; efeito colateral é imprevisível e sem relação com a ação principal; cumulativo é quando a eliminação é mais lenta que a absorção (ex.: digitalina)."],"glossario":[{"t":"Posologia","d":"Estudo das doses: quanto, quantas vezes e por quanto tempo."},{"t":"Janela terapêutica","d":"Faixa de dose entre a mínima e a máxima, em que o efeito é obtido com segurança."},{"t":"Intoxicação","d":"Conjunto de efeitos nocivos causados por quantidade excessiva de uma substância."},{"t":"Terapêutico","d":"Relativo ao tratamento. Efeito terapêutico é o efeito desejado."},{"t":"Concentração","d":"Quantidade de fármaco por volume de líquido, como mg/mL."}]}},{"id":"m3","n":3,"titulo":"Ação no Organismo","curto":"Ação","sub":"Onde o medicamento age e como ele conversa com as células.","min":9,"selo":"Mapa Molecular","icone":"i-target","pulso":"Esta é a farmacodinâmica: o que o fármaco faz no corpo. Spoiler: ele precisa de uma “fechadura” para funcionar.","objetivo":"Diferenciar ação local, sistêmica, remota e local-geral; reconhecer os tipos de ação terapêutica; entender agonistas e antagonistas.","treino":[{"t":"game","id":"g3-acao"},{"t":"game","id":"g3-tipos"},{"t":"game","id":"g3-terapeutica"},{"t":"game","id":"g3-receptor"},{"t":"game","id":"g3-agonista"}],"aula":{"tempo":15,"intro":"Esta é a aula de farmacodinâmica: o que o fármaco faz no corpo. Vamos começar pelo básico: onde o medicamento age e como ele “conversa” com as células.","secoes":[{"titulo":"Farmacodinâmica: o que o fármaco faz no corpo","blocos":[{"t":"texto","p":["**Farmacodinâmica** é o estudo dos mecanismos pelos quais as drogas produzem alterações **bioquímicas ou fisiológicas** no organismo. Em linguagem simples: ela responde às perguntas **onde o fármaco age**, **como age** e **qual é o efeito**.","A ação começa em escala minúscula, dentro e ao redor das células. O fármaco encontra componentes celulares, como **proteínas, enzimas ou receptores**, e interage com eles. A resposta que vem dessa interação é o **efeito** do medicamento."]},{"t":"fluxo","titulo":"Do fármaco ao efeito","passos":[{"t":"Fármaco","d":"chega ao local"},{"t":"Alvo celular","d":"proteína, enzima ou receptor"},{"t":"Interação","d":"o fármaco “conversa” com o alvo"},{"t":"Efeito","d":"a resposta do organismo"}]},{"t":"callout","kind":"memo","titulo":"Diferença que não pode confundir","texto":"**Ação** é a interação do fármaco com o alvo na célula. **Efeito** é a resposta que resulta dessa ação. Ex.: a ação é ocupar o receptor; o efeito é o coração bater mais forte."}]},{"titulo":"Onde o medicamento age?","blocos":[{"t":"texto","p":["Um medicamento pode agir **só no ponto em que foi colocado** ou pode **viajar pelo sangue** até outro lugar. Uma pergunta ajuda a distinguir: **o fármaco precisa cair na corrente sanguínea para funcionar?**"]},{"t":"cards","cols":1,"itens":[{"t":"Ação local","tag":"não passa pelo sangue","d":"O fármaco exerce o efeito **no local da aplicação**, sem passar pela corrente sanguínea. Exemplos: pomadas e colírios. Pode ocorrer na pele (pomada em uma ferida) ou nas mucosas (supositório retal, aplicação vaginal, colírio na conjuntiva)."},{"t":"Ação sistêmica ou geral","tag":"passa pelo sangue","d":"O fármaco é **absorvido**, entra na **corrente sanguínea** e por ela chega ao órgão ou tecido sobre o qual age. Exemplo: antibióticos."},{"t":"Ação remota","tag":"um órgão estimula outro","d":"O efeito aparece em **partes distantes** do organismo: uma droga estimula um órgão, que por sua vez estimula outro. Exemplo do módulo: a digitalina age no coração, aumenta a circulação e, com isso, aumenta a atividade diurética (a produção de urina)."},{"t":"Ação local-geral","tag":"começa local e vira geral","d":"Uma droga aplicada produz **efeito local**, é **absorvida** e provoca também **efeito geral**. Exemplo do módulo: a epinefrina aplicada na mucosa nasal estanca a hemorragia local, é absorvida pela circulação e aumenta a pressão arterial."}]},{"t":"pense","q":"Um colírio é pingado no olho e alivia a irritação ali mesmo, sem precisar entrar no sangue. Que tipo de ação é?","a":"Ação local. O efeito ocorre no local da aplicação, na mucosa ocular."}]},{"titulo":"Seis jeitos de agir localmente","blocos":[{"t":"texto","p":["Quando a ação é local, ela pode ter diferentes finalidades. O módulo lista seis tipos:"]},{"t":"cards","cols":2,"itens":[{"t":"Antisséptico","d":"**Impede o desenvolvimento** de micro-organismos. Exemplos: álcool iodado e clorexidina."},{"t":"Adstringente","d":"**Contrai** o tecido. Exemplo: loção para fechar os poros."},{"t":"Irritante","d":"Medicamento que **irrita os tecidos**."},{"t":"Paliativo","d":"Aplicado no local para **aliviar a dor**."},{"t":"Emoliente","d":"**Lubrifica e amolece** o tecido."},{"t":"Anestésico","d":"**Paralisa as terminações nervosas sensoriais**, tirando a sensibilidade no local."}]}]},{"titulo":"Cinco jeitos de agir no corpo todo","blocos":[{"t":"texto","p":["Na ação sistêmica, o fármaco precisa ser absorvido e entrar no sangue. Aqui o módulo destaca cinco tipos:"]},{"t":"cards
