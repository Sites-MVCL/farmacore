<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="Cybele França Brito">
<meta name="theme-color" content="#050A14">
<title>FARMACORE — Administração de Medicamentos</title>
<meta name="description" content="Trilha interativa e gamificada de farmacologia para técnicos de enfermagem: 9 missões, simuladores e desafio final sobre administração de medicamentos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Orbitron:wght@500;600;700;800;900&display=swap">
<style>
/*{{CSS}}*/
</style>
</head>
<body data-view="mapa">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M2 12h4l2.5-7 4 14 3-9 1.5 2H22"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6M9 12h6"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 3v18M7 21h10M5 7h14"/><path d="M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></symbol>
    <symbol id="i-dna" viewBox="0 0 24 24"><path d="M7 3c0 6 10 6 10 12s-10 6-10 6M17 3c0 6-10 6-10 12M8.5 7.5h7M8.5 16.5h7"/></symbol>
    <symbol id="i-syringe" viewBox="0 0 24 24"><path d="M15 4l5 5M13 6l5 5M11 8l5 5-8 8-5-5zM6 14l3 3M3 21l3-3M17 3l4 4"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3M7.5 15h9"/></symbol>
    <symbol id="i-medal" viewBox="0 0 24 24"><circle cx="12" cy="14" r="6"/><path d="M8.5 3l3.5 6 3.5-6M9.5 14l2 2 3-3.5"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></symbol>
    <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 5 1V5a2 2 0 0 0-2-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-5 1V5a2 2 0 0 1 2-1z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-pill" viewBox="0 0 24 24"><rect x="2" y="8.5" width="20" height="7" rx="3.5" transform="rotate(-35 12 12)"/><path d="M9.4 6.3l5.5 7.9" transform="rotate(0)"/></symbol>
  </defs>
</svg>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="hud" id="hud">
  <button class="hud-brand" id="brand" aria-label="Ir para o mapa de missões">
    <svg class="ico"><use href="#i-pulse"/></svg><span class="brand-name">FARMA<b>CORE</b></span>
  </button>
  <div class="hud-stats">
    <span class="stat stat-xp" id="st-xp" title="Pontos de experiência"><svg class="ico"><use href="#i-bolt"/></svg><b id="v-xp">0</b><span class="stat-u">XP</span></span>
    <span class="stat stat-lvl" id="st-lvl" title="Patente"><svg class="ico"><use href="#i-star"/></svg><span class="lvl-k">Patente</span><b id="v-lvl">Recruta</b></span>
    <span class="stat stat-selo" title="Selos conquistados"><svg class="ico"><use href="#i-medal"/></svg><b id="v-selo">0/10</b></span>
    <button class="btn-map" id="btn-map"><svg class="ico"><use href="#i-map"/></svg><span>Mapa</span></button>
  </div>
  <div class="hud-bar" aria-hidden="true"><span id="hud-bar"></span></div>
</header>

<main id="app" class="view" tabindex="-1" aria-live="polite"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>
<div id="cert-print" hidden></div>

<script id="data" type="application/json">{{DATA}}</script>
<script>
/*{{JS}}*/
</script>
</body>
</html>
